class Input {
    constructor(el) {
        this.el = el;
        this.keys = new Set();
        this.pressed = [];
        this.dx = this.dy = this.wheel = 0;
        this.mouse = [0, 0];
        this.looking = false;
        this.clicks = [];
        el.addEventListener('contextmenu', e => e.preventDefault());
        el.addEventListener('pointerdown', e => {
            el.setPointerCapture(e.pointerId);
            if (e.button === 2 || (e.button === 0 && e.ctrlKey)) this.clicks.push([e.clientX, e.clientY]);
            else if (e.button === 0) { this.looking = true; el.classList.add('drag'); }
        });
        el.addEventListener('pointermove', e => {
            this.mouse = [e.clientX, e.clientY];
            if (this.looking) { this.dx += e.movementX; this.dy += e.movementY; }
        });
        const up = () => { this.looking = false; el.classList.remove('drag'); };
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
        el.addEventListener('wheel', e => { e.preventDefault(); this.wheel += Math.sign(e.deltaY); }, { passive: false });
        window.addEventListener('keydown', e => {
            if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            if (!e.repeat) this.pressed.push(e.code);
            this.keys.add(e.code);
        });
        window.addEventListener('keyup', e => this.keys.delete(e.code));
        window.addEventListener('blur', () => { this.keys.clear(); up(); });
    }

    consume() {
        const r = { dx: this.dx, dy: this.dy, wheel: this.wheel, pressed: this.pressed, clicks: this.clicks };
        this.dx = this.dy = this.wheel = 0;
        this.pressed = [];
        this.clicks = [];
        return r;
    }
}

class FlyCamera {
    constructor() {
        this.pos = [0, 3000, 0];
        this.yaw = 0;
        this.pitch = 0;
        this.fov = 60 * DEG;
        this.speed = 400;
    }

    basis() {
        const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw), cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
        const fwd = [-sy * cp, sp, -cy * cp], right = [cy, 0, -sy];
        return { fwd, right, up: v3.cross(right, fwd) };
    }

    lookAt(target) {
        const d = v3.norm(v3.sub(target, this.pos));
        this.yaw = Math.atan2(-d[0], -d[2]);
        this.pitch = Math.asin(clamp(d[1], -1, 1));
    }

    update(dt, io, input, field) {
        this.yaw -= io.dx * 0.0025;
        this.pitch = clamp(this.pitch - io.dy * 0.0025, -1.55, 1.55);
        if (io.wheel) this.speed = clamp(this.speed * Math.pow(1.25, -io.wheel), 5, 20000);
        const k = input.keys, { fwd, right } = this.basis();
        let m = [0, 0, 0];
        if (k.has('KeyW')) m = v3.add(m, fwd);
        if (k.has('KeyS')) m = v3.sub(m, fwd);
        if (k.has('KeyD')) m = v3.add(m, right);
        if (k.has('KeyA')) m = v3.sub(m, right);
        if (k.has('Space')) m[1] += 1;
        if (k.has('KeyC')) m[1] -= 1;
        const mul = (k.has('ShiftLeft') || k.has('ShiftRight') ? 5 : 1) * (k.has('AltLeft') ? 0.2 : 1);
        this.pos = v3.add(this.pos, v3.mul(m, this.speed * mul * dt));
        this.pos[1] = clamp(this.pos[1], field.sample(this.pos[0], this.pos[2]) + 1.5, 25000);
    }

    ray(mx, my, w, h) {
        const { fwd, right, up } = this.basis(), t = Math.tan(this.fov / 2), a = w / h;
        const x = (mx / w * 2 - 1) * t * a, y = (1 - my / h * 2) * t;
        return v3.norm(v3.add(fwd, v3.add(v3.mul(right, x), v3.mul(up, y))));
    }
}

// Pushes a walker at feet p ([x, y, z], changed in place) out of the walls among `boxes` (Structures.solid's shape) and
// returns the highest floor under it: a box whose top is within a step of the feet is a floor, one that reaches higher
// is a wall, unless it is all above the head.
function collideWalker(p, boxes, ground) {
    const R = WALK.radius;
    for (let it = 0; it < 3; it++) {
        for (const b of boxes) {
            if (b.off) continue;
            const rx = p[0] - b.x, rz = p[2] - b.z;
            let lx = rx * b.cs + rz * b.sn, lz = -rx * b.sn + rz * b.cs;
            if (Math.abs(lx) > b.hx + R || Math.abs(lz) > b.hz + R) continue;
            const top = b.y1 + b.slope * lx, bot = b.y0 + b.slope * lx;
            if (bot > p[1] + WALK.head || top <= p[1] + WALK.step) continue;
            const cx = clamp(lx, -b.hx, b.hx), cz = clamp(lz, -b.hz, b.hz), dx = lx - cx, dz = lz - cz, d2 = dx * dx + dz * dz;
            if (d2 >= R * R) continue;
            if (d2 > 1e-10) { const d = Math.sqrt(d2), k = (R - d) / d; lx += dx * k; lz += dz * k; }
            else if (b.hx - Math.abs(lx) < b.hz - Math.abs(lz)) lx = Math.sign(lx || 1) * (b.hx + R);
            else lz = Math.sign(lz || 1) * (b.hz + R);
            p[0] = b.x + lx * b.cs - lz * b.sn;
            p[2] = b.z + lx * b.sn + lz * b.cs;
        }
    }
    for (const b of boxes) {
        if (b.off) continue;
        const rx = p[0] - b.x, rz = p[2] - b.z, lx = rx * b.cs + rz * b.sn, lz = -rx * b.sn + rz * b.cs;
        if (Math.abs(lx) > b.hx || Math.abs(lz) > b.hz) continue;
        const top = b.y1 + b.slope * lx;
        if (top <= p[1] + WALK.step) ground = Math.max(ground, top);
    }
    return ground;
}

// On foot: walks on the terrain as drawn and on what stands on it (Structures' boxes, bridge decks), into the bus and
// out of it. Aboard, the walker lives in the bus's frame (`local`), so it rides along; seated, its eye is the seat's.
// The camera's yaw turns with the bus while aboard.
class Walker {
    constructor() {
        this.active = false;
        this.feet = [0, 0, 0];         // world, or the bus's frame while aboard
        this.bus = null;
        this.seat = null;
        this.vy = 0;
        this.lag = 0;                  // eye height still to catch up after a step (smooths stairs and kerbs)
        this.prompt = '';
    }

    // on foot at x, z, on whatever is there within a step of height y (default: the ground)
    place(app, x, z, y) {
        this.active = true;
        this.bus = null;
        this.seat = null;
        this.vy = this.lag = 0;
        const g = app.world.field.surface(x, z);
        this.feet = [x, Math.max(y ?? g, g), z];
        this.feet[1] = this.floorAt(app, this.feet, -Infinity);
    }

    // seated aboard the bus (seat index, or the best free window seat)
    sit(app, bus, k) {
        const seats = bus.mesh.seats, s = seats[k ?? seats.findIndex(q => q.name.startsWith('window seat, row 5 left'))] || seats[0];
        this.active = true;
        this.bus = bus;
        this.seat = s;
        this.feet = [s.x, BUS.floor, s.z];
        this.lag = 0;
        app.camera.yaw = bus.yaw;
        app.camera.pitch = -0.08;
        this.busYaw = bus.yaw;
    }

    // world: the terrain or the highest box top under the feet (within a step); the walls and floors of buses near it too
    floorAt(app, p, below) {
        const w = app.world, boxes = w.structures.solidsNear(p[0], p[2], 2);
        for (const bus of w.buses) {
            if (Math.hypot(p[0] - bus.pose.x, p[2] - bus.pose.z) > 10) continue;
            for (const b of bus.colliders()) {
                const c = bus.toWorld([b.x, b.y0, b.z]);
                boxes.push({ x: c[0], z: c[2], hx: b.hx, hz: b.hz, cs: bus.pose.cs, sn: bus.pose.sn, y0: c[1], y1: c[1] + b.y1 - b.y0, slope: 0 });
            }
        }
        return collideWalker(p, boxes, Math.max(below, w.field.surface(p[0], p[2])));
    }

    // open water at x, z (the land-use map's, or a river's own channel, which villages draw at its true width)
    water(app, x, z) {
        const w = app.world;
        return w.field.landAt(x, z, 2) > 0.4 || w.entities.some(e => e instanceof River && e.distance(x, z) < (e.def.width || 60) / 2 - 2);
    }

    update(dt, io, input, app) {
        const cam = app.camera, k = input.keys;
        // the view turns with the bus while aboard
        if (this.bus) { cam.yaw += this.bus.yaw - this.busYaw; this.busYaw = this.bus.yaw; }
        cam.yaw -= io.dx * 0.0025;
        cam.pitch = clamp(cam.pitch - io.dy * 0.0025, -1.45, 1.45);
        const pressed = io.pressed.includes('KeyE');
        if (this.seat) {
            if (pressed) {                                          // stand up into the aisle beside the seat
                this.feet = [this.seat.x + 0.3, BUS.floor, 0];
                this.lag = this.seat.eye[1] - BUS.floor - WALK.eye;
                this.seat = null;
            } else { this.prompt = `seated: ${this.seat.name} · E stand up`; this.eye(app); return; }
        }
        // where to: along the ground, the way the camera looks
        const f = [-Math.sin(cam.yaw), -Math.cos(cam.yaw)], r = [Math.cos(cam.yaw), -Math.sin(cam.yaw)];
        let mx = 0, mz = 0;
        if (k.has('KeyW')) { mx += f[0]; mz += f[1]; }
        if (k.has('KeyS')) { mx -= f[0]; mz -= f[1]; }
        if (k.has('KeyD')) { mx += r[0]; mz += r[1]; }
        if (k.has('KeyA')) { mx -= r[0]; mz -= r[1]; }
        const l = Math.hypot(mx, mz), speed = (k.has('ShiftLeft') || k.has('ShiftRight') ? WALK.run : WALK.speed) * (k.has('AltLeft') ? 0.3 : 1);
        if (l > 0) { mx *= speed * dt / l; mz *= speed * dt / l; }
        if (this.bus) {
            // aboard: move in the bus's frame, against its walls, seats and doors; out through an open door
            const d = this.bus.toLocal([mx, 0, mz], 0), p = this.feet, y0 = p[1];
            p[0] += d[0]; p[2] += d[2];
            const g = collideWalker(p, this.bus.colliders(), -Infinity);
            this.settle(g, y0, dt);
            if (Math.abs(p[0]) > BUS.hl || Math.abs(p[2]) > BUS.hw) {
                this.feet = this.bus.toWorld(p);
                this.bus = null;
            }
        } else {
            const p = this.feet, y0 = p[1], was = [p[0], p[2]], f0 = app.world.field;
            p[0] += mx; p[2] += mz;
            let g = this.floorAt(app, p, -Infinity);
            // no wading into the water (a bridge's deck over it is fine)
            if (l > 0 && g < f0.surface(p[0], p[2]) + 0.5 && this.water(app, p[0], p[2]) && !this.water(app, ...was)) {
                p[0] = was[0]; p[2] = was[1];
                g = this.floorAt(app, p, -Infinity);
            }
            this.settle(g, y0, dt);
            // stepped into a bus (through a door): ride along in its frame
            for (const bus of app.world.buses) {
                const q = bus.toLocal(p);
                if (Math.abs(q[0]) < BUS.hl - 0.05 && Math.abs(q[2]) < BUS.hw - 0.05 && q[1] > BUS.floor - 0.4) {
                    this.bus = bus;
                    this.busYaw = bus.yaw;
                    this.feet = [q[0], Math.max(q[1], BUS.floor), q[2]];
                    break;
                }
            }
        }
        // a seat in view within reach: E sits down in it
        this.prompt = '';
        this.aim = null;
        if (this.bus) {
            const { fwd } = cam.basis(), d = this.bus.toLocal(fwd, 0), o = [this.feet[0], this.feet[1] + WALK.eye + this.lag, this.feet[2]];
            let best = 2.2;
            for (const s of this.bus.mesh.seats) {
                const lo = [s.x - 0.27, s.y - 0.12, s.z - 0.23], hi = [s.x + 0.23, s.y + 0.62, s.z + 0.23];
                let tn = 0, tf = best;
                for (let a = 0; a < 3; a++) {
                    if (Math.abs(d[a]) < 1e-9) { if (o[a] < lo[a] || o[a] > hi[a]) { tn = Infinity; } continue; }
                    const t0 = (lo[a] - o[a]) / d[a], t1 = (hi[a] - o[a]) / d[a];
                    tn = Math.max(tn, Math.min(t0, t1)); tf = Math.min(tf, Math.max(t0, t1));
                }
                if (tn <= tf && tn < best) { best = tn; this.aim = s; }
            }
            if (this.aim) {
                this.prompt = `E sit: ${this.aim.name}`;
                if (pressed) { this.seat = this.aim; this.aim = null; cam.yaw = this.bus.yaw; this.busYaw = this.bus.yaw; }
            } else this.prompt = 'aboard · look at a seat to sit';
        }
        this.eye(app);
    }

    // feet onto the floor g: up a step at once (the eye follows), or falling to it
    settle(g, y0, dt) {
        const p = this.feet;
        if (g >= p[1]) { this.lag -= g - p[1]; p[1] = g; this.vy = 0; }
        else {
            this.vy -= 9.81 * dt;
            p[1] = Math.max(g, p[1] + this.vy * dt);
            if (p[1] === g) this.vy = 0;
        }
        this.lag *= Math.exp(-dt * 10);
        if (Math.abs(this.lag) < 1e-3) this.lag = 0;
    }

    // the camera at the eye: standing, or the seat's
    eye(app) {
        const e = this.seat ? this.seat.eye : [this.feet[0], this.feet[1] + WALK.eye + this.lag, this.feet[2]];
        app.camera.pos = this.bus ? this.bus.toWorld(e) : e;
    }
}

// -------------------------------------------------------------------------------------------------- hud
// what falling rain is called: by its rate (near-field intensity) and how fine its drops are
const rainName = (rate, drops) => drops < 0.2 && rate < 0.3 ? 'drizzle' : rate < 0.3 ? 'light rain' : rate < 0.7 ? 'moderate rain'
    : rate <= 1 ? 'heavy rain' : drops > 0.9 ? 'downpour' : 'torrential rain';
const fmtKm = d => d < 1000 ? `${d.toFixed(0)} m` : `${(d / 1000).toFixed(d < 10000 ? 1 : 0)} km`;

class Hud {
    constructor() {
        this.el = document.getElementById('hud');
        this.help = document.getElementById('help');
        this.statesEl = document.getElementById('states');
        this.toastEl = document.getElementById('toast');
        this.labels = document.getElementById('labels');
        this.lctx = this.labels.getContext('2d');
        this.showLabels = true;
        this.last = 0;
        this.help.innerHTML = [
            '<b>drag</b> look   <b>WASD</b> move   <b>Space/C</b> up/down   <b>Shift</b> ×5   <b>wheel</b> speed',
            '<b>1-9</b> weather state   <b>0</b> auto cycle   <b>right click</b> (or Ctrl + click) grow a storm cell there',
            '<b>N</b> rain: drizzle / light / medium / downpour / mixed   <b>K</b> lightning   <b>, .</b> weather time scale   <b>T</b> lighting   <b>arrows</b> move the sun',
            '<b>R</b> radar   <b>M</b> render mode   <b>Q</b> quality   <b>F</b> froxels   <b>G</b> cloud tiles   <b>V</b> next view   <b>L</b> labels   <b>P</b> pause   <b>H</b> help',
            '<b>X</b> walk / fly   <b>B</b> next bus   <b>E</b> open / shut a door, sit / stand (aboard)   <b>hold Z</b> buses ×10   on foot: <b>WASD</b> walk, <b>Shift</b> run',
            'drop a scenario .json on the page',
        ].join('\n');
    }

    setStates(weather) {
        this.statesEl.innerHTML = weather.names.map((n, i) => `<b>${RAIN_VARIANTS.includes(n) ? 'N' : i < 9 ? i + 1 : '·'}</b> <span class="${n === weather.target ? 'sel' : ''}">${n}</span>`).join('\n')
            + `\n<b>0</b> auto cycle ${weather.cycle.enabled ? '<span class="sel">on</span>' : 'off'}`;
    }

    toast(msg, ms = 2200) {
        this.toastEl.textContent = msg;
        this.toastEl.style.display = 'block';
        clearTimeout(this.tid);
        this.tid = setTimeout(() => { this.toastEl.style.display = 'none'; }, ms);
    }

    update(app, now) {
        if (now - this.last < 150) return;
        this.last = now;
        const w = app.world, wx = w.weather, c = wx.cur, p = app.near;
        const storms = w.storms, raining = storms.filter(s => s.state.precip > 0.05 && s.state.virga < 0.7).length;
        const wind = Math.hypot(...c.wind), dirDeg = (Math.atan2(c.wind[0], -c.wind[1]) / DEG + 360) % 360;
        const from = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(((dirDeg + 180) % 360) / 45) % 8];
        const here = p.rain + p.snow < 0.01 ? (app.camera.pos[1] > c.base && app.probe.coverage > 0.5 ? '<span class="m">in cloud</span>' : '<span class="m">dry</span>')
            : p.snow > p.rain ? `<span class="snow">snow ${(p.snow * 100).toFixed(0)}%</span>` : `<span class="on">${rainName(p.rain, app.drops ?? c.drops)} ${(p.rain * 100).toFixed(0)}%</span>`;
        const zone = w.rainZones.variantAt(app.camera.pos[0], app.camera.pos[2]);
        const q = QUALITY[app.quality], cw = app.renderer.cloudPass;
        const lines = [
            `<span class="t">ENTITY CLOUD // ${w.scenario.name || 'scenario'}</span>`,
            `weather   ${wx.blend < 1 ? `<span class="w">${wx.target} ${(wx.blend * 100).toFixed(0)}%</span>` : wx.target}${w.rainZones.fade > 0 && wx.cur.zones ? ` <span class="m">(${zone ? `${zone} here` : 'off the route'} · reshuffle in ${Math.max(0, w.rainZones.clock).toFixed(0)} s)</span>` : ''}${wx.cycle.enabled ? ' <span class="m">(auto)</span>' : ''} · ×${app.timeScale} time${app.paused ? ' <span class="w">paused</span>' : ''}`,
            `layer     base ${(c.base / 1000).toFixed(1)} km · top ${(c.top / 1000).toFixed(1)} km · cover ${(c.coverage * 100).toFixed(0)}% · cirrus ${(c.cirrus * 100).toFixed(0)}%`,
            `air       ${c.temperature.toFixed(0)} °C at sea level · freezing level ${(wx.freezingLevel / 1000).toFixed(1)} km · wind ${wind.toFixed(0)} m/s from ${from}`,
            `clouds    ${w.clouds.active(c).map(([n, v]) => `${n} ${(v * 100).toFixed(0)}%`).join(' · ') || 'none'}`,
            `storms    ${storms.length} cells · ${raining} raining · ${w.flashCount} flashes`,
            `here      ${here}${app.sheltered || app.indoors ? ` <span class="w">${app.inBus ? 'in the bus' : app.indoors ? `indoors, storey ${Math.min(app.indoors.n, 1 + Math.floor((app.camera.pos[1] - app.indoors.floor) / app.indoors.H))} of ${app.indoors.n}` : 'sheltered'}</span>` : ''} · alt ${(app.camera.pos[1] / 1000).toFixed(2)} km · ground snow ${app.groundSnowHint}`,
            ...(app.rideBus ? [`bus       ${app.rideBus.label} ${app.rideBus.describe()}${app.walker.active ? ` · <span class="w">${app.walker.seat ? 'seated' : app.walker.bus ? 'aboard' : 'on foot'}</span>` : ''}${w.busBoost > 1 ? ' <span class="w">×10</span>' : ''}`] : []),
            `render    ${RENDER_MODES[app.mode]} · ${q.name} ${cw.w}×${cw.h}${q.interleave > 1 ? ` 1/${q.interleave} px` : ''}${q.blur ? ' blur' : ''}${app.tiles ? ' tiles' : ''} ${q.steps} steps · froxels ${app.froxels ? FROXEL.join('×') : 'off'} · ${app.lightName} · ${app.fps.toFixed(0)} fps`,
            app.renderer.profiler.enabled
                ? `gpu       ${app.renderer.profiler.total.toFixed(1)} ms · ${Object.entries(app.renderer.profiler.ms).map(([n, v]) => `${n} ${v.toFixed(1)}`).join(' · ')}`
                : `gpu       <span class="m">no timestamp queries on this adapter</span>`,
        ];
        if (app.renderer.lastError) lines.push(`<span class="off">${app.renderer.lastError.slice(0, 90)}</span>`);
        this.el.innerHTML = lines.join('\n');
    }

    drawLabels(app) {
        const c = this.labels, dpr = Math.min(window.devicePixelRatio || 1, 2);
        const W = Math.floor(c.clientWidth * dpr), H = Math.floor(c.clientHeight * dpr);
        if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
        const g = this.lctx;
        g.clearRect(0, 0, W, H);
        // on foot: a dot in the middle, and what E would do
        const wk = app.walker;
        if (wk.active) {
            g.fillStyle = wk.aim ? 'rgba(255,201,74,0.95)' : 'rgba(255,255,255,0.7)';
            g.beginPath(); g.arc(W / 2, H / 2, (wk.aim ? 3 : 2) * dpr, 0, 2 * Math.PI); g.fill();
            if (wk.prompt) {
                g.font = `${13 * dpr}px 'Share Tech Mono', monospace`;
                g.textAlign = 'center';
                g.textBaseline = 'top';
                g.fillStyle = 'rgba(0,0,0,0.55)';
                const tw = g.measureText(wk.prompt).width;
                g.fillRect(W / 2 - tw / 2 - 6 * dpr, H / 2 + 14 * dpr, tw + 12 * dpr, 20 * dpr);
                g.fillStyle = 'rgba(255,201,74,0.95)';
                g.fillText(wk.prompt, W / 2, H / 2 + 17 * dpr);
                g.textAlign = 'left';
            }
        }
        if (!this.showLabels) return;
        g.font = `${11 * dpr}px 'Share Tech Mono', monospace`;
        g.textBaseline = 'middle';
        for (const e of [...app.world.entities, ...app.world.buses]) {
            if (!e.label || (e === app.rideBus && app.inBus)) continue;
            const storm = e instanceof StormCell;
            if (storm && e.state.coverage < 0.1) continue;
            const p = e.anchor;
            if (!p) continue;
            const clip = m4.project(app.viewProj, p);
            if (clip[3] <= 0) continue;
            const x = (clip[0] / clip[3] * 0.5 + 0.5) * W, y = (0.5 - clip[1] / clip[3] * 0.5) * H;
            if (x < -50 || x > W + 50 || y < -20 || y > H + 20) continue;
            const d = v3.len(v3.sub(p, app.camera.pos));
            if (storm && d > 70000) continue;
            g.strokeStyle = g.fillStyle = storm ? 'rgba(110,220,255,0.9)' : 'rgba(255,201,74,0.9)';
            g.lineWidth = dpr;
            g.beginPath();
            g.moveTo(x, y - 4 * dpr); g.lineTo(x + 4 * dpr, y); g.lineTo(x, y + 4 * dpr); g.lineTo(x - 4 * dpr, y); g.closePath();
            g.stroke();
            g.fillText(`${e.label}${storm ? ` · ${e.describe()}` : ''}  ${fmtKm(d)}`, x + 8 * dpr, y);
        }
    }
}

// -------------------------------------------------------------------------------------------------- app
class App {
    constructor(canvas) {
        this.canvas = canvas;
        this.renderer = new Renderer();
        this.input = new Input(canvas);
        this.hud = new Hud();
        this.camera = new FlyCamera();
        this.walker = new Walker();
        this.time = 0;
        this.weatherTime = 0;
        this.paused = false;
        this.fps = 60;
        this.mode = 0;
        this.radar = true;
        this.froxels = true;
        this.tiles = true;
        this.viewProj = new Float32Array(16);
        this.prevViewProj = null;
        this.frameNo = 0;
        this.near = { rain: 0, snow: 0 };
        this.sheltered = false;
        this.probe = { coverage: 0, top: 0, precip: 0, virga: 0, cover: 0 };
        this.groundSnowHint = 'none';
        this.reset = true;
    }

    async start() { await this.renderer.init(this.canvas); }

    load(scenario) {
        const world = new World(scenario);
        this.world = world;
        this.scenario = scenario;
        this.cfg = { ...RENDER_DEFAULTS, ...(scenario.render || {}) };
        this.quality = clamp(this.cfg.quality, 0, QUALITY.length - 1);
        this.timeScale = this.cfg.timeScale;
        this.renderer.setWorld(world);
        this.hud.setStates(world.weather);
        const L = scenario.lighting || {};
        this.lightPresets = L.presets || { default: {} };
        this.lightNames = Object.keys(this.lightPresets);
        this.setLight(this.lightPresets[L.start] ? L.start : this.lightNames[0]);
        this.views = scenario.views || [];
        this.viewIndex = 0;
        this.walker = new Walker();
        if (this.views[0]) this.jump(this.views[0]);
        this.reset = true;
        if (!this.running) { this.running = true; this.last = performance.now(); requestAnimationFrame(t => this.frame(t)); }
    }

    setLight(name) {
        const p = this.lightPresets[name] || {};
        this.lightName = name || 'default';
        this.sun = { azimuth: (p.azimuth ?? 150) * DEG, elevation: (p.elevation ?? 35) * DEG, intensity: p.intensity ?? 12, exposure: p.exposure ?? 0.45 };
    }

    jump(v) {
        const e = v.follow && this.world.get(v.follow);
        this.walker.active = false;
        if (v.spot === 'seat' && e instanceof BusLine) {
            // aboard the bus, in a seat
            this.walker.sit(this, e.buses[0]);
            this.walker.eye(this);
        } else if (v.spot && e?.spots?.[v.spot]) {
            // a viewpoint the entity laid out (a village's bus stop)
            this.camera.pos = [...e.spots[v.spot].pos];
            this.camera.lookAt(e.spots[v.spot].look);
        } else if (e?.focus) {
            // relative to a moving entity: offset from its focus point, height above the ground there
            const f = e.focus, o = v.offset || [0, 0, 0], l = v.lookOffset || [0, 2000, 0];
            const x = f[0] + o[0], z = f[2] + o[2];
            this.camera.pos = [x, this.world.field.sample(x, z) + o[1], z];
            this.camera.lookAt([f[0] + l[0], f[1] + l[1], f[2] + l[2]]);
        } else {
            this.camera.pos = [...v.pos];
            if (v.look) this.camera.lookAt(v.look);
        }
        // on foot from there (`walk`)
        if (v.walk && !this.walker.active) { this.walker.place(this, this.camera.pos[0], this.camera.pos[2], this.camera.pos[1] - WALK.eye); this.walker.eye(this); }
        if (v.lighting && this.lightPresets[v.lighting]) this.setLight(v.lighting);
        if (v.weather) { this.world.weather.set(v.weather); this.hud.setStates(this.world.weather); }
        this.reset = true;
        this.hud.toast(v.name);
    }

    handleKeys(pressed) {
        const w = this.world, wx = w.weather;
        for (const code of pressed) {
            const digit = code.match(/^(?:Digit|Numpad)(\d)$/);
            if (digit) {
                const k = +digit[1];
                if (k === 0) { wx.cycle.enabled = !wx.cycle.enabled; wx.cycleClock = wx.cycle.hold; this.hud.toast(`Auto weather ${wx.cycle.enabled ? 'on' : 'off'}`); }
                else if (wx.names[k - 1]) { wx.set(wx.names[k - 1]); this.hud.toast(`Weather: ${wx.target}`); }
                this.hud.setStates(wx);
                continue;
            }
            switch (code) {
                case 'KeyK': {
                    const cells = w.storms.filter(s => s.state.precip > 0.1);
                    if (!cells.length) { this.hud.toast('No mature storm cell'); break; }
                    const near = cells.reduce((a, b) => Math.hypot(a.pos[0] - this.camera.pos[0], a.pos[1] - this.camera.pos[2]) < Math.hypot(b.pos[0] - this.camera.pos[0], b.pos[1] - this.camera.pos[2]) ? a : b);
                    w.lightning.strike(near, true);
                    break;
                }
                case 'Comma': case 'Period': {
                    const i = TIME_SCALES.indexOf(this.timeScale);
                    const j = clamp((i < 0 ? 3 : i) + (code === 'Period' ? 1 : -1), 0, TIME_SCALES.length - 1);
                    this.timeScale = TIME_SCALES[j];
                    this.hud.toast(`Weather time ×${this.timeScale}`);
                    break;
                }
                case 'KeyT': {
                    const i = (this.lightNames.indexOf(this.lightName) + 1) % this.lightNames.length;
                    this.setLight(this.lightNames[i]);
                    this.hud.toast(`Lighting: ${this.lightName}`);
                    break;
                }
                case 'KeyN': {
                    // step through the rain variants: drizzle, light rain, medium rain, downpour, mixed rain
                    const names = RAIN_VARIANTS.filter(n => wx.states[n]);
                    if (!names.length) { this.hud.toast('No rain variants in this scenario'); break; }
                    wx.set(names[(names.indexOf(wx.target) + 1) % names.length]);
                    this.hud.toast(`Rain: ${wx.target}`);
                    this.hud.setStates(wx);
                    break;
                }
                case 'KeyX': {
                    // walk from here (down on the ground below the camera), or fly again
                    if (this.walker.active) { this.walker.active = false; this.walker.bus = null; this.hud.toast('Flying'); }
                    else { const c = this.camera.pos, y = c[1] - WALK.eye; this.walker.place(this, c[0], c[2], y - w.field.surface(c[0], c[2]) < 3 ? y : undefined); this.camera.pitch = 0; this.hud.toast('Walking'); }
                    this.reset = true;
                    break;
                }
                case 'KeyB': {
                    // to the next bus of the fleet (each press another): outside its front door while it stands at a
                    // stop, else aboard in the aisle
                    if (!w.buses.length) { this.hud.toast('No bus in this scenario'); break; }
                    this.busPick = ((this.busPick ?? -1) + 1) % w.buses.length;
                    const bus = w.buses[this.busPick];
                    const doorX = BUS.bay0 + (BUS.doorBays[0] + 0.5) * BUS.bay;
                    if (bus.mode === 'dwell') {
                        const p = bus.toWorld([doorX, 0, BUS.hw + 1.2]);
                        this.walker.place(this, p[0], p[2], p[1]);
                        this.walker.eye(this);
                        this.camera.lookAt(bus.toWorld([doorX, 1.5, 0]));
                    } else {
                        this.walker.place(this, bus.pose.x, bus.pose.z);
                        Object.assign(this.walker, { bus, seat: null, feet: [-1.0, BUS.floor, 0], busYaw: bus.yaw });
                        this.camera.yaw = bus.yaw;
                    }
                    this.camera.pitch = 0;
                    this.reset = true;
                    this.hud.toast(`${bus.label}: ${bus.describe()}`);
                    break;
                }
                case 'KeyR': this.radar = !this.radar; break;
                case 'KeyG': this.tiles = !this.tiles; this.hud.toast(`Cloud tile pre-pass: ${this.tiles ? 'on' : 'off'}`); break;
                case 'KeyF': this.froxels = !this.froxels; this.hud.toast(`Froxel lighting: ${this.froxels ? 'on' : 'off'}`); break;
                case 'KeyM': this.mode = (this.mode + 1) % RENDER_MODES.length; this.reset = true; this.hud.toast(`Render: ${RENDER_MODES[this.mode]}`); break;
                case 'KeyQ': this.quality = (this.quality + 1) % QUALITY.length; this.reset = true; this.hud.toast(`Quality: ${QUALITY[this.quality].name}`); break;
                case 'KeyV': if (this.views.length) { this.viewIndex = (this.viewIndex + 1) % this.views.length; this.jump(this.views[this.viewIndex]); } break;
                case 'KeyL': this.hud.showLabels = !this.hud.showLabels; break;
                case 'KeyP': this.paused = !this.paused; break;
                case 'KeyH': this.hud.help.style.display = this.hud.help.style.display === 'none' ? '' : 'none'; break;
            }
        }
    }

    // right click: grow a storm cell where the cursor ray meets the ground
    handleClicks(clicks) {
        for (const [cx, cy] of clicks) {
            const rect = this.canvas.getBoundingClientRect();
            const hit = this.world.field.raycast(this.camera.pos, this.camera.ray(cx - rect.left, cy - rect.top, rect.width, rect.height));
            const sp = this.world.spawner;
            if (!hit) { this.hud.toast('Click on the ground'); continue; }
            if (!sp) { this.hud.toast('No spawner in this scenario'); continue; }
            const e = sp.spawnAt(hit[0], hit[2]);
            this.hud.toast(`${e.label} growing ${fmtKm(v3.len(v3.sub(hit, this.camera.pos)))} away`);
        }
    }

    updateSun(dt) {
        const k = this.input.keys, s = this.sun;
        if (k.has('ArrowLeft')) s.azimuth -= dt * 0.5;
        if (k.has('ArrowRight')) s.azimuth += dt * 0.5;
        if (k.has('ArrowUp')) s.elevation = Math.min(s.elevation + dt * 0.25, 85 * DEG);
        if (k.has('ArrowDown')) s.elevation = Math.max(s.elevation - dt * 0.25, 2 * DEG);
    }

    // what is falling on the camera, from the weather probe (sampled where precipitation over us left the cloud base)
    nearPrecip() {
        const c = this.world.weather.cur, y = this.camera.pos[1], pr = this.probe;
        // virga, overwhelmed by a downpour as virgaOf() in WGSL
        const virga = pr.virga * (1 - sat01((pr.precip - 0.6) / 0.8));
        const g = this.world.field.base, bottom = lerp(g - 300, c.base, virga);
        if (y > c.base + 200 || pr.precip < 0.01) return { rain: 0, snow: 0 };
        const k = pr.precip * smoothstep(bottom, bottom + 300, y);
        const snow = smoothstep(this.world.weather.freezingLevel - 250, this.world.weather.freezingLevel + 250, y);
        return { rain: k * (1 - snow), snow: k * snow };
    }

    writeFrame(dt, wdt) {
        const r = this.renderer, F = r.frame, cam = this.camera, w = this.world, c = w.weather.cur, cfg = this.cfg, q = QUALITY[this.quality];
        const sky = Sky.compute(this.sun.azimuth, this.sun.elevation, this.sun.intensity, c);
        const aspect = r.width / r.height, tanY = Math.tan(cam.fov / 2), tanX = tanY * aspect;
        const { fwd, right, up } = cam.basis();
        // on foot the near plane comes in to 5 cm (seat backs and bus walls are within a metre); reversed-Z keeps the far depth precise
        const near = this.walker.active ? 0.05 : NEAR, proj = m4.reversedInfinite(cam.fov, aspect, near);
        this.viewProj = m4.mul(proj, m4.view(cam.pos, right, up, fwd));
        // each bus near enough to see: its model-view built in doubles about the camera (its interior a metre away would
        // jitter in f32 world space), nearest first
        const draws = [];
        w.buses.forEach((bus, k) => {
            const m = bus.model, dist = Math.hypot(m[12] - cam.pos[0], m[13] - cam.pos[1], m[14] - cam.pos[2]);
            if (dist > BUS_DRAW) return;
            const b = [-fwd[0], -fwd[1], -fwd[2]], rows = [right, up, b], mv = new Array(16).fill(0);
            for (let c = 0; c < 4; c++) for (let r2 = 0; r2 < 3; r2++) {
                const col = c < 3 ? [m[c * 4], m[c * 4 + 1], m[c * 4 + 2]] : [m[12] - cam.pos[0], m[13] - cam.pos[1], m[14] - cam.pos[2]];
                mv[c * 4 + r2] = v3.dot(rows[r2], col);
            }
            mv[15] = 1;
            const o = k * BUS_UNIFORM / 4;
            r.busData.set(m4.mul(proj, mv), o);
            r.busData.set(m, o + 16);
            r.busData.set(bus.inverse, o + 32);
            r.busData.set([bus.v, bus.doors, 0, 0], o + 48);
            draws.push([dist, k]);
        });
        r.busDraws = draws.sort((p, q2) => p[0] - q2[0]).map(e => e[1]);
        // building interiors within INTERIOR_DRAW of their centre (the same test fsWindow and fsPane make) whose bounding
        // sphere is in the view frustum, nearest first
        const kx = Math.hypot(1, tanX), ky = Math.hypot(1, tanY);
        const inView = b => {
            const v = v3.sub(b.centre, cam.pos), r = b.radius ??= Math.hypot(b.hx, b.hz, b.n * b.H / 2), z = v3.dot(v, fwd);
            return z > -r && Math.abs(v3.dot(v, right)) - z * tanX < r * kx && Math.abs(v3.dot(v, up)) - z * tanY < r * ky;
        };
        const nearB = w.structures.buildings.map(b => [v3.len(v3.sub(b.centre, cam.pos)), b]).filter(e => e[0] < INTERIOR_DRAW && inView(e[1])).sort((p, q2) => p[0] - q2[0]);
        r.interiorDraws = nearB.map(([, b]) => [b.range[0], b.range[1] - b.range[0]]).filter(e => e[1] > 0);
        // the cabin the rain and the march leave out: the bus ridden, or the nearest
        if (this.rideBus) {
            F.set('busInv', this.rideBus.inverse);
            F.set('cabinLo', [-BUS.hl, BUS.skirt, -BUS.hw, 1]);
            F.set('cabinHi', [BUS.hl, BUS.roof, BUS.hw, 0]);
        } else F.set('cabinLo', [0, 0, 0, 0]);
        // weather map follows the camera, snapped to its texels so it does not swim
        const ws = cfg.weatherSize, texel = ws / WEATHER_RES;
        const wo = [Math.floor((cam.pos[0] - ws / 2) / texel) * texel, Math.floor((cam.pos[2] - ws / 2) / texel) * texel];
        const f = w.field;
        F.set('viewProj', this.viewProj);
        F.set('prevViewProj', this.prevViewProj || this.viewProj);
        F.set('cam', [...cam.pos, this.time % 3600]);
        F.set('fwd', [...fwd, near]);
        F.set('right', [...v3.mul(right, tanX), this.frameNo % 1024]);
        F.set('up', [...v3.mul(up, tanY), this.weatherTime]);
        F.set('sunDir', [...sky.dir, 0]);
        F.set('sunCol', [...sky.sun, this.sun.exposure]);
        F.set('zenith', [...sky.zenith, 0.00007 * c.haze]);
        F.set('horizon', [...sky.horizon, 1400]);
        F.set('ambient', [...sky.ambient, 0]);
        F.set('screen', [r.width, r.height, r.cloudPass.w, r.cloudPass.h]);
        F.set('cloud', [c.base, Math.max(c.top, c.base + 400), c.density, c.coverage]);
        F.set('noise', [cfg.shapeScale, cfg.detailScale, cfg.detailStrength, cfg.maxTop]);
        F.set('wind', [...c.wind, ...w.weather.offset]);
        F.set('precip', [w.weather.freezingLevel, cfg.slant, cfg.rainExtinction, cfg.snowExtinction]);
        F.set('wdomain', [wo[0], wo[1], ws, WEATHER_RES]);
        F.set('tdomain', [f.origin, f.origin, f.size, f.n]);
        F.set('ground', [w.terrain.fieldSize, w.terrain.pivots, GROUND_RES, this.mode]);
        F.set('cirrus', [cfg.maxTop + 800, c.cirrus, 9000, c.drizzle]);
        F.set('march', [q.steps, q.light, cfg.maxDistance, this.radar ? 1 : 0]);
        // the shadow map refreshes a slice of rows per frame, unless the map moved or the sun / weather jumped
        const shadowKey = `${wo[0]},${wo[1]},${sky.dir.map(v => v.toFixed(2))},${w.weather.target},${w.weather.blend < 1 || w.rainZones.blend < 1}`;
        const full = this.reset || shadowKey !== this.shadowKey || w.weather.blend < 1 || w.rainZones.blend < 1;
        this.shadowKey = shadowKey;
        F.set('lod', [q.interleave, full ? 1 : SHADOW_SLICES, full ? 0 : this.frameNo % SHADOW_SLICES, q.detail]);
        this.shadowSlices = full ? 1 : SHADOW_SLICES;
        F.set('froxel', [FROXEL_NEAR, cfg.maxDistance, this.froxels ? 1 : 0, 0]);
        F.set('post', [q.blur || 0, this.tiles ? 1 : 0, 0, 0]);
        // heavy rain: up to three times the drops (big drops, past intensity 0.6)
        const drops = this.drops = w.rainZones.drops(cam.pos[0], cam.pos[2], c.drops);
        this.rainParticles = Math.round(cfg.particles * (1 + 2 * sat01((this.near.rain - 0.6) / 0.8) * drops));
        F.set('rain', [drops, rainFall(drops), c.rain, this.rainParticles]);
        w.rainZones.write(F);
        this.drips = w.structures.write(F, cam.pos, sky.dir, c.wind, w.weather.freezingLevel, rainFall(drops));
        F.set('misc', [c.temperature, this.time * cfg.fallSpeed % 52000, f.base, wdt]);
        w.lightning.write(F);

        const cells = w.gpuCells(cam.pos), cd = r.cellData;
        cd.fill(0);
        cells.forEach((s, i) => cd.set([s.x, s.z, s.radius, s.top, s.coverage, s.precip, s.seed, s.virga, s.core, s.offset[0], s.offset[1], 0,
            s.shelf || 0, s.laminar || 0, s.green || 0, s.wall || 0], i * CELL_FLOATS));
        const feat = w.features();
        feat.ms.forEach((m, i) => F.set('ms', m, i * 12));
        feat.shelves.forEach((sl, i) => F.set('shelves', sl, i * 16));
        // highest cloud anywhere: nothing to sample above it
        const tops = [c.top + 200, ...cells.map(cl => cl.top + 200), ...feat.ms.map(m => m[5] + 2500)];
        for (const d of w.clouds.defs) if (w.clouds.coverage(c, d) > 0.005) tops.push(d.top);
        F.set('features', [feat.ms.length, feat.shelves.length, Math.min(Math.max(...tops), cfg.maxTop), 0]);
        // the march and shadow map start at the lowest cloud: wall clouds and shelf lips hang low
        const lows = [...feat.ms.map(m => m[4] - m[8] - 100), ...feat.shelves.map(sl => f.base + sl[8] - 300)];
        w.clouds.write(F, c, Math.min(c.base, ...lows.map(y => y + 1300)));
        F.set('near', [this.near.rain, this.near.snow, this.reset ? 1 : 0, cells.length]);
        r.device.queue.writeBuffer(r.boltBuf, 0, w.lightning.segs);

        // probe texel: where the precipitation above the camera left the cloud base
        const drop = Math.max(c.base - cam.pos[1], 0) * cfg.slant;
        const px = cam.pos[0] + c.wind[0] * drop, pz = cam.pos[2] + c.wind[1] * drop;
        this.probeTexel = [clamp(Math.floor((px - wo[0]) / texel), 0, WEATHER_RES - 1), clamp(Math.floor((pz - wo[1]) / texel), 0, WEATHER_RES - 1)];
        this.groundSnowHint = w.weather.freezingLevel < f.base + 150 ? 'settling' : w.weather.freezingLevel < f.max ? 'on the peaks' : 'melting';
    }

    frame(now) {
        requestAnimationFrame(t => this.frame(t));
        const dt = Math.min(0.1, (now - this.last) / 1000);
        this.last = now;
        if (dt > 0) this.fps = this.fps * 0.95 + (1 / dt) * 0.05;
        const io = this.input.consume();
        this.handleKeys(io.pressed);
        this.handleClicks(io.clicks);
        const r = this.renderer, w = this.world;
        if (r.resize(QUALITY[this.quality].scale)) this.reset = true;
        const before = [...this.camera.pos];
        if (!this.walker.active) this.camera.update(dt, io, this.input, w.field);
        this.updateSun(dt);

        const wdt = this.paused ? 0 : dt * this.timeScale;
        if (!this.paused) { this.time += dt; this.weatherTime += wdt; }
        w.busBoost = this.input.keys.has('KeyZ') ? 10 : 1;          // hold Z: the bus runs ten times as fast
        w.update(this.paused ? 0 : dt, wdt, this.time);
        // on foot after the bus has moved, so a rider's eye is where the bus is this frame
        if (this.walker.active) this.walker.update(dt, io, this.input, this);
        // doors: E opens or shuts the one in view (on foot or flying, not aboard a bus); they swing, and their leaves'
        // mesh is rewritten only while one moves
        const S = w.structures, wk = this.walker;
        this.door = wk.bus ? null : S.doorAt(this.camera.pos, this.camera.basis().fwd);
        if (this.door && io.pressed.includes('KeyE')) this.door.target = this.door.target > 0.5 ? 0 : 1;
        if (wk.active && !wk.bus) {
            wk.aim = this.door;
            wk.prompt = this.door ? `E ${this.door.target > 0.5 ? 'shut' : 'open'} the door` : '';
        }
        if (S.updateDoors(dt)) r.writeDoors(S.doorMesh());
        this.indoors = S.inside(this.camera.pos);
        if (v3.len(v3.sub(before, this.camera.pos)) > 3000) this.reset = true;
        this.probe = r.weatherPass.probe;
        this.near = this.nearPrecip();
        // under a roof or a deck: the way the drops come (as rainBack in WGSL) is blocked; or in the bus
        const c = w.weather.cur, fall = this.near.snow > this.near.rain ? 1.35 : rainFall(c.drops);
        // the bus ridden, or the nearest (its cabin keeps the rain out, the HUD tells of it)
        const cp = this.camera.pos, bd = b => Math.hypot(b.pose.x - cp[0], b.pose.y - cp[1], b.pose.z - cp[2]);
        this.rideBus = (this.walker.active && this.walker.bus) || w.buses.reduce((a, b) => !a || bd(b) < bd(a) ? b : a, null);
        this.inBus = !!this.rideBus && (() => { const q = this.rideBus.toLocal(this.camera.pos); return Math.abs(q[0]) < BUS.hl && Math.abs(q[2]) < BUS.hw && q[1] > BUS.skirt && q[1] < BUS.roof; })();
        this.sheltered = this.near.rain + this.near.snow > 0.01 && (this.inBus || !!this.indoors || w.structures.shelters(this.camera.pos, v3.norm([-c.wind[0] * 0.8, fall, -c.wind[1] * 0.8])));

        this.writeFrame(dt, wdt);
        const enc = r.device.createCommandEncoder();
        const total = this.near.rain + this.near.snow;
        const particles = total > 0.005 ? this.rainParticles + (this.drips && this.near.rain > 0.02 ? DRIP_PARTICLES : 0) : 0;
        r.render(enc, this.probeTexel, particles, w.lightning.count, QUALITY[this.quality].interleave, this.shadowSlices, this.froxels, this.mode !== 1, this.tiles);
        r.device.queue.submit([enc.finish()]);
        r.weatherPass.afterSubmit();
        r.profiler.afterSubmit();
        this.prevViewProj = this.viewProj;
        this.frameNo++;
        this.reset = false;
        this.hud.drawLabels(this);
        this.hud.update(this, now);
    }
}

// ------------------------------------------------------------------------------------------------- main
function showFallback(e) {
    console.error(e);
    document.getElementById('error-message').textContent = String(e && (e.stack || e.message) || e);
    document.getElementById('fallback').classList.add('show');
}

window.addEventListener('DOMContentLoaded', async () => {
    const app = new App(document.getElementById('view'));
    app.renderer.onError = showFallback;
    window.cloudDemo = app;        // devtools: world, renderer, camera
    try {
        await app.start();
        app.load(JSON.parse(document.getElementById('scenario').textContent));
    } catch (err) {
        showFallback(err);
        return;
    }
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', async e => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (!file) return;
        try {
            app.load(JSON.parse(await file.text()));
            app.hud.toast(`Loaded ${file.name}`);
        } catch (err) {
            app.hud.toast(`Could not load ${file.name}: ${err.message}`, 5000);
        }
    });
});
</script>
</body>
</html>
