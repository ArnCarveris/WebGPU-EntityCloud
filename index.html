<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030507;
            --panel: rgba(6, 12, 16, 0.78);
            --line: rgba(110, 220, 255, 0.28);
            --accent: #6edcff;
            --ok: #62f08a;
            --warn: #ffc94a;
            --danger: #ff4a3d;
            --text: #d6e6ee;
            --muted: #7d95a3;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }
        canvas#view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
        canvas#view.drag { cursor: grabbing; }
        canvas#labels { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
        .panel {
            position: fixed;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 8px 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            line-height: 1.35;
            pointer-events: none;
        }
        #hud { top: 12px; left: 12px; min-width: 340px; max-width: calc(100vw - 24px); white-space: pre; overflow: hidden; }
        #hud .t { color: var(--accent); letter-spacing: 0.12em; }
        #hud .on { color: var(--ok); }
        #hud .off { color: var(--danger); }
        #hud .w { color: var(--warn); }
        #hud .m { color: var(--muted); }
        #hud .snow { color: #cfe6ff; }
        #help { bottom: 12px; left: 12px; white-space: pre; color: var(--muted); }
        #help b { color: var(--text); font-weight: normal; }
        #states { bottom: 12px; right: 12px; white-space: pre; color: var(--muted); }
        #states b { color: var(--accent); font-weight: normal; }
        #states .sel { color: var(--warn); }
        #toast { top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--warn); font-size: 16px; display: none; text-align: center; }
        #fallback { display: none; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center; background: var(--bg); padding: 16px; }
        #fallback.show { display: flex; }
        .card { max-width: 480px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--danger); padding: 14px 16px; }
        .tag { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: var(--danger); }
        h1 { margin: 4px 0 2px; font-size: 24px; letter-spacing: 0.04em; text-transform: uppercase; }
        .desc { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
        #fallback pre { white-space: pre-wrap; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--danger); background: rgba(0,0,0,0.4); padding: 10px; margin: 10px 0 0; max-height: 40vh; overflow: auto; }
        @media (max-width: 700px) { #help, #states { display: none; } #hud { font-size: 10px; min-width: 0; } }
    </style>
</head>
<body>
    <canvas id="view"></canvas>
    <canvas id="labels"></canvas>
    <div id="hud" class="panel"></div>
    <div id="help" class="panel"></div>
    <div id="states" class="panel"></div>
    <div id="toast" class="panel"></div>
    <div id="fallback">
        <div class="card">
            <div class="tag">SYSTEM FAULT</div>
            <h1>WebGPU unavailable</h1>
            <p class="desc">This demo needs WebGPU (Chrome/Edge 113+, or Brave with WebGPU enabled in brave://flags).</p>
            <pre id="error-message">navigator.gpu is undefined</pre>
        </div>
    </div>

<!--
  Scenario: the whole world as data. Positions are metres, [x, z] on the map (x east, z south, map centred on 0); heights are
  metres above sea level.
    terrain   size (m), resolution (cells per side), base height, fieldSize (m, farm sections), pivots (chance of a centre-pivot circle)
    render    quality (0-3), shapeScale / detailScale (m per noise tile), detailStrength, maxTop (m, top of the cloud slab),
              maxDistance (m), weatherSize (m, weather map around the camera), rainExtinction / snowExtinction (1/m at full intensity),
              slant (how far the wind blows falling precipitation), fallSpeed (m/s, streak scroll), timeScale (weather s per real s),
              particles (near-field rain drops / snow flakes)
    clouds    cloud genus layers besides cumulus (max 4): { name, kind (heap | sheet | cellular), base, top (m), density (1/m),
              mapScale (m, coverage patches), shapeScale (m), stretch (along the wind; < 1 makes rolls across it), erosion,
              ambient (light scale, < 1 darker), precip (drizzle at full coverage) }
    weather   start, transition (s), cycle { enabled, hold (s) }, states { name: { coverage (cumulus), base, top, density, cirrus,
              layers { genus: coverage }, wind [x, z] m/s, temperature (C at sea level), haze, drizzle, storms (spawn rate x),
              power (storm precipitation x), lightning (x), rain (genus layer precipitation x; past 1 a deck pours),
              drops (0 drizzle .. 1 downpour: drop size, fall speed, how the near-field rain looks) }
              zones { along (bus entity id), variants [state names], length (m of route each), hold [min, max] s,
              dry { state, count } }: those states' rain at once, in stretches along the bus route, with `count` dry
              stretches under the `dry` state's sky (the deck opens there), reshuffled after a random hold } }
    entities  { type, id, label, ... }, type in ENTITY_TYPES, applied in order:
              terrain  tilt { dir, drop } | hills { amplitude, scale, octaves, seed, ridged } | mountain { pos, radius, height, roughness }
                       range { path, width, height, roughness, seed } | river { path, width, depth, bank } | lake { pos, radius, level }
                       town { pos, radius, density } | forest { pos, radius, density, seed }
              structure village { pos, radius, river (entity id; else road, degrees), houses, footbridge (m along the river),
                                  busStopSide (1 | -1), channel (m), seed }: houses, a bus shelter, a road bridge and a
                                  footbridge that keep the rain off what lies under them
                        busStation { pos, yaw (degrees), length, width (m of canopy), bays, buses, level (m levelled around pos), seed }:
                                  a cantilevered concrete canopy over an island platform, bays with buses, a terminal
              vehicle   bus { from (busStation id), to (village id), speed, village (m/s), dwell [station, village] s, livery [r, g, b],
                              fleet (default: the station's buses) }: a bus line on a road it builds between them, its buses
                                  leaving the station in turn; each can be ridden, its cabin a rain shelter that moves
              weather  storm { pos, radius, top, precip, core, coreOffset, life [grow, mature, decay] s, lightning (per min), virga, drift,
                               velocity, pinned, hold, shelf, laminar, green, wallCloud }
                       supercell { ...storm, mothership plate stack: stackRadius, stackDrop, stackHeight, plates, twist, spin (rad/s),
                                   wallCloud (m), wallRadius }
                       squall { from, to, count, radius, top, precip, lightning, green, drift, velocity, travel (m),
                                shelf cloud along the gust front: shelf (strength), lip (m above ground), shelfDepth, tiers, bow, gap }
                       spawner { area [x0, z0, x1, z1], rate (cells per weather hour), max, initial, seed, template { key: [min, max] } }
 buildings  archetypes for Structures.building, merged key by key over BUILDING_TYPES (house, terminal, block, kiosk; or new
              names): storeyHeight, plinth, wall, slab (m), window { width, height, sill, pitch }, door { width, height,
              color }, stairs { width } | false, furnish (FURNITURE: home | office | hall | kiosk), lamps (share of storeys
              lit), shelter (interior keeps rain and snow out; default true), inner / floorColor / ceiling [r, g, b].
              A village's houses use `houseType` (default house), a bus station `terminalType`, `blockType`, `kioskType`
    lighting  start, presets { name: { azimuth, elevation, intensity, exposure } }
    views     { name, pos [x, y, z], look [x, y, z] } or { name, follow (entity id), offset [x, height above ground, z], lookOffset }
              or { name, follow (entity id), spot (a viewpoint it laid out; a bus's "seat") }; optional lighting (preset name),
              weather (state name) and walk (true: on foot from there)
-->

<script>
'use strict';
// =====================================================================================================
// Entity Cloud: volumetric clouds, storm cells and their precipitation shafts in WebGPU, as one static page.
//
//   1. Weather map (compute, every frame): a 2D map around the camera with cloud coverage, cloud top, precipitation and
//      virga, built from the layer state (large-scale noise advected by the wind) plus every live storm cell entity.
//   2. Cloud shadow map (compute): sun transmittance through the cloud slab, and the sky occlusion of the column above.
//   3. Ground state (compute): snow cover and wetness accumulate under precipitation and melt / dry afterwards.
//   4. Scene (render): sky, then the terrain (farm sections, pivots, towns, mountains) with cloud shadows, snow and wet ground,
//      then structures (houses, bus shelters, bridges, a bus station): meshes on the terrain, with boxes in the shaders that cast sun shadows
//      and keep rain and snow off the ground, the near-field drops and the shafts under roofs and decks (WGSL_SHELTER).
//   5. Volumetrics (compute, reduced resolution): one ray march through clouds (Perlin-Worley shape + Worley detail,
//      light march + multiple-scattering octaves), rain and snow shafts falling from the cloud base (slanted by the wind,
//      streaky curtains, virga evaporating before the ground, rain below the freezing level and snow above), and height
//      haze with crepuscular rays from the shadow map; then temporal reprojection. The light reaching the rain, snow
//      and haze (cloud shadow, shadow cast by the shafts themselves, sky light, lightning) comes from a froxel volume
//      filled just before the march.
//   6. Final (render): composite + tonemap, near-field rain streaks / snow flakes around the camera, the bus's windows,
//      lightning bolts, radar.
//
// On foot (Walker) the camera walks on the terrain and the structures and can board any of the buses (BusLine) that drive
// between the bus station and the village, each leaving at its own time. The cabin of the nearest (or the one ridden) is
// one box in the frame uniform: no rain, snow or volumetrics inside it.

// -------------------------------------------------------------------------------------------------- math
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sat01 = x => clamp(x, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const v3 = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: a => Math.hypot(a[0], a[1], a[2]),
    norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};

// column-major 4x4
const m4 = {
    mul(a, b) {
        const o = new Float32Array(16);
        for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
            let s = 0;
            for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
            o[c * 4 + r] = s;
        }
        return o;
    },
    // rows: right, up, back
    view(eye, r, u, f) {
        const b = [-f[0], -f[1], -f[2]];
        return new Float32Array([r[0], u[0], b[0], 0, r[1], u[1], b[1], 0, r[2], u[2], b[2], 0,
            -v3.dot(r, eye), -v3.dot(u, eye), -v3.dot(b, eye), 1]);
    },
    // reversed-Z, infinite far plane: depth = near / view distance
    reversedInfinite(fovy, aspect, near) {
        const f = 1 / Math.tan(fovy / 2);
        return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, 0, -1, 0, 0, near, 0]);
    },
    project(m, p) {
        return [0, 1, 2, 3].map(r => m[r] * p[0] + m[4 + r] * p[1] + m[8 + r] * p[2] + m[12 + r]);
    },
};

function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// half floats for rgba16float uploads / readback
const toHalf = (() => {
    const f = new Float32Array(1), u = new Uint32Array(f.buffer);
    return v => {
        f[0] = v;
        const x = u[0], s = (x >>> 16) & 0x8000, e = ((x >>> 23) & 0xff) - 112, m = x & 0x7fffff;
        if (e <= 0) return s;
        if (e >= 31) return s | 0x7c00;
        return s | (e << 10) | (m >>> 13);
    };
})();
const fromHalf = h => {
    const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 31, m = h & 1023;
    if (e === 0) return s * m * 2 ** -24;
    if (e === 31) return m ? NaN : s * Infinity;
    return s * (1 + m / 1024) * 2 ** (e - 15);
};

// -------------------------------------------------------------------------------------------------- noise
function hash2(ix, iy, seed) {
    let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
}

function vnoise(x, y, seed) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed), c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
    return lerp(lerp(a, b, ux), lerp(c, d, ux), uy) * 2 - 1;
}

// fractal noise in about [-1, 1]; ridged gives sharp crests in [0, 1]
function fbm(x, y, { octaves = 5, seed = 1, ridged = false, gain = 0.5 } = {}) {
    let sum = 0, amp = 1, norm = 0, f = 1;
    for (let o = 0; o < octaves; o++) {
        const n = vnoise(x * f + o * 17.3, y * f - o * 9.1, seed + o * 31);
        sum += (ridged ? 1 - Math.abs(n) : n) * amp;
        norm += amp;
        amp *= gain;
        f *= 2.03;
    }
    return sum / norm;
}

// nearest point on a polyline: { dist, s (arc length at that point) }
function polylineNearest(pts, lens, x, z) {
    let best = Infinity, bs = 0;
    for (let k = 0; k < pts.length - 1; k++) {
        const [ax, az] = pts[k], [bx, bz] = pts[k + 1], dx = bx - ax, dz = bz - az;
        const l2 = dx * dx + dz * dz || 1;
        const t = clamp(((x - ax) * dx + (z - az) * dz) / l2, 0, 1);
        const px = ax + dx * t - x, pz = az + dz * t - z, d = px * px + pz * pz;
        if (d < best) { best = d; bs = lens[k] + t * Math.sqrt(l2); }
    }
    return { dist: Math.sqrt(best), s: bs };
}

function polylineLengths(pts) {
    const lens = [0];
    for (let k = 1; k < pts.length; k++) lens.push(lens[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
    return lens;
}

function polylineBox(pts, pad) {
    const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]);
    return [Math.min(...xs) - pad, Math.min(...zs) - pad, Math.max(...xs) + pad, Math.max(...zs) + pad];
}

// ----------------------------------------------------------------------------------------- heightfield
// CPU copy of the terrain plus a land-use map (r town, g forest, b water), authored by entities and uploaded once.
// Cell (i, j) centre sits at (origin + (i + 0.5) * cell, origin + (j + 0.5) * cell); i runs along x, j along z.
class Heightfield {
    constructor(size, n, base) {
        this.size = size;
        this.n = n;
        this.cell = size / n;
        this.origin = -size / 2;
        this.base = base;
        this.h = new Float32Array(n * n).fill(base);
        this.land = new Float32Array(n * n * 3);
        this.min = base;
        this.max = base;
    }

    cx(i) { return this.origin + (i + 0.5) * this.cell; }
    ci(x) { return (x - this.origin) / this.cell - 0.5; }

    // calls fn(idx, x, z, i, j) for every cell centre inside the world-space box
    each(x0, z0, x1, z1, fn) {
        const n = this.n;
        const i0 = clamp(Math.floor(this.ci(x0)), 0, n - 1), i1 = clamp(Math.ceil(this.ci(x1)), 0, n - 1);
        const j0 = clamp(Math.floor(this.ci(z0)), 0, n - 1), j1 = clamp(Math.ceil(this.ci(z1)), 0, n - 1);
        for (let j = j0; j <= j1; j++) {
            const z = this.cx(j);
            for (let i = i0; i <= i1; i++) fn(j * n + i, this.cx(i), z, i, j);
        }
    }

    eachAll(fn) { this.each(-Infinity, -Infinity, Infinity, Infinity, fn); }

    sample(x, z) {
        const n = this.n, fx = clamp(this.ci(x), 0, n - 1), fz = clamp(this.ci(z), 0, n - 1);
        const i = Math.min(Math.floor(fx), n - 2), j = Math.min(Math.floor(fz), n - 2), tx = fx - i, tz = fz - j, h = this.h;
        const v = lerp(lerp(h[j * n + i], h[j * n + i + 1], tx), lerp(h[(j + 1) * n + i], h[(j + 1) * n + i + 1], tx), tz);
        // matches the terrain shader: beyond the map the edge height eases back to the base level
        const out = Math.max(Math.abs(x), Math.abs(z)) - this.size / 2;
        return out > 0 ? lerp(this.base, v, Math.exp(-out / 4000)) : v;
    }

    paint(idx, channel, value) { const k = idx * 3 + channel; this.land[k] = Math.max(this.land[k], value); }

    // land use channel (0 town, 1 forest, 2 water) at x, z, filtered like the GPU's landTex
    landAt(x, z, ch) {
        const n = this.n, fx = clamp(this.ci(x), 0, n - 1), fz = clamp(this.ci(z), 0, n - 1);
        const i = Math.min(Math.floor(fx), n - 2), j = Math.min(Math.floor(fz), n - 2), tx = fx - i, tz = fz - j, L = this.land;
        const at = (a, b) => L[(b * n + a) * 3 + ch];
        return lerp(lerp(at(i, j), at(i + 1, j), tx), lerp(at(i, j + 1), at(i + 1, j + 1), tx), tz);
    }

    // after authoring: the heights as uploaded (half floats), for surface()
    freeze() { this.hq = this.h.map(v => fromHalf(toHalf(v))); }

    // the terrain exactly as drawn: half-float heights filtered bilinearly at the mesh vertices, flat triangles between
    // them (the inner, linear part of vsTerrain's grid). Structures stand on this, so they neither float nor sink.
    surface(x, z) {
        const N = GRID_N, half = this.size / 2, c = this.origin + half, n = this.n, h = this.hq;
        const texH = (px, pz) => {
            const fx = clamp(this.ci(px), 0, n - 1), fz = clamp(this.ci(pz), 0, n - 1);
            const i = Math.min(Math.floor(fx), n - 2), j = Math.min(Math.floor(fz), n - 2), tx = fx - i, tz = fz - j;
            return lerp(lerp(h[j * n + i], h[j * n + i + 1], tx), lerp(h[(j + 1) * n + i], h[(j + 1) * n + i + 1], tx), tz);
        };
        const vx = k => c + (k / (N - 1) * 2 - 1) / 0.72 * half;
        const g = u => ((u - c) / half * 0.72 + 1) / 2 * (N - 1);
        const gx = g(x), gz = g(z), i = clamp(Math.floor(gx), 0, N - 2), j = clamp(Math.floor(gz), 0, N - 2), fx = gx - i, fz = gz - j;
        const at = (a, b) => texH(vx(a), vx(b));
        // gridIndices: triangles (a, c, b) and (b, c, d), split along b-c
        if (fx + fz <= 1) { const ha = at(i, j); return ha + (at(i + 1, j) - ha) * fx + (at(i, j + 1) - ha) * fz; }
        const hd = at(i + 1, j + 1);
        return hd + (at(i, j + 1) - hd) * (1 - fx) + (at(i + 1, j) - hd) * (1 - fz);
    }

    updateRange() {
        let lo = Infinity, hi = -Infinity;
        for (const v of this.h) { if (v < lo) lo = v; if (v > hi) hi = v; }
        this.min = lo;
        this.max = hi;
    }

    // rgba16float texels: height, normal xyz
    packHeight() {
        const n = this.n, h = this.h, out = new Uint16Array(n * n * 4), c2 = this.cell * 2;
        for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
            const l = h[j * n + Math.max(i - 1, 0)], r = h[j * n + Math.min(i + 1, n - 1)];
            const u = h[Math.max(j - 1, 0) * n + i], d = h[Math.min(j + 1, n - 1) * n + i];
            const nv = v3.norm([(l - r) / c2, 1, (u - d) / c2]), k = (j * n + i) * 4;
            out[k] = toHalf(h[j * n + i]); out[k + 1] = toHalf(nv[0]); out[k + 2] = toHalf(nv[1]); out[k + 3] = toHalf(nv[2]);
        }
        return out;
    }

    packLand() {
        const n = this.n, out = new Uint8Array(n * n * 4);
        for (let k = 0; k < n * n; k++) {
            out[k * 4] = clamp(this.land[k * 3], 0, 1) * 255;
            out[k * 4 + 1] = clamp(this.land[k * 3 + 1], 0, 1) * 255;
            out[k * 4 + 2] = clamp(this.land[k * 3 + 2], 0, 1) * 255;
            out[k * 4 + 3] = 255;
        }
        return out;
    }

    // first hit of a ray with the heightfield, or null
    raycast(o, d, maxDist = 150000) {
        const above = t => { const p = v3.add(o, v3.mul(d, t)); return p[1] - this.sample(p[0], p[2]); };
        if (above(0) < 0) return null;
        let t = 0, prev = 0;
        while (t < maxDist) {
            prev = t;
            t += Math.max(this.cell * 0.5, t * 0.004);
            const p = v3.add(o, v3.mul(d, t));
            if (above(t) < 0) {
                let a = prev, b = t;
                for (let k = 0; k < 20; k++) { const m = (a + b) / 2; if (above(m) < 0) b = m; else a = m; }
                return v3.add(o, v3.mul(d, b));
            }
            if (p[1] > this.max + 100 && d[1] >= 0) return null;
        }
        return null;
    }
}

// Per-frame uniform block. The WGSL struct is generated from this list, so offsets can never drift apart.
const FRAME_LAYOUT = [

    ['prevViewProj', 'mat4x4f'],

    ['fwd', 'vec4f'],       // xyz, near
    ['right', 'vec4f'],     // right * tan(fovx / 2), frame index
    ['up', 'vec4f'],        // up * tan(fovy / 2), weather time (s)
    ['sunDir', 'vec4f'],    // xyz, -
    ['sunCol', 'vec4f'],    // rgb irradiance, exposure
    ['zenith', 'vec4f'],    // rgb sky radiance, haze extinction at the ground (1/m)
    ['horizon', 'vec4f'],   // rgb sky radiance, haze scale height (m)
    ['ambient', 'vec4f'],   // rgb sky ambient, -
    ['screen', 'vec4f'],    // full w, h, volumetric w, h
    ['cloud', 'vec4f'],     // base, layer top, extinction (1/m), coverage
    ['noise', 'vec4f'],     // shape scale, detail scale, detail strength, slab top
    ['wind', 'vec4f'],      // wind x, z (m/s), noise offset x, z (m)
    ['precip', 'vec4f'],    // freezing level, slant (s/m), rain extinction, snow extinction
    ['wdomain', 'vec4f'],   // weather map origin x, z, size, resolution
    ['tdomain', 'vec4f'],   // terrain origin x, z, size, resolution
    ['ground', 'vec4f'],    // field size, pivot chance, ground state resolution, render mode
    ['cirrus', 'vec4f'],    // altitude, coverage, scale, drizzle
    ['flash', `array<vec4f, ${MAX_FLASHES}>`], // xyz, intensity
    ['march', 'vec4f'],     // steps, light steps, max distance, radar on
    ['near', 'vec4f'],      // near rain, near snow, history reset, storm cell count
    ['misc', 'vec4f'],      // sea-level temperature, streak scroll (m), ground reference height, weather dt (s)
    ['layers', `array<vec4f, ${MAX_LAYERS * 3}>`], // per genus: [base, top, coverage, extinction] [map scale, shape scale, stretch, erosion] [kind, ambient, precip, seed]
    ['layerInfo', 'vec4f'], // lowest genus base, highest genus top, lowest cloud of any kind, -
    ['ms', `array<vec4f, ${MAX_MOTHERSHIPS * 3}>`],  // [x, z, radius, spin] [stack bottom, top, plates, twist] [wall drop, wall radius, strength, seed]
    ['shelves', `array<vec4f, ${MAX_SHELVES * 4}>`], // [end a, end b] [bow control, motion dir] [lip height, depth, tiers, strength] [bbox]
    ['features', 'vec4f'],  // motherships, shelf lines, highest cloud top (m), -
    ['lod', 'vec4f'],       // march interleave (1, 2, 4), shadow map slices, slice this frame, detail distance (m)
    ['froxel', 'vec4f'],    // near, far (m), froxels on, -
    ['post', 'vec4f'],      // cloud blur radius (volumetric texels), cloud tile pre-pass on, -, -
    ['blocks', 'vec4f'],    // structure boxes: count, lowest bottom, highest top (m), -
    ['blockBox', 'vec4f'],  // their bounds x0, z0, x1, z1, padded for the shadows and rain shadows they cast
    ['rain', 'vec4f'],      // drop size (0 drizzle .. 1 downpour), rain fall speed (m/s), genus layer precipitation scale, rain particles
    ['zoneInfo', 'vec4f'],  // rain zones in rainZones, their fade (0 .. 1), their radius (m), a clear stretch's opening along the route (m)
    ['rainZones', `array<vec4f, ${MAX_RAIN_ZONES}>`], // points along the bus route (mixed rain): x, z, genus layer cover scale, precipitation scale
    ['zoneDirs', `array<vec4f, ${MAX_RAIN_ZONES / 2}>`], // the route's direction at them, two per vec4: x, z
    ['drips', 'vec4f'],     // roof edges in dripEdges, -, -, -
    ['dripEdges', `array<vec4f, ${MAX_DRIPS * 3}>`], // [x, z, half x, half z] [cos yaw, sin yaw, edge height, drop to the ground] [share of drops up to this edge, edges (0 all four, 1 along local x), share of its drops kept, -]
    ['blockers', `array<vec4f, ${MAX_BLOCKERS * 3}>`], // [x, z, half x, half z] [cos yaw, sin yaw, bottom, top] [sky occlusion, slope, moving, enclosed]
    ['blockGrid', `array<vec4u, ${BLOCK_GRID * BLOCK_GRID}>`], // per cell of blockBox: bit k set if box k can shade a point in it
    // the bus nearest the camera, or the one ridden (BusLine): world to its frame (each bus is drawn with its own, wgslBus)
    ['busInv', 'mat4x4f'],
    ['cabinLo', 'vec4f'],   // its body in its frame (inCabin): min corner, bus on
    ['cabinHi', 'vec4f'],   // max corner, -
];

class FrameBlock {
    constructor() {
        const size = t => t === 'mat4x4f' ? 16 : t === 'vec4f' ? 4 : 4 * parseInt(t.match(/(\d+)>$/)[1]);
        this.offsets = {};
        let o = 0;
        for (const [name, type] of FRAME_LAYOUT) { this.offsets[name] = o; o += size(type); }
        this.data = new Float32Array(o);
    }
    set(name, values, at = 0) { this.data.set(values, this.offsets[name] + at); }
    setBits(name, words) { new Uint32Array(this.data.buffer, this.offsets[name] * 4, words.length).set(words); }
    static wgsl() { return `struct Frame {\n${FRAME_LAYOUT.map(([n, t]) => `    ${n}: ${t},`).join('\n')}\n};\n`; }
}

// Shared resources. A shader asks for the subset it uses by name; binding numbers are the table index, so a module's
// declarations and its bind group layout come from the same list.
const WORLD_BINDINGS = [
    ['F', 'uniform', 'var<uniform> F: Frame'],
    ['shapeTex', 'tex3d', 'var shapeTex: texture_3d<f32>'],
    ['detailTex', 'tex3d', 'var detailTex: texture_3d<f32>'],
    ['weatherTex', 'tex', 'var weatherTex: texture_2d<f32>'],
    ['shadowTex', 'tex', 'var shadowTex: texture_2d<f32>'],
    ['heightTex', 'tex', 'var heightTex: texture_2d<f32>'],
    ['landTex', 'tex', 'var landTex: texture_2d<f32>'],
    ['repSamp', 'sampler', 'var repSamp: sampler'],
    ['clampSamp', 'sampler', 'var clampSamp: sampler'],
    ['cells', 'read', 'var<storage, read> cells: array<Cell>'],
    ['ground', 'read', 'var<storage, read> ground: array<vec2f>'],
    ['bolts', 'read', 'var<storage, read> bolts: array<vec4f>'],
    ['anvilTex', 'tex', 'var anvilTex: texture_2d<f32>'],     // anvil coverage, anvil top, shelf coverage, shelf wedge
    ['layerTex', 'tex', 'var layerTex: texture_2d<f32>'],     // coverage of each cloud genus layer
    ['styleTex', 'tex', 'var styleTex: texture_2d<f32>'],     // laminar plates, green tint, wall cloud lowering (m), -
    ['occ', 'read', 'var<storage, read> occ: array<u32>'],     // per column, bit k: height cell k may hold noise cloud
    ['buildings', 'read', 'var<storage, read> buildings: array<vec4f>'],   // every building's frame, storeys and windows (WGSL_BUILDING)
];

function layoutEntry(binding, visibility, kind) {
    const [k, arg] = kind.split(':'), e = { binding, visibility };
    if (k === 'uniform') e.buffer = { type: 'uniform' };
    else if (k === 'read') e.buffer = { type: 'read-only-storage' };
    else if (k === 'storage') e.buffer = { type: 'storage' };
    else if (k === 'tex') e.texture = { sampleType: arg || 'float', viewDimension: '2d' };
    else if (k === 'tex3d') e.texture = { sampleType: 'float', viewDimension: '3d' };
    else if (k === 'depth') e.texture = { sampleType: 'depth', viewDimension: '2d' };
    else if (k === 'sampler') e.sampler = { type: 'filtering' };
    else if (k === 'write') e.storageTexture = { access: 'write-only', format: arg, viewDimension: '2d' };
    else if (k === 'write3d') e.storageTexture = { access: 'write-only', format: arg, viewDimension: '3d' };
    else throw new Error(`layout kind ${kind}`);
    return e;
}

const asResource = r => r instanceof GPUBuffer ? { buffer: r } : r;

class BindingSet {
    constructor(device, names, group = 0) {
        this.device = device;
        this.slots = names.map(n => {
            const b = WORLD_BINDINGS.findIndex(x => x[0] === n);
            if (b < 0) throw new Error(`unknown binding ${n}`);
            return { name: n, binding: b, kind: WORLD_BINDINGS[b][1], decl: WORLD_BINDINGS[b][2] };
        });
        const vis = GPUShaderStage.COMPUTE | GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT;
        this.layout = device.createBindGroupLayout({ entries: this.slots.map(s => layoutEntry(s.binding, vis, s.kind)) });
        this.wgsl = this.slots.map(s => `@group(${group}) @binding(${s.binding}) ${s.decl};`).join('\n') + '\n';
    }
    group(res, label) {
        return this.device.createBindGroup({ label, layout: this.layout, entries: this.slots.map(s => ({ binding: s.binding, resource: asResource(res[s.name]) })) });
    }
}

// private bindings of one pass (outputs, screen textures): kinds in binding order
function makeLayout(device, visibility, kinds) {
    return device.createBindGroupLayout({ entries: kinds.map((k, b) => layoutEntry(b, visibility, k)) });
}
function makeGroup(device, layout, resources, label) {
    return device.createBindGroup({ label, layout, entries: resources.map((r, binding) => ({ binding, resource: asResource(r) })) });
}
function makeBuffer(device, size, usage, data) {
    const b = device.createBuffer({ size: Math.max(16, Math.ceil(size / 4) * 4), usage, mappedAtCreation: !!data });
    if (data) { new data.constructor(b.getMappedRange()).set(data); b.unmap(); }
    return b;
}
function gridIndices(w) {
    const idx = new Uint32Array((w - 1) * (w - 1) * 6);
    let o = 0;
    for (let j = 0; j < w - 1; j++) for (let i = 0; i < w - 1; i++) {
        const a = j * w + i, b = a + 1, c = a + w, d = c + 1;
        idx[o++] = a; idx[o++] = c; idx[o++] = b;
        idx[o++] = b; idx[o++] = c; idx[o++] = d;
    }
    return idx;
}

// ---------------------------------------------------------------------------------------- WGSL helpers
// no bindings
const WGSL_MATH = /* wgsl */`
const PI = 3.14159265;
struct Cell { a: vec4f, b: vec4f, c: vec4f, d: vec4f };
// a: x, z, radius, top   b: coverage, precip, seed, virga   c: core, core offset x, z, -   d: shelf, laminar, green, wall cloud (m)

fn sat(x: f32) -> f32 { return clamp(x, 0.0, 1.0); }
fn remap(x: f32, a: f32, b: f32, c: f32, d: f32) -> f32 { return c + (x - a) / (b - a) * (d - c); }
fn hg(mu: f32, g: f32) -> f32 {
    let g2 = g * g;
    return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * mu, 1e-4), 1.5));
}
fn hash12(p: vec2f) -> f32 {
    var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}
fn pcg(v: u32) -> u32 {
    let s = v * 747796405u + 2891336453u;
    let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
    return (w >> 22u) ^ w;
}
fn rnd(v: u32) -> f32 { return f32(pcg(v)) / 4294967295.0; }
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }
fn vnoise2(p: vec2f) -> f32 {
    let i = floor(p);
    let f = fract(p);
    let u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash12(i), hash12(i + vec2f(1.0, 0.0)), u.x), mix(hash12(i + vec2f(0.0, 1.0)), hash12(i + vec2f(1.0, 1.0)), u.x), u.y);
}
fn fbm2(p: vec2f, oct: i32) -> f32 {
    var s = 0.0; var a = 0.5; var n = 0.0; var q = p;
    for (var i = 0; i < oct; i++) { s += a * vnoise2(q); n += a; a *= 0.5; q = q * 2.03 + vec2f(17.1, -9.3); }
    return s / n;
}
fn aces(x: vec3f) -> vec3f {
    let a = x * (2.51 * x + 0.03);
    let b = x * (2.43 * x + 0.59) + 0.14;
    return clamp(a / b, vec3f(0.0), vec3f(1.0));
}
`;

// needs F
const WGSL_SKY = /* wgsl */`
fn rayDir(ndc: vec2f) -> vec3f { return normalize(F.fwd.xyz + F.right.xyz * ndc.x + F.up.xyz * ndc.y); }

// interleaved march (F.lod.x): 1 every pixel; 2 a checkerboard, alternating; 4 one pixel of each 2x2 block, cycling
// diagonally first so consecutive frames are far apart. marchCorner: the 2x2 block's marched pixel this frame
fn marchCorner() -> vec2u {
    let k = u32(F.right.w) & 3u;
    return vec2u(select(0u, 1u, k == 1u || k == 2u), select(0u, 1u, k == 1u || k == 3u));
}
fn marchedNow(q: vec2i) -> bool {
    let n = i32(F.lod.x);
    if (n >= 4) { return all((vec2u(q) & vec2u(1u)) == marchCorner()); }
    if (n >= 2) { return ((q.x + q.y + i32(F.right.w)) & 1) == 0; }
    return true;
}
fn tonemap(c: vec3f) -> vec3f { return pow(aces(c * F.sunCol.w), vec3f(1.0 / 2.2)); }

fn skyColor(dir: vec3f) -> vec3f {
    let mu = dot(dir, F.sunDir.xyz);
    let t = pow(sat(dir.y + 0.02), 0.5);
    var c = mix(F.horizon.rgb, F.zenith.rgb, t);
    c = mix(c, F.horizon.rgb * 0.7, sat(-dir.y * 8.0));
    return c + F.sunCol.rgb * (hg(mu, 0.78) * 0.025 + hg(mu, 0.3) * 0.02 * (1.0 - t));
}

const FLASH_COLOR = vec3f(0.75, 0.82, 1.0);

`;

// needs F, weatherTex, clampSamp
const WGSL_WEATHER_SAMPLE = /* wgsl */`
// the shadow map's sun rays climb from the lowest cloud through the slab, no flatter than this (a lower sun would run
// them off the map)
fn shadowSunDir() -> vec3f { return normalize(vec3f(F.sunDir.x, max(F.sunDir.y, 0.08), F.sunDir.z)); }
// the shadow map splits each sun ray's optical depth at this height: just above the convective layer's top
fn sunSplit() -> f32 { return F.cloud.y + 300.0; }

// how much of the precipitation in weather sample w evaporates before the ground: its virga, which a downpour
// overwhelms (from intensity 0.6, gone by 1.4); the near-field rain on the CPU mirrors it (nearPrecip)
fn virgaOf(w: vec4f) -> f32 { return w.w * (1.0 - sat((w.z - 0.6) / 0.8)); }

// x coverage, y cloud top (m), z precipitation (0..2, past 1 in severe storms), w virga (0 reaches the ground .. 1 evaporates at the cloud base)
fn weatherAt(xz: vec2f) -> vec4f {
    let uv = (xz - F.wdomain.xy) / F.wdomain.z;
    let w = textureSampleLevel(weatherTex, clampSamp, uv, 0.0);
    let e = sat(min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y)) * 12.0);
    return mix(vec4f(F.cloud.w * 0.6, F.cloud.y, 0.0, 0.0), w, e);
}
// the cloud base precipitation falls from at xz: the layer's base, lowered under a mothership to the bottom of its
// plate stack (which hangs below the base) and back up across the stack's bell-shaped rim
fn precipBase(xz: vec2f) -> f32 {
    var b = F.cloud.x;
    for (var i = 0; i < i32(F.features.x); i++) {
        let A = F.ms[i * 3];
        let B = F.ms[i * 3 + 1];
        b = min(b, mix(B.x, F.cloud.x, smoothstep(A.z * 0.6, A.z * 1.05, distance(xz, A.xy))));
    }
    return b;
}
`;

// needs F, shapeTex, detailTex, anvilTex, layerTex, styleTex, repSamp, clampSamp (+ weather sample)
const WGSL_DENSITY = /* wgsl */`
// added to every noise cloud's coverage: the tile pre-pass pads the clouds with it, so they reach a little further
var<private> covBoost: f32 = 0.0;

fn mapUV(xz: vec2f) -> vec2f { return (xz - F.wdomain.xy) / F.wdomain.z; }
fn mapFade(uv: vec2f) -> f32 { return sat(min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y)) * 12.0); }
fn windDir() -> vec2f { let wl = length(F.wind.xy); return select(vec2f(1.0, 0.0), F.wind.xy / wl, wl > 0.1); }

// x anvil coverage, y anvil top (m), z shelf cloud coverage, w shelf wedge (1 on the storm side, 0 at the leading edge)
fn anvilAt(xz: vec2f) -> vec4f {
    let uv = mapUV(xz);
    let f = mapFade(uv);
    return textureSampleLevel(anvilTex, clampSamp, uv, 0.0) * vec4f(f, 1.0, f, 1.0);
}
// coverage of each genus layer; beyond the map, a plain share of the state's coverage
fn layerCovAt(xz: vec2f) -> vec4f {
    let uv = mapUV(xz);
    let edge = vec4f(F.layers[0].z, F.layers[3].z, F.layers[6].z, F.layers[9].z) * 0.7;
    return mix(edge, textureSampleLevel(layerTex, clampSamp, uv, 0.0), mapFade(uv));
}
fn styleAt(xz: vec2f) -> vec4f { let uv = mapUV(xz); return textureSampleLevel(styleTex, clampSamp, uv, 0.0) * mapFade(uv); }

// cumulus layer and storm towers from the weather map, anvils, mothership plates and wall clouds (st = style sample)
fn convectiveDensity(p: vec3f, w: vec4f, an: vec4f, st: vec4f, detail: bool) -> f32 {
    let base0 = F.cloud.x;
    let base = base0 - st.z;                                                  // wall cloud: lowered base under the updraft
    if (p.y <= base) { return 0.0; }
    let top = max(w.y, base0 + 400.0);
    var cov = 0.0;
    var prof = 0.0;
    var h = 0.0;
    if (p.y < top && w.x >= 0.01) {
        h = (p.y - base) / (top - base);
        let tall = sat((top - base - 2500.0) / 6000.0);                       // cumulonimbus towers
        prof = sat(h / 0.025 + 0.15) * sat((1.0 - h) / mix(0.45, 0.14, tall)); // flat bases, rounded tops
        cov = min(sat(w.x * mix(1.0, 0.72, h)) * 0.94 + covBoost, 1.0);      // towers narrow upwards
    }
    if (p.y > base0 + 2500.0) {
        let band = 2800.0;
        if (an.x > 0.01 && p.y > an.y - band && p.y < an.y) {
            let ha = (p.y - (an.y - band)) / band;
            let pa = sat(ha / 0.35) * sat((1.0 - ha) / 0.2);
            if (an.x * pa > cov * prof) { cov = min(an.x + covBoost, 1.0); prof = pa; h = max(h, 0.85); }
        }
    }
    if (cov <= 0.0 || prof <= 0.0) { return 0.0; }
    let wd = windDir();
    let q = vec3f(p.x - F.wind.z - wd.x * (p.y - base) * 0.25, p.y, p.z - F.wind.w - wd.y * (p.y - base) * 0.25);
    let s = textureSampleLevel(shapeTex, repSamp, q / F.noise.x, 0.0);
    let wf = s.y * 0.625 + s.z * 0.25 + s.w * 0.125;
    var d = sat(remap(s.x, wf - 1.0, 1.0, 0.0, 1.0)) * prof;
    // mothership: smooth stacked plates around the rotating updraft
    if (st.x > 0.01) {
        let plate = abs(fract(p.y / 950.0 + 0.3 * sin(p.x / 4200.0) + 0.3 * cos(p.z / 5100.0)) * 2.0 - 1.0);
        d = mix(d, d * (0.72 + 0.28 * smoothstep(0.05, 0.4, plate)) + 0.12 * prof, st.x);
    }
    d = sat(remap(d, 1.0 - cov, 1.0, 0.0, 1.0)) * cov;
    if (d <= 0.0) { return 0.0; }
    if (detail) {
        let n = textureSampleLevel(detailTex, repSamp, q / F.noise.y + vec3f(0.0, F.up.w * 0.0004, 0.0), 0.0);
        let dw = n.x * 0.625 + n.y * 0.25 + n.z * 0.125;
        let e = mix(dw, 1.0 - dw, sat(h * 5.0));                     // wispy bases, billowy tops
        d = sat(remap(d, e * F.noise.z * (1.0 - 0.75 * st.x), 1.0, 0.0, 1.0));
    }
    return d * F.cloud.z;
}

// shelf cloud: a tiered wedge along a storm's gust front, low and dark underneath
fn shelfDensity(p: vec3f, an: vec4f) -> f32 {
    if (an.z < 0.01) { return 0.0; }
    let base = F.cloud.x;
    // lowest at the lip near the leading edge; the top slopes up into the storm's base behind it
    let lip = smoothstep(0.0, 0.3, an.w) * (1.0 - 0.55 * an.w);
    let bottom = base - 1100.0 * lip;
    let top = bottom + 250.0 + 1100.0 * an.w;
    if (p.y <= bottom || p.y >= top) { return 0.0; }
    let h = (p.y - bottom) / (top - bottom);
    let tiers = 0.5 + 0.5 * smoothstep(0.15, 0.6, abs(fract(h * 3.0 + 0.15 * sin(p.x / 1800.0 + p.z / 2300.0)) * 2.0 - 1.0));
    let s = textureSampleLevel(shapeTex, repSamp, vec3f(p.x - F.wind.z, p.y * 2.0, p.z - F.wind.w) / (F.noise.x * 0.6), 0.0);
    let prof = sat(h / 0.08) * sat((1.0 - h) / 0.35);
    let sc = min(an.z + covBoost, 1.0);
    var d = sat(remap((0.4 + 0.6 * s.x) * prof * tiers, 1.0 - sc, 1.0, 0.0, 1.0)) * sc;
    let dn = textureSampleLevel(detailTex, repSamp, vec3f(p.x - F.wind.z, p.y, p.z - F.wind.w) / 1100.0, 0.0);
    d = sat(remap(d, (dn.x * 0.625 + dn.y * 0.25 + dn.z * 0.125) * 0.55, 1.0, 0.0, 1.0));   // ragged scud underneath
    return d * F.cloud.z;
}

// genus layer i (stratus, nimbostratus, altostratus, altocumulus, ...) with coverage cov from the layer map
fn layerDensity(p: vec3f, i: i32, cov: f32, detail: bool) -> f32 {
    let A = F.layers[i * 3];
    let B = F.layers[i * 3 + 1];
    let C = F.layers[i * 3 + 2];
    if (cov < 0.01 || p.y <= A.x || p.y >= A.y) { return 0.0; }
    let h = (p.y - A.x) / (A.y - A.x);
    let wd = windDir();
    let rel = p.xz - F.wind.zw;
    let lp = vec3f(dot(rel, wd) / B.z, p.y, dot(rel, vec2f(-wd.y, wd.x)));   // stretched along the wind (B.z > 1) or across it
    let s = textureSampleLevel(shapeTex, repSamp, lp / B.y + C.w, 0.0);
    let kind = i32(C.x);
    var n = 0.0;
    var prof = 0.0;
    if (kind == 2) {            // cellular: separate puffs in rows (altocumulus)
        n = s.z * 0.75 + s.w * 0.25;
        prof = sat(h / 0.25) * sat((1.0 - h) / 0.35);
    } else if (kind == 1) {     // sheet: flat and featureless (stratus, altostratus, nimbostratus)
        n = 0.55 + 0.45 * s.x;
        prof = sat(h / 0.12) * sat((1.0 - h) / 0.18);
    } else {                    // heaped
        n = sat(remap(s.x, s.y * 0.625 + s.z * 0.25 + s.w * 0.125 - 1.0, 1.0, 0.0, 1.0));
        prof = sat(h / 0.05) * sat((1.0 - h) / 0.4);
    }
    let cv = min(cov + covBoost, 1.0);
    var d = sat(remap(n * prof, 1.0 - cv, 1.0, 0.0, 1.0)) * cv;
    if (d <= 0.0) { return 0.0; }
    if (detail && B.w > 0.0) {
        let dn = textureSampleLevel(detailTex, repSamp, lp / (B.y * 0.2) + C.w, 0.0);
        d = sat(remap(d, (dn.x * 0.625 + dn.y * 0.25 + dn.z * 0.125) * B.w, 1.0, 0.0, 1.0));
    }
    return d * A.w;
}

fn bez(a: vec2f, c: vec2f, b: vec2f, t: f32) -> vec2f { let u = 1.0 - t; return u * u * a + 2.0 * u * t * c + t * t * b; }

fn rot2(v: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * v.x - s * v.y, s * v.x + c * v.y); }

// mothership: a stack of striated plates turning around a supercell's updraft, with a wall cloud and scud under it.
// x extinction (1/m), y mask where the ordinary convective cloud gives way to it, z sky light (plate tops lit, lips dark)
// lod 0: eroded rims, grooves, scud   1: grooves, scud   2 (lighting, shadows): shape only
fn mothershipDensity(p: vec3f, i: i32, lod: i32) -> vec3f {
    let A = F.ms[i * 3];        // centre x, z, radius, spin (rad)
    let B = F.ms[i * 3 + 1];    // stack bottom, stack top, plates, twist (plates climbed per turn)
    let C = F.ms[i * 3 + 2];    // wall cloud drop, wall cloud radius (fraction), strength, seed
    let rel = p.xz - A.xy;
    let r = length(rel);
    if (r > A.z * 1.3 || p.y < B.x - C.x - 450.0 || p.y > B.y + 2500.0) { return vec3f(0.0); }
    // the ordinary cloud gives way inside the stack and comes back towards its top, so the tower grows out of it
    let mask = (1.0 - smoothstep(A.z * 0.95, A.z * 1.3, r)) * (1.0 - smoothstep(B.y - 500.0, B.y + 2500.0, p.y)) * C.z;
    if (p.y > B.y + 500.0) { return vec3f(0.0, mask, 1.0); }
    let rl = rot2(rel, -A.w);                                  // co-rotating frame: features turn with the updraft
    let a = atan2(rl.y, rl.x);
    // low-frequency warp: plates bend, thicken and thin; the outline bulges unevenly
    let wv = textureSampleLevel(shapeTex, repSamp, vec3f(rl.x, p.y * 1.6, rl.y) / 7000.0 + C.w, 0.0);
    let rw = r + (wv.z - 0.5) * 800.0 + (wv.w - 0.5) * 300.0;
    var d = 0.0;
    var sky = 0.2;
    if (p.y >= B.x) {
        let h = (p.y - B.x) / (B.y - B.x);
        let hw = h + (wv.y - 0.5) * 0.05;                           // plates undulate a little, stay readable
        // envelope: wide flat base, bulging low down, tapering into the tower above
        let env = A.z * (0.76 + 0.24 * sin(PI * sat(hw / 0.7))) * mix(1.0, 0.6, smoothstep(0.5, 1.0, hw));   // bell, not pagoda
        // plates: tiers with a rounded lip on their lower edge, in a slow helix
        let f = fract(hw * B.z + B.w * a / (2.0 * PI));
        let lip = smoothstep(0.0, 0.16, f) * pow(1.0 - f, 1.3);
        let R = env * (0.86 + 0.14 * lip);
        // soft rim, uneven inside
        d = pow(sat((R - rw) / 700.0), 0.7) * (0.6 + 0.4 * wv.x);
        d *= sat((p.y - B.x) / 150.0) * (1.0 - smoothstep(B.y - 1200.0, B.y + 500.0, p.y));
        sky = (0.22 + 0.55 * smoothstep(0.05, 0.9, f)) * (0.55 + 0.45 * h) * (0.8 + 0.4 * wv.x);
        if (lod <= 1 && d > 0.0) {
            d *= 0.88 + 0.12 * smoothstep(0.1, 0.9, abs(fract(hw * B.z * 2.0 + B.w * a / PI + wv.y * 0.5) * 2.0 - 1.0));
        }
        if (lod == 0 && d > 0.0) {
            // billowy, eroded rim; the core stays smooth
            let rim = 1.0 - sat((R - rw) / 1800.0);
            let n1 = textureSampleLevel(detailTex, repSamp, vec3f(rl.x, p.y, rl.y) / 1500.0 + C.w, 0.0);
            let n2 = textureSampleLevel(detailTex, repSamp, vec3f(rl.x, p.y, rl.y) / 700.0, 0.0).x;
            let e = (n1.x * 0.625 + n1.y * 0.25 + n1.z * 0.125) * 0.75 + n2 * 0.25;
            d = sat(remap(d, e * (0.08 + 0.4 * rim), 1.0, 0.0, 1.0));
        }
    } else {
        // wall cloud: a lowered drum under the updraft, narrowing downwards to a ragged bottom
        let k = (B.x - p.y) / C.x;
        let wr = A.z * C.y * (1.0 - 0.45 * k * k) * (1.0 + (wv.z - 0.5) * 0.5);
        let cut = 0.75 + 0.6 * (wv.y - 0.5);
        d = (1.0 - smoothstep(wr - 300.0, wr + 60.0, r)) * (1.0 - smoothstep(cut - 0.25, cut + 0.1, k));
        sky = 0.15;
        // scud: torn shreds hanging under the plates
        if (lod <= 1 && p.y > B.x - 450.0 && r < A.z * 0.95) {
            let n = textureSampleLevel(detailTex, repSamp, vec3f(rl.x, p.y * 2.0, rl.y) / 900.0 + C.w, 0.0);
            let sc = smoothstep(0.52, 0.8, n.x * 0.7 + n.y * 0.3 + (wv.x - 0.5) * 0.4) * (1.0 - (B.x - p.y) / 450.0) * 0.6;
            d = max(d, sc);
        }
    }
    return vec3f(d * C.z * F.cloud.z, mask, sky);
}

// shelf cloud along a squall line's gust front: stacked laminar wedges, lowest at the leading lip, their tops sloping
// up into the storm base behind; the lip wanders along the line, scud hangs under it.
// lod 0: eroded edges, striations, scud   1: striations, scud   2 (lighting, shadows): shape only
fn shelfLineDensity(p: vec3f, i: i32, lod: i32) -> vec2f {
    let A = F.shelves[i * 4];        // ends a (xy), b (zw)
    let B = F.shelves[i * 4 + 1];    // bow control point (xy), motion direction (zw)
    let C = F.shelves[i * 4 + 2];    // lip height above ground, depth, tiers, strength
    let D = F.shelves[i * 4 + 3];    // bounding box
    let lipY = F.misc.z + C.x;
    if (p.y < lipY - 600.0 || p.y > F.cloud.x + 300.0) { return vec2f(0.0); }
    if (p.x < D.x || p.z < D.y || p.x > D.z || p.z > D.w) { return vec2f(0.0); }
    let a = A.xy;
    let b = A.zw;
    let c = B.xy;
    let ab = b - a;
    let depth = C.y;
    // cheap reject against the chord before solving for the curve
    var bt = sat(dot(p.xz - a, ab) / max(dot(ab, ab), 1.0));
    if (distance(p.xz, a + ab * bt) > distance(c, (a + b) * 0.5) * 0.5 + depth + 2500.0) { return vec2f(0.0); }
    // nearest point on the bowed front: Newton steps on the quadratic Bezier
    for (var k = 0; k < 3; k++) {
        let q = bez(a, c, b, bt);
        let dq = 2.0 * (1.0 - bt) * (c - a) + 2.0 * bt * (b - c);
        let ddq = 2.0 * (a - 2.0 * c + b);
        bt = sat(bt - dot(q - p.xz, dq) / max(dot(dq, dq) + dot(q - p.xz, ddq), 1.0));
    }
    let bq = bez(a, c, b, bt);
    if (distance(p.xz, bq) > depth + 1500.0) { return vec2f(0.0); }
    let ends = smoothstep(0.0, 0.07, bt) * (1.0 - smoothstep(0.93, 1.0, bt));
    // warps: along the line the lip wanders and the tiers rise and dip; in 3D the surfaces bulge
    let lw = textureSampleLevel(shapeTex, repSamp, vec3f(bt * length(ab) / 14000.0, 0.31, f32(i) * 0.37 + 0.5), 0.0);
    let wv = textureSampleLevel(shapeTex, repSamp, vec3f(p.x - F.wind.z, p.y * 3.0, p.z - F.wind.w) / 9000.0, 0.0);
    let wob = wv.x - 0.5;
    let u = -dot(p.xz - bq, B.zw) + (lw.x - 0.5) * 1800.0 + (lw.z - 0.5) * 600.0 + wob * 700.0;   // distance behind the lip
    let lift = (lw.y - 0.5) * 350.0;
    let topSlope = (F.cloud.x + 250.0 - lipY) / depth;
    var d = 0.0;
    var sky = 0.2;
    for (var j = 0; j < i32(C.z); j++) {
        let fj = f32(j);
        let uj = u - fj * depth * 0.12;
        let yj = lipY + lift + fj * (380.0 + (lw.w - 0.5) * 160.0);
        let thick = 230.0 + fj * 60.0;
        var inside = 0.0;
        var v = 0.0;                // height within the tier: 0 underside, 1 top
        if (uj < 0.0) {             // the rounded nose of the tier
            inside = 1.0 - smoothstep(thick * 0.5 - 90.0, thick * 0.5 + 40.0, length(vec2f(uj, p.y - (yj + thick * 0.5))));
            v = sat((p.y - yj) / thick);
        } else {
            let yb = yj + uj * 0.025;                        // nearly flat underside
            let yt = yj + thick + uj * topSlope;             // top slopes up into the storm base
            inside = smoothstep(yb - 50.0, yb + 90.0, p.y) * (1.0 - smoothstep(yt - 120.0, yt + 40.0, p.y)) * (1.0 - smoothstep(depth * 0.8, depth, uj));
            v = sat((p.y - yb) / max(yt - yb, 1.0));
        }
        if (inside > d) { d = inside; sky = (0.1 + 0.8 * v * v) * (0.8 + 0.4 * wv.y); }
    }
    d *= 0.72 + 0.28 * wv.y;                                  // uneven inside
    if (lod <= 1 && d > 0.0) {
        // laminar striations parallel to the front
        d *= 0.6 + 0.4 * smoothstep(0.1, 0.6, abs(fract((p.y - lipY - max(u, 0.0) * topSlope * 0.5) / 140.0 + wob) * 2.0 - 1.0));
    }
    if (lod == 0 && d > 0.0) {
        let n = textureSampleLevel(detailTex, repSamp, vec3f(p.x - F.wind.z, p.y * 1.5, p.z - F.wind.w) / 800.0, 0.0);
        d = sat(remap(d, (n.x * 0.625 + n.y * 0.25 + n.z * 0.125) * 0.4, 1.0, 0.0, 1.0));
    }
    // scud: torn fragments under the shelf, behind the lip
    let yb0 = lipY + lift + max(u, 0.0) * 0.025;
    if (lod <= 1 && p.y < yb0 && p.y > yb0 - 380.0 && u > 200.0 && u < depth * 0.75) {
        let n = textureSampleLevel(detailTex, repSamp, vec3f(p.x - F.wind.z, p.y * 2.5, p.z - F.wind.w) / 750.0, 0.0);
        let sc = smoothstep(0.55, 0.82, n.x * 0.7 + n.y * 0.3 + wob * 0.3) * (1.0 - (yb0 - p.y) / 380.0) * 0.55;
        if (sc > d) { d = sc; sky = 0.12; }
    }
    return vec2f(d * ends * C.w * F.cloud.z, sky);
}

// every kind of cloud at p: x extinction (1/m), y ambient light scale, z green tint.
// lod: 0 full detail, 1 no detail erosion, 2 shape only (light march, shadow map). feat: bits of the analytic
// structures this ray can meet (0-3 motherships, 4-5 shelf lines)
fn cloudSample(p: vec3f, w: vec4f, lod: i32, feat: u32) -> vec3f { return cloudSampleN(p, w, lod, feat, true); }

// noise: false skips the noise clouds (convective layer, anvils, shelves, genus layers), where the occupancy grid
// proves there are none; the analytic structures are still evaluated
fn cloudSampleN(p: vec3f, w: vec4f, lod: i32, feat: u32, noise: bool) -> vec3f {
    var d = 0.0;
    var amb = 0.0;
    var green = 0.0;
    let base = F.cloud.x;
    // analytic storm structures; motherships replace the noise cloud where they stand
    var mask = 0.0;
    for (var i = 0; i < i32(F.features.x); i++) {
        if ((feat & (1u << u32(i))) == 0u) { continue; }
        let m = mothershipDensity(p, i, lod);
        d += m.x;
        amb += m.x * m.z;
        mask = max(mask, m.y);
    }
    for (var i = 0; i < i32(F.features.y); i++) {
        if ((feat & (16u << u32(i))) == 0u) { continue; }
        let sl = shelfLineDensity(p, i, lod);
        d += sl.x;
        amb += sl.x * sl.y;
    }
    if (noise && p.y > base - 1300.0 && mask < 0.999) {
        // fetch the anvil / shelf map only where those can be (anvils high, cell shelves low) and the style map only
        // near storm cells (they lift the weather map's cloud top)
        var an = vec4f(0.0);
        if (p.y > base + 2500.0 || p.y < base + 450.0) { an = anvilAt(p.xz); }
        var st = vec4f(0.0);
        if (w.y > F.cloud.y + 30.0) { st = styleAt(p.xz); }
        let dc = convectiveDensity(p, w, an, st, lod == 0) * (1.0 - mask);
        var ds = 0.0;
        if (an.z > 0.01) { ds = shelfDensity(p, an); }
        d += dc + ds;
        amb += dc + ds * 0.5;
        green = st.y * sat((base + 3500.0 - p.y) / 3000.0);
    }
    if (noise && p.y > F.layerInfo.x && p.y < F.layerInfo.y) {
        let lc = layerCovAt(p.xz);
        for (var i = 0; i < ${MAX_LAYERS}; i++) {
            let dl = layerDensity(p, i, lc[i], lod == 0);
            d += dl;
            amb += dl * F.layers[i * 3 + 2].y;
        }
    }
    return vec3f(d, amb / max(d, 1e-9), green);
}

// shape-only extinction, for light marches and the shadow map
fn cloudDensity(p: vec3f, w: vec4f) -> f32 { return cloudSample(p, w, 2, 0xffffffffu).x; }

// rain (x) and snow (y) extinction (1/m) at p; w is the weather it fell from (precipSourceAt)
fn precipDensity(p: vec3f, w: vec4f) -> vec2f {
    let e = precipEnvelope(p, w);
    if (e.x + e.y <= 0.0) { return e; }
    let heavy = sat((w.z - 0.6) / 0.8);                               // storm cores: the curtains merge into a wall
    let q = vec3f(p.x - F.wind.z, p.y + F.misc.y, p.z - F.wind.w);       // curtains travel with the clouds
    let streak = textureSampleLevel(detailTex, repSamp, vec3f(q.x / 420.0, q.y / 4200.0, q.z / 420.0), 0.0);
    let clump = textureSampleLevel(shapeTex, repSamp, vec3f(q.x / 6000.0, q.y / 24000.0, q.z / 6000.0), 0.0).x;
    let curtain = smoothstep(0.38, 0.9, (streak.x * 0.7 + streak.y * 0.3) * 0.6 + clump * 0.6);
    return e * mix(0.12 + 0.88 * curtain, 0.7 + 0.3 * curtain, heavy);
}

// the shaft without its streaky curtains: precipitation, virga and the cloud base shape it, the freezing level splits
// it into rain (x) and snow (y)
fn precipEnvelope(p: vec3f, w: vec4f) -> vec2f {
    if (w.z < 0.003) { return vec2f(0.0); }
    let base = precipBase(p.xz);
    let v = virgaOf(w);
    let bottom = mix(F.misc.z - 300.0, base, v);                      // virga: evaporated below here
    let low = smoothstep(bottom, bottom + max(250.0, (base - bottom) * 0.7 * v + 250.0), p.y);
    let high = sat((base + 700.0 - p.y) / 900.0);                     // shafts start inside the cloud
    let snow = smoothstep(F.precip.x - 250.0, F.precip.x + 250.0, p.y);
    let rate = w.z * (1.0 + 0.8 * sat((w.z - 0.6) / 0.8));               // heavy precipitation is disproportionately dense
    return rate * low * high * vec2f((1.0 - snow) * F.precip.z, snow * F.precip.w);
}
`;

// needs F, shadowTex, clampSamp
const WGSL_SHADOW_SAMPLE = /* wgsl */`
// optical depth of the clouds between p and the sun, from the shadow map: the sun ray through p crosses the lowest
// cloud's height at one texel, which holds the ray's whole optical depth and the part below sunSplit(); what lies
// below p is taken off, assuming the cloud spread evenly over each part's height. Cloud lights use it for the sun
// ray beyond their own short march, so a low sun cannot light the underside of a deck it would have to cross
fn sunDepthAbove(p: vec3f) -> f32 {
    let s = shadowSunDir();
    let base = F.layerInfo.z;
    let top = F.noise.w;
    if (p.y >= top) { return 0.0; }
    let uv = (p.xz - s.xz * (max(p.y, base) - base) / s.y - F.wdomain.xy) / F.wdomain.z;
    if (any(uv < vec2f(0.0)) || any(uv > vec2f(1.0))) { return 0.0; }
    let t = textureSampleLevel(shadowTex, clampSamp, uv, 0.0);
    let total = -log(max(t.x, 1e-6));
    let low = min(t.w, total);
    let split = sunSplit();
    var below = low * sat((p.y - base) / max(split - base, 1.0));
    if (p.y > split) { below = mix(low, total, sat((p.y - split) / max(top - split, 1.0))); }
    return max(total - below, 0.0);
}

// x: sun transmittance through the cloud slab, y: sky light left under the cloud column above p
fn shadowAt(p: vec3f) -> vec2f {
    let s = F.sunDir.xyz;
    let base = F.layerInfo.z;
    let lift = max(base - p.y, 0.0);
    let xz = p.xz + s.xz * lift / max(s.y, 0.08);
    let ua = (xz - F.wdomain.xy) / F.wdomain.z;
    let ub = (p.xz - F.wdomain.xy) / F.wdomain.z;
    let a = textureSampleLevel(shadowTex, clampSamp, ua, 0.0).x;
    let b = 0.12 + 0.88 * textureSampleLevel(shadowTex, clampSamp, ub, 0.0).y;
    // beyond the map: no cloud shadows instead of its edge texels smeared outwards
    let ea = sat(min(min(ua.x, 1.0 - ua.x), min(ua.y, 1.0 - ua.y)) * 12.0);
    let eb = sat(min(min(ub.x, 1.0 - ub.x), min(ub.y, 1.0 - ub.y)) * 12.0);
    // inside the slab the map's march from its base overstates the cloud toward the sun; that only starts at the real
    // cloud base (the lowest layer or the convective base), not at layerInfo.z, which is padded down for wall clouds and
    // shelf lips and can lie below the ground (which then got a tenth of the sun under a full overcast)
    let cb = min(F.layerInfo.x, F.cloud.x);
    let above = sat((p.y - cb) / max(F.noise.w - cb, 1.0));
    return vec2f(mix(mix(1.0, a, ea), 1.0, above), mix(mix(1.0, b, eb), 1.0, above));
}

// Diffuse light inside a cloud: sky light reaching p through the cloud above it, from the shadow map's column (its
// optical depth, with the cloud taken as spread evenly from the lowest cloud up to top) and the column's sun
// transmittance (for light the sunlit ground bounces up). x sky, y sun on the ground below.
// Light scattered many times, mostly forward, gets through a thick cloud far better than a straight beam does:
// diffusion gives a transmittance of about 1 / (1 + 0.75 (1 - g) tau), with g = 0.85 for cloud droplets
fn cloudAbove(p: vec3f, top: f32) -> vec2f {
    let uv = (p.xz - F.wdomain.xy) / F.wdomain.z;
    let e = sat(min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y)) * 12.0);
    let c = textureSampleLevel(shadowTex, clampSamp, uv, 0.0);
    let frac = sat((top - p.y) / max(top - F.layerInfo.z, 1.0));
    let od = -log(max(c.y, 1e-6)) / 0.03 * frac;                      // optical depth above p
    return mix(vec2f(1.0), vec2f(1.0 / (1.0 + 0.11 * od), c.x), e);
}
// The diffuse field flows downward (light enters through the tops, the ground sends little back), so it is brighter
// looking up than down, more so the more cloud lies above: radiance seen along a ray of direction dir, with sky the
// light left after the cloud above (1 open sky .. 0 deep in a storm)
fn diffuseLook(sky: f32, dirY: f32) -> f32 { return 1.0 + 0.6 * (1.0 - sky) * dirY; }

// Lightning at p, seen through the storm: a flash fires inside the cloud, so its light diffuses out through the cloud
// between it and p (diffusion transmittance, as in cloudAbove). The cloud is that of the flash's column (shadow map
// optical depth over its height, from the lowest cloud to its top) spread evenly; the part of the flash-to-p segment
// within those heights crosses it. So the cloud around a flash glows, its base and the rain and ground below get a
// dimmed, spread-out light, and air beside the storm is lit only by what leaves the cloud
const FLASH_GAIN = 10.0;
fn flashLit(p: vec3f) -> f32 {
    var l = 0.0;
    for (var k = 0; k < ${MAX_FLASHES}; k++) {
        let f = F.flash[k];
        if (f.w <= 0.0) { continue; }
        let d = distance(p, f.xyz);
        let uv = (f.xz - F.wdomain.xy) / F.wdomain.z;
        let base = F.layerInfo.z;
        let top = max(weatherAt(f.xz).y, base + 400.0);
        let colOD = -log(max(textureSampleLevel(shadowTex, clampSamp, uv, 0.0).y, 1e-6)) / 0.03;
        let sigma = colOD / (top - base);                               // mean extinction of the storm column (1/m)
        let y0 = min(p.y, f.y);
        let y1 = max(p.y, f.y);
        var inside = select(0.0, 1.0, p.y > base && p.y < top);         // a level segment: in cloud or not
        if (y1 - y0 > 1.0) { inside = max(min(y1, top) - max(y0, base), 0.0) / (y1 - y0); }
        // FLASH_GAIN: a flash outshines the sky by orders of magnitude, so even the few percent that diffuses out of
        // a storm lights it up
        l += FLASH_GAIN * f.w / (1.0 + d * d * 4e-7) / (1.0 + 0.11 * sigma * d * inside);
    }
    return l;
}

// share of precipitation that can leave the cloud base at xz: rain needs cloud above it. A storm's rain core sits on
// its flank and the wind carries the shaft further, so without this some of it would fall from clear sky beside the
// cloud. The shadow map's z term measures the low cloud above (1 clear .. 0 thick): an anvil overhead does not count
fn rainCover(xz: vec2f) -> f32 {
    let low = textureSampleLevel(shadowTex, clampSamp, (xz - F.wdomain.xy) / F.wdomain.z, 0.0).z;
    return smoothstep(0.03, 0.3, 1.0 - low);
}
// the weather precipitation at p fell from. Storms move with the wind aloft and the slower air below holds the falling
// precipitation back, so a shaft trails behind its cloud: what reaches p left the cloud base downwind of it, and the
// longer the fall the further. Its rate is cut where no cloud hangs above that point
fn precipSourceAt(p: vec3f) -> vec4f {
    let xz = p.xz + F.wind.xy * max(precipBase(p.xz) - p.y, 0.0) * F.precip.y;
    var w = weatherAt(xz);
    w.z *= rainCover(xz);
    return w;
}
`;

// needs F. Structures (houses, the bus stop, bridge decks) stand in the shaders as up to MAX_BLOCKERS boxes, each turned
// by its yaw and sheared along its local x by a slope (bridge decks follow their arch). Box k in F.blockers:
//   [centre x, z, half size along local x, z] [cos yaw, sin yaw, bottom, top (m, at the centre)] [sky occlusion, slope, -, -]
// A grid over their bounds (F.blockGrid, built each frame for the sun and the wind) lists the boxes each cell's rays can
// reach, so a point tests only those.
// Local x runs along (cos, sin) in xz, local z along (-sin, cos). The boxes cast sun shadows, and rain cannot fall
// through them: a point is dry where the path its drops came along (back up against their fall, slanted by the wind)
// crosses a box. So the ground, the near-field drops and the shafts stay dry under roofs and decks and in the lee of walls.
const WGSL_SHELTER = /* wgsl */`
// p can be shaded by a structure: inside the boxes' bounds (padded for long shadows and slanted rain), below the tallest
fn nearStructures(p: vec3f) -> bool {
    let b = F.blockBox;
    return F.blocks.x > 0.5 && p.y < F.blocks.z && all(p.xz > b.xy) && all(p.xz < b.zw);
}

// the boxes that can shade p (call when nearStructures(p)): bit k of word k / 32
fn blockCell(p: vec3f) -> vec4u {
    let b = F.blockBox;
    let c = min(vec2u((p.xz - b.xy) / (b.zw - b.xy) * ${BLOCK_GRID}.0), vec2u(${BLOCK_GRID - 1}u));
    return F.blockGrid[c.y * ${BLOCK_GRID}u + c.x];
}

// where the ray from o along d is inside box k: [t in, t out]
fn blockerSpan(k: i32, o: vec3f, d: vec3f) -> vec2f {
    let A = F.blockers[k * 3];
    let B = F.blockers[k * 3 + 1];
    let slope = F.blockers[k * 3 + 2].y;
    let r = o.xz - A.xy;
    let lx = r.x * B.x + r.y * B.y;
    let dx = d.x * B.x + d.z * B.y;
    let lo = vec3f(lx, o.y - slope * lx, -r.x * B.y + r.y * B.x);
    let ld = vec3f(dx, d.y - slope * dx, -d.x * B.y + d.z * B.x);
    let inv = 1.0 / select(ld, vec3f(1e-6), abs(ld) < vec3f(1e-6));
    let a = (vec3f(-A.z, B.z, -A.w) - lo) * inv;
    let b = (vec3f(A.z, B.w, A.w) - lo) * inv;
    return vec2f(max(max(min(a.x, b.x), min(a.y, b.y)), min(a.z, b.z)), min(min(max(a.x, b.x), max(a.y, b.y)), max(a.z, b.z)));
}

// the ray from o along d enters box k (a ray starting inside a box does not count, so surfaces do not shade themselves)
fn blockerHit(k: i32, o: vec3f, d: vec3f) -> bool {
    let s = blockerSpan(k, o, d);
    return s.x > 0.02 && s.x <= s.y;
}

// box k keeps the rain coming down along -r off p: the way back up enters it, or p is inside it and it is enclosed (a
// building's interior, Structures.building: sheltered however the wind blows). One span either way (a ray from inside
// starts before the box's near side)
fn blockerRain(k: i32, p: vec3f, r: vec3f) -> bool {
    let s = blockerSpan(k, p, r);
    return (s.x > 0.02 && s.x <= s.y) || (F.blockers[k * 3 + 2].w > 0.5 && s.x < 0.0 && s.y > 0.0);
}

// the way the rain (or snow) reaching height y came: back up against its fall, slanted by the wind as the near-field
// drops and flakes are (0.8 of the wind; rain falls at F.rain.y, from 2.5 m/s for drizzle to 10 m/s in a downpour, snow at
// 1.35 m/s, so drizzle and snow blow in further)
fn rainBack(y: f32) -> vec3f {
    let snow = smoothstep(F.precip.x - 250.0, F.precip.x + 250.0, y);
    return normalize(vec3f(-F.wind.x * 0.8, mix(F.rain.y, 1.35, snow), -F.wind.y * 0.8));
}

// 1 where rain reaches p, 0 where a structure keeps it off
fn rainReaches(p: vec3f) -> f32 {
    if (!nearStructures(p)) { return 1.0; }
    let r = rainBack(p.y);
    let m = blockCell(p);
    for (var w = 0u; w < 4u; w++) {
        var bits = m[w];
        while (bits != 0u) {
            let k = i32(w * 32u + countTrailingZeros(bits));
            if (blockerRain(k, p, r)) { return 0.0; }
            bits &= bits - 1u;
        }
    }
    return 1.0;
}

// at a surface point p: x the sun reaches it, y the rain reaches it, z sky light left (less under roofs and decks).
// sun / rain false skip those tests (sun already shadowed by cloud, or the ground is dry anyway)
fn structureLight(p: vec3f, sun: bool, rain: bool) -> vec3f {
    var o = vec3f(1.0);
    if (!nearStructures(p)) { return o; }
    let s = F.sunDir.xyz;
    let doSun = sun && s.y > 0.0;
    let r = rainBack(p.y);
    let m = blockCell(p);
    for (var w = 0u; w < 4u; w++) {
        var bits = m[w];
        while (bits != 0u) {
            let k = i32(w * 32u + countTrailingZeros(bits));
            bits &= bits - 1u;
            if (doSun && o.x > 0.0 && blockerHit(k, p, s)) { o.x = 0.0; }
            // a moving box (the bus) does not leave a dry patch: the ground it passes over stays wet
            if (rain && o.y > 0.0 && F.blockers[k * 3 + 2].z < 0.5 && blockerRain(k, p, r)) { o.y = 0.0; }
            let ao = F.blockers[k * 3 + 2].x;
            if (ao > 0.0 && blockerHit(k, p, vec3f(0.0, 1.0, 0.0))) { o.z = min(o.z, 1.0 - ao); }
        }
    }
    return o;
}

// The cabin of the bus nearest the camera (or the one ridden): one box in its frame (F.busInv), so the tests are O(1).
// Inside it no rain or snow falls (near-field drops, drips) and the volumetric march takes nothing (rain shafts, haze): a
// rain shelter that moves. Other buses further off only keep the rain off as shader boxes (Structures' blockers).
fn busLocal(p: vec3f) -> vec3f { return (F.busInv * vec4f(p, 1.0)).xyz; }

fn inCabin(p: vec3f) -> bool {
    if (F.cabinLo.w < 0.5) { return false; }
    let q = busLocal(p);
    return all(q > F.cabinLo.xyz) && all(q < F.cabinHi.xyz);
}

// where the ray from o along unit d is inside the cabin: [t in, t out] (t out < t in when it misses)
fn cabinSpan(o: vec3f, d: vec3f) -> vec2f {
    if (F.cabinLo.w < 0.5) { return vec2f(1.0, 0.0); }
    let q = busLocal(o);
    let ld = (F.busInv * vec4f(d, 0.0)).xyz;
    let inv = 1.0 / select(ld, vec3f(1e-6), abs(ld) < vec3f(1e-6));
    let a = (F.cabinLo.xyz - q) * inv;
    let b = (F.cabinHi.xyz - q) * inv;
    let tn = max(max(min(a.x, b.x), min(a.y, b.y)), min(a.z, b.z));
    let tf = min(min(max(a.x, b.x), max(a.y, b.y)), max(a.z, b.z));
    return vec2f(max(tn, 0.0), tf);
}
`;

// needs F, buildings. Building `id` (Structures.building) in buildings[id * 4 ..]:
//   [centre x, z, cos yaw, sin yaw] [half size x, z, floor (m), storey height] [storeys, sill, window height, pitch]
//   [window width, wall thickness, share of storeys lit, faces with windows (bits: 1 -z, 2 +z, 4 -x, 8 +x)]
// Its interior, glass and door vertices carry material + id * BLD_ID. All of it is O(1) per pixel: the window pattern is
// a formula (the same one the mesh was built with), so the sun through a window is one box exit.
const WGSL_BUILDING = /* wgsl */`
struct Bld { a: vec4f, b: vec4f, c: vec4f, d: vec4f };
fn bld(id: u32) -> Bld { let k = id * 4u; return Bld(buildings[k], buildings[k + 1u], buildings[k + 2u], buildings[k + 3u]); }

// world to the building's frame (local x along (cos, sin), z along (-sin, cos), y stays the world height), and back
fn bldLocal(b: Bld, p: vec3f) -> vec3f { let r = p.xz - b.a.xy; return vec3f(r.x * b.a.z + r.y * b.a.w, p.y, -r.x * b.a.w + r.y * b.a.z); }
fn bldDir(b: Bld, d: vec3f) -> vec3f { return vec3f(d.x * b.a.z + d.z * b.a.w, d.y, -d.x * b.a.w + d.z * b.a.z); }
fn bldWorld(b: Bld, q: vec3f) -> vec3f { return vec3f(b.a.x + q.x * b.a.z - q.z * b.a.w, q.y, b.a.y + q.x * b.a.w + q.z * b.a.z); }
fn bldCentre(b: Bld) -> vec3f { return vec3f(b.a.x, b.b.z + b.c.x * b.b.w * 0.5, b.a.y); }
fn bldStorey(b: Bld, y: f32) -> f32 { return clamp(floor((y - b.b.z) / b.b.w), 0.0, b.c.x - 1.0); }

// the lamps of storey s are on: a share of the storeys (b.d.z), picked by a hash
fn storeyLit(id: u32, b: Bld, s: f32) -> f32 { return select(0.0, 1.0, rnd(id * 131u + u32(s) * 7u + 3u) < b.d.z); }

// u along a wall len m long, yr above its storey's floor, is in a window: they are spread evenly over the wall, keeping
// clear of its corners (as Structures.building lays them out)
fn inWindow(b: Bld, u: f32, len: f32, yr: f32) -> bool {
    let usable = len - 2.0 * (b.d.y + 0.2);
    let nw = max(1.0, floor(usable / b.c.w));
    let cell = usable / nw;
    let k = (u + usable * 0.5) / cell;
    return k >= 0.0 && k < nw && abs(fract(k) - 0.5) * cell < b.d.x * 0.5 && yr > b.c.y && yr < b.c.y + b.c.z;
}

// the ray from q (building frame, inside) along local d leaves the building through a window of q's own storey (the floors
// above and below it are in the way of the others): xyz where it leaves, w 1 if through glass
fn throughWindow(b: Bld, q: vec3f, d: vec3f) -> vec4f {
    let lo = vec3f(-b.b.x, b.b.z, -b.b.y);
    let hi = vec3f(b.b.x, b.b.z + b.c.x * b.b.w, b.b.y);
    let inv = 1.0 / select(d, vec3f(1e-6), abs(d) < vec3f(1e-6));
    let t = max((lo - q) * inv, (hi - q) * inv);
    let te = min(t.x, min(t.y, t.z));
    let e = q + d * te;
    let yr = e.y - b.b.z - bldStorey(b, q.y) * b.b.w;
    if (te == t.y || yr < 0.0 || yr > b.b.w) { return vec4f(e, 0.0); }
    let faces = u32(b.d.w + 0.5);
    var hit = false;
    if (te == t.x) { hit = inWindow(b, e.z, 2.0 * b.b.y, yr) && (faces & select(4u, 8u, d.x > 0.0)) != 0u; }
    else { hit = inWindow(b, e.x, 2.0 * b.b.x, yr) && (faces & select(1u, 2u, d.z > 0.0)) != 0u; }
    return vec4f(e, select(0.0, 1.0, hit));
}

// what a lamp-lit room adds to a window seen from outside
fn windowGlow(id: u32, b: Bld, y: f32) -> vec3f { return vec3f(1.0, 0.86, 0.62) * 0.1 / max(F.sunCol.w, 0.2) * storeyLit(id, b, bldStorey(b, y)); }
`;

// One bus as it is drawn (each bus of each BusLine in turn, at a dynamic offset of BUS_UNIFORM bytes): its frame to clip
// space (built in doubles about the camera, so it does not jitter), to world and back, its speed (m/s) and doors open
// (0..1). The scene module binds it as group 1 (vsBus, fsBus), the final one as group 2 (the glass)
const BUS_UNIFORM = 256;
const wgslBus = group => /* wgsl */`
struct BusDraw { mvp: mat4x4f, model: mat4x4f, inv: mat4x4f, info: vec4f };
@group(${group}) @binding(0) var<uniform> busU: BusDraw;

// a bus vertex in its frame: door leaves (material flags ${BUS_LEAF[0]}, ${BUS_LEAF[1]}) slide apart outside the body as the doors open
fn busVertex(p: vec3f, mat: f32) -> vec3f {
    let m = u32(mat + 0.5);
    let o = busU.info.y;
    if ((m & ${BUS_LEAF[0]}u) != 0u) { return p + vec3f(-0.6 * o, 0.0, 0.07 * smoothstep(0.0, 0.25, o)); }
    if ((m & ${BUS_LEAF[1]}u) != 0u) { return p + vec3f(0.6 * o, 0.0, 0.07 * smoothstep(0.0, 0.25, o)); }
    return p;
}
`;

// ------------------------------------------------------------------------------- WGSL empty-space skipping
// Occupancy grid, each frame after the weather map: one thread per column, 32 height cells from the lowest cloud
// (layerInfo.z) to the highest top (features.z). A cell's bit is set where the noise clouds can exist at that height:
// within the convective layer up to the column's highest top (lowered bases under wall clouds included), in an anvil
// band, at shelf height, or in a genus layer's band, with the largest values over every weather texel a bilinear
// fetch in the column can touch. Most empty air the march crosses lies above the column's own top (the slab reaches
// up to the tallest storm anywhere) or outside the genus bands; a bound on the shape noise as well was measured to
// skip little more and cost as much as it saved.
// The analytic structures (motherships, shelf lines) are not in it; the march evaluates them per ray as before.
const WGSL_OCCUPANCY = /* wgsl */`
@group(1) @binding(0) var<storage, read_write> occOut: array<u32>;

@compute @workgroup_size(8, 8)
fn occupancy(@builtin(global_invocation_id) gid: vec3u) {
    let n = ${OCC_RES}u;
    if (gid.x >= n || gid.y >= n) { return; }
    let idx = gid.y * n + gid.x;
    let wn = i32(F.wdomain.w);
    let per = wn / i32(n);
    let t0 = vec2i(gid.xy) * per - 1;
    let t1 = t0 + per + 1;
    // near the map edges the samplers blend towards defaults: no bound there
    let fade = i32(ceil(f32(wn) / 12.0)) + 1;
    if (any(t0 < vec2i(fade)) || any(t1 >= vec2i(wn - fade))) { occOut[idx] = 0xffffffffu; return; }
    var w = vec2f(0.0);     // coverage, top
    var an = vec4f(0.0);    // anvil coverage, anvil top, shelf coverage, -
    var lc = vec4f(0.0);    // genus coverage
    var wall = 0.0;         // wall cloud lowering (m)
    for (var y = t0.y; y <= t1.y; y++) {
        for (var x = t0.x; x <= t1.x; x++) {
            let c = vec2i(x, y);
            w = max(w, textureLoad(weatherTex, c, 0).xy);
            an = max(an, textureLoad(anvilTex, c, 0));
            lc = max(lc, textureLoad(layerTex, c, 0));
            wall = max(wall, textureLoad(styleTex, c, 0).z);
        }
    }
    let base0 = F.cloud.x;
    let convTop = max(w.y, base0 + 400.0);
    let Y0 = F.layerInfo.z;
    let dy = (F.features.z - Y0) / 32.0;
    var bits = 0u;
    for (var k = 0u; k < 32u; k++) {
        let y0 = Y0 + dy * f32(k) - 1.0;
        let y1 = y0 + dy + 2.0;
        var on = false;
        for (var i = 0; i < ${MAX_LAYERS}; i++) {
            let A = F.layers[i * 3];
            if (lc[i] >= 0.01 && y1 > A.x && y0 < A.y) { on = true; }
        }
        if (an.z > 0.01 && y1 > base0 - 1100.0 && y0 < base0 + 1350.0) { on = true; }
        if (w.x >= 0.01 && y1 > base0 - wall && y0 < convTop) { on = true; }               // convective layer, towers
        if (an.x > 0.01 && y1 > base0 + 2500.0 && y0 < an.y) { on = true; }               // anvils
        if (on) { bits |= 1u << k; }
    }
    occOut[idx] = bits;
}
`;

// ---------------------------------------------------------------------------------- WGSL noise volumes
// Tileable 3D noise, baked once: shape (Perlin-Worley + 3 Worley fbm octaves) and detail (3 Worley fbm octaves).
const WGSL_NOISE = /* wgsl */`
@group(0) @binding(0) var shapeOut: texture_storage_3d<rgba8unorm, write>;
@group(0) @binding(1) var detailOut: texture_storage_3d<rgba8unorm, write>;

fn pcg3(v0: vec3u) -> vec3u {
    var v = v0 * 1664525u + 1013904223u;
    v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
    v ^= v >> vec3u(16u);
    v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
    return v;
}
fn h33(c: vec3i, seed: u32) -> vec3f { return vec3f(pcg3(vec3u(c) + vec3u(seed, seed * 7u, seed * 13u))) / 4294967295.0; }
fn wrapc(c: vec3i, period: i32) -> vec3i { return ((c % vec3i(period)) + vec3i(period)) % vec3i(period); }

fn worley(p: vec3f, period: i32, seed: u32) -> f32 {
    let id = vec3i(floor(p));
    let f = fract(p);
    var md = 1e9;
    for (var z = -1; z <= 1; z++) {
        for (var y = -1; y <= 1; y++) {
            for (var x = -1; x <= 1; x++) {
                let o = vec3i(x, y, z);
                let d = vec3f(o) + h33(wrapc(id + o, period), seed) - f;
                md = min(md, dot(d, d));
            }
        }
    }
    return clamp(1.0 - sqrt(md), 0.0, 1.0);
}

fn gradAt(c: vec3i, period: i32, seed: u32) -> vec3f { return normalize(h33(wrapc(c, period), seed) * 2.0 - 1.0 + 1e-4); }

fn perlin(p: vec3f, period: i32, seed: u32) -> f32 {
    let i = vec3i(floor(p));
    let f = fract(p);
    let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
    var v: array<f32, 8>;
    for (var k = 0; k < 8; k++) {
        let o = vec3i(k & 1, (k >> 1) & 1, (k >> 2) & 1);
        v[k] = dot(gradAt(i + o, period, seed), f - vec3f(o));
    }
    let x0 = mix(v[0], v[1], u.x); let x1 = mix(v[2], v[3], u.x);
    let x2 = mix(v[4], v[5], u.x); let x3 = mix(v[6], v[7], u.x);
    return mix(mix(x0, x1, u.y), mix(x2, x3, u.y), u.z);
}

fn worleyFbm(p: vec3f, freq: i32, seed: u32) -> f32 {
    return worley(p * f32(freq), freq, seed) * 0.625 + worley(p * f32(freq * 2), freq * 2, seed + 1u) * 0.25 + worley(p * f32(freq * 4), freq * 4, seed + 2u) * 0.125;
}

@compute @workgroup_size(4, 4, 4)
fn genShape(@builtin(global_invocation_id) gid: vec3u) {
    if (any(gid >= vec3u(${NOISE_SHAPE}u))) { return; }
    let p = (vec3f(gid) + 0.5) / ${NOISE_SHAPE}.0;
    var pf = 0.0; var amp = 1.0; var norm = 0.0; var freq = 4;
    for (var o = 0u; o < 5u; o++) { pf += perlin(p * f32(freq), freq, 11u + o) * amp; norm += amp; amp *= 0.5; freq *= 2; }
    pf = clamp(pf / norm * 1.3 + 0.5, 0.0, 1.0);
    let w = worleyFbm(p, 4, 30u);
    let pw = clamp(w + pf * (1.0 - w) - (1.0 - pf) * 0.35, 0.0, 1.0);     // Perlin-Worley
    textureStore(shapeOut, gid, vec4f(pw, worleyFbm(p, 4, 40u), worleyFbm(p, 8, 50u), worleyFbm(p, 16, 60u)));
}

@compute @workgroup_size(4, 4, 4)
fn genDetail(@builtin(global_invocation_id) gid: vec3u) {
    if (any(gid >= vec3u(${NOISE_DETAIL}u))) { return; }
    let p = (vec3f(gid) + 0.5) / ${NOISE_DETAIL}.0;
    textureStore(detailOut, gid, vec4f(worleyFbm(p, 2, 70u), worleyFbm(p, 4, 80u), worleyFbm(p, 8, 90u), 1.0));
}
`;

// ------------------------------------------------------------------------------------- WGSL weather maps
// weather map: layer coverage from large-scale noise advected by the wind, plus every storm cell
const WGSL_WEATHER = /* wgsl */`
// the genus layers' precipitation scale (x) and cover scale (y) at xz: the state's (F.rain.z, 1), or along the bus route
// in mixed rain the zones' (RainZones): a Gaussian-weighted mean of the route points near xz, faded in by their summed
// weight. A clear stretch (cover 0) opens the decks: a flat-topped hole around each of its points, F.zoneInfo.w along
// the route (short of the next stretch's rain) and CLEAR_WIDE times that across it, so the sky over it is open.
fn zoneAt(xz: vec2f) -> vec2f {
    let n = u32(F.zoneInfo.x);
