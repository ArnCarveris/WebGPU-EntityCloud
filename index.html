    // a strip on the ground from a to b ([x, z]), half width hw, lifted a little above the terrain
    strip(a, b, hw, col, mat = 0, lift = 0.12) {
        const L = Math.hypot(b[0] - a[0], b[1] - a[1]), u = [(b[0] - a[0]) / L, (b[1] - a[1]) / L], side = [-u[1], u[0]];
        const n = Math.max(1, Math.ceil(L / 6)), edge = (t, o) => {
            const x = a[0] + u[0] * L * t + side[0] * o, z = a[1] + u[1] * L * t + side[1] * o;
            return [x, this.ground(x, z) + lift, z];
        };
        for (let k = 0; k < n; k++) this.quad(edge(k / n, -hw), edge(k / n, hw), edge((k + 1) / n, hw), edge((k + 1) / n, -hw), col, mat);
    }

    // a water surface along a centre line (points [x, z, half width across `side`]), level with its banks
    water(line, side) {
        const row = c => {
            const hw = c[2];
            const e0 = [c[0] - side[0] * hw, c[1] - side[1] * hw], e1 = [c[0] + side[0] * hw, c[1] + side[1] * hw];
            const y = Math.max(this.ground(...e0), this.ground(...e1), this.ground(...c)) + 0.1;
            return [[e0[0], y, e0[1]], [e1[0], y, e1[1]]];
        };
        for (let k = 0; k + 1 < line.length; k++) {
            const a = row(line[k]), b = row(line[k + 1]);
            this.quad(a[0], a[1], b[1], b[0], [0, 0, 0], 6);
        }
    }

    // a road: asphalt with a dashed centre line
    road(a, b, hw) {
        this.strip(a, b, hw, STRUCT_COLORS.asphalt, 3);
        const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
        for (let s = 3; s + 3 < L; s += 9) {
            const t0 = s / L, t1 = (s + 3) / L, p = t => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
            this.strip(p(t0), p(t1), 0.08, STRUCT_COLORS.paint, 0, 0.14);
        }
    }

    // a house (Village): a building of the `house` archetype (o.type) with a gable roof (ridge along local x, or across
    // with `across`), one or two storeys by its wall height, its door on the front (local -z), maybe a chimney
    house(f, w, dp, o) {
        const storeys = o.wallH > 5 ? 2 : 1;
        return this.building(f, {
            type: o.type || 'house', w, d: dp, storeys, storeyHeight: o.wallH / storeys, color: o.wall, seed: o.seed,
            roof: { kind: 'gable', pitch: o.pitch, eave: o.eave, across: o.across, chimney: o.chimney, color: o.roof }, doors: [{ face: '-z', at: o.door }],
        });
    }

    // A building of archetype spec.type (BUILDING_TYPES, the scenario's `buildings`), centred on frame f. spec: w, d (m
    // along local x, z), storeys, color (walls), roof { kind: gable (pitch, eave, across, chimney) | flat (overhang,
    // thick, drip), color }, doors [{ face, at (m along it), width, height }] (faces -z (the front), +z, -x, +x; default
    // one at the middle of the front), windows (the faces that have them; default all), floor / base (m: the floor and the
    // bottom of the plinth, for a building on something else than the ground), seed, and any archetype key to override.
    // Builds, all from that data:
    //   outside   the walls' outer faces with real openings and their reveals, plinth, roof
    //   interior  (drawn near it, Renderer) the walls' inner faces, floors and ceilings, stairs between the storeys
    //             (switchbacks along a wall, the slabs open above them, balustrades), furniture (FURNITURE), lamps
    //   glass     a pane in each window (see-through near it, fsWindow) and an opaque one for far off (fsPane)
    //   doors     leaves that swing into the room (E, App), and the solids to walk on: walls with door openings,
    //             floors, steps, furniture, a door's leaf while it is shut
    //   shader boxes  the shell enclosed (shelter: no rain or snow inside, whatever the wind) and the roof
    // and its GPU record (WGSL_BUILDING). Returns { id, floor, top }
    building(f, spec) {
        const C = STRUCT_COLORS, A = this.types[spec.type || 'house'] || this.types.house;
        const T = { ...A, ...spec, window: { ...A.window, ...spec.window }, door: { ...A.door, ...spec.door } };
        const id = this.buildings.length, M = mat => mat + id * BLD_ID, rnd = mulberry32(T.seed ?? id * 7919 + 13);
        const hx = T.w / 2, hz = T.d / 2, t = T.wall, H = T.storeyHeight, n = Math.max(1, Math.round(T.storeys ?? 1)), W = T.window;
        const g = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sz]) => this.ground(...f.xz(sx * hx, sz * hz)));
        const gLo = T.base ?? Math.min(...g) - 1, floor = T.floor ?? Math.max(...g) + T.plinth, top = floor + n * H;
        const wallCol = T.color || C.walls[0], iv0 = this.iv.length / STRUCT_FLOATS;
        // the faces: o(u, d) is local [x, z] at u along the face and d in from its outer side; U, D those directions
        const FACES = {
            '-z': { len: 2 * hx, o: (u, d) => [u, -hz + d], U: [1, 0], D: [0, 1], bit: 1 },
            '+z': { len: 2 * hx, o: (u, d) => [-u, hz - d], U: [-1, 0], D: [0, -1], bit: 2 },
            '-x': { len: 2 * hz, o: (u, d) => [-hx + d, -u], U: [0, -1], D: [1, 0], bit: 4 },
            '+x': { len: 2 * hz, o: (u, d) => [hx - d, u], U: [0, 1], D: [-1, 0], bit: 8 },
        };
        const OPPOSITE = { '-z': '+z', '+z': '-z', '-x': '+x', '+x': '-x' };
        // in face coordinates: a box centred at u, d with half sizes along and in ([local x, z, half x, half z]); a rectangle
        // [x0, x1, z0, z1]; a local direction in the world; rectangles that overlap
        const fbox = (fc, u, d, hu, hd) => { const [x, z] = fc.o(u, d); return fc.U[0] ? [x, z, hu, hd] : [x, z, hd, hu]; };
        const frect = (fc, u0, u1, d0, d1) => { const a = fc.o(u0, d0), b = fc.o(u1, d1); return [Math.min(a[0], b[0]), Math.max(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[1], b[1])]; };
        const wdir = ([x, z]) => [x * f.cs - z * f.sn, x * f.sn + z * f.cs];
        const overlaps = (a, b) => a[0] < b[1] && a[1] > b[0] && a[2] < b[3] && a[3] > b[2];

        // openings: the doors, then windows on every storey of the faces that have them (spread evenly, clear of the
        // corners and the doors: the same layout inWindow in WGSL assumes)
        const doors = (T.doors || [{ face: '-z', at: 0 }]).map(d => {
            const w = d.width ?? T.door.width, lim = FACES[d.face].len / 2 - t - 0.2 - w / 2;
            return { face: d.face, w, h: Math.min(d.height ?? T.door.height, H - 0.3), at: clamp(d.at ?? 0, -lim, lim) };
        });
        const holes = {};
        let faceMask = 0;
        for (const [name, fc] of Object.entries(FACES)) {
            const hs = holes[name] = doors.filter(d => d.face === name).map(d => [d.at - d.w / 2, d.at + d.w / 2, floor, floor + d.h, 'door']);
            const usable = fc.len - 2 * (t + 0.2), nw = Math.max(1, Math.floor(usable / W.pitch)), cell = usable / nw;
            if ((T.windows && !T.windows.includes(name)) || usable < W.width) continue;
            faceMask |= fc.bit;
            for (let s = 0; s < n; s++) for (let i = 0; i < nw; i++) {
                const u = -usable / 2 + (i + 0.5) * cell, y0 = floor + s * H + W.sill;
                if (s === 0 && doors.some(d => d.face === name && Math.abs(u - d.at) < (d.w + W.width) / 2 + 0.25)) continue;
                hs.push([u - W.width / 2, u + W.width / 2, y0, y0 + W.height, 'window']);
            }
        }

        // the plinth, and the walls: outer faces with their openings and the reveals through the wall outside, the inner
        // faces in the interior, glass at mid-wall in the windows (its normal outward), a solid between the doors
        if (floor - gLo > 0.01) this.box(f, 0, 0, hx + 0.08, hz + 0.08, gLo, floor, C.plinth);
        for (const [name, fc] of Object.entries(FACES)) {
            const hs = holes[name], half = fc.len / 2, out = wdir([-fc.D[0], -fc.D[1]]), nOut = [out[0], 0, out[1]];
            const P = (u, y, d) => { const [x, z] = fc.o(u, d); return f.at(x, y, z); };
            const face = (rects, d, col, mat) => { for (const [u0, u1, y0, y1] of rects) this.quad(P(u0, y0, d), P(u1, y0, d), P(u1, y1, d), P(u0, y1, d), col, mat); };
            this.cur = this.v;
            face(rectMinusHoles(-half, half, floor, top, hs), 0, wallCol, 0);
            this.quad(P(-half, top, 0), P(half, top, 0), P(half, top, t), P(-half, top, t), wallCol, 0);
            for (const [u0, u1, y0, y1, kind] of hs) {
                const rv = (a, b) => this.quad(P(a[0], a[1], 0), P(b[0], b[1], 0), P(b[0], b[1], t), P(a[0], a[1], t), wallCol, 0);
                rv([u0, y0], [u0, y1]);
                rv([u1, y0], [u1, y1]);
                rv([u0, y1], [u1, y1]);
                if (kind !== 'window') continue;
                rv([u0, y0], [u1, y0]);
                for (const to of [this.glass, this.panes]) {
                    this.cur = to;
                    this.quadN(P(u0, y0, t / 2), P(u1, y0, t / 2), P(u1, y1, t / 2), P(u0, y1, t / 2), nOut, C.window, M(5));
                }
                this.cur = this.v;
            }
            this.cur = this.iv;
            face(rectMinusHoles(-half + t, half - t, floor, top, hs), t, T.inner, M(0));
            this.cur = this.v;
            let a = -half;
            const wall = (u0, u1) => { if (u1 - u0 > 0.01) this.solid(f, ...fbox(fc, (u0 + u1) / 2, t / 2, (u1 - u0) / 2, t / 2), floor, top); };
            for (const h of hs.filter(h => h[4] === 'door').sort((p, q) => p[0] - q[0])) { wall(a, h[0]); a = h[1]; }
            wall(a, half);
        }

        // stairs: a switchback of straight flights along the first wall long enough (the one opposite the front door
        // first), flight s from storey s to s + 1 in lane s % 2 (even ones climb along the wall, odd ones back), a landing
        // at both ends. The slab above each flight is open over it
        const lo = [-hx + t, -hz + t], hi = [hx - t, hz - t], flights = [], reserved = [];
        if (n > 1 && T.stairs) {
            const sw = T.stairs.width, steps = Math.ceil(H / 0.19), rise = H / steps, landing = 1.0, lanes = n > 2 ? 2 : 1;
            const first = doors[0]?.face ?? '-z', order = [OPPOSITE[first], ...Object.keys(FACES).filter(k => k !== first && k !== OPPOSITE[first]), first];
            for (const name of order) {
                const fc = FACES[name], run = Math.min(0.3, (fc.len - 2 * t - 2 * landing) / steps);
                const across = (fc.U[0] ? 2 * hz : 2 * hx) - 2 * t;
                if (run < 0.22 || across < lanes * sw + 1.5) continue;
                const a0 = -steps * run / 2, a1 = steps * run / 2;
                this.cur = this.iv;
                for (let s = 0; s + 1 < n; s++) {
                    const lane = s % 2, d0 = t + lane * sw, up = lane === 0, y = floor + s * H;
                    for (let k = 0; k < steps; k++) {
                        const u0 = up ? a0 + k * run : a1 - (k + 1) * run;
                        this.box(f, ...fbox(fc, u0 + run / 2, d0 + sw / 2, run / 2, sw / 2), y, y + (k + 1) * rise, T.floorColor, M(0));
                    }
                    flights.push({ s, fc, up, d0, sw, a0, a1, hole: frect(fc, up ? a0 - 0.25 : a0, up ? a1 : a1 + 0.25, d0, d0 + sw) });
                }
                reserved.push(frect(fc, a0 - landing, a1 + landing, t, t + lanes * sw + 0.3));
                break;
            }
        }
        // floors and ceilings: the ground floor, a slab per storey above (open over the flight below it, with a balustrade
        // along the opening's open sides), the top storey's ceiling
        this.cur = this.iv;
        const flat = (rects, y, col, mat) => { for (const [x0, x1, z0, z1] of rects) this.quad(f.at(x0, y, z0), f.at(x1, y, z0), f.at(x1, y, z1), f.at(x0, y, z1), col, mat); };
        flat([[lo[0], hi[0], lo[1], hi[1]]], floor + 0.005, T.floorColor, M(0));
        for (let s = 1; s < n; s++) {
            const y = floor + s * H, below = flights.filter(fl => fl.s === s - 1), pieces = rectMinusHoles(lo[0], hi[0], lo[1], hi[1], below.map(fl => fl.hole));
            flat(pieces, y, T.floorColor, M(0));
            flat(pieces, y - T.slab, T.ceiling, M(0));
            for (const [x0, x1, z0, z1] of pieces) this.solid(f, (x0 + x1) / 2, (z0 + z1) / 2, (x1 - x0) / 2, (z1 - z0) / 2, y - T.slab, y);
            for (const fl of below) {
                const [x0, x1, z0, z1] = fl.hole, e = (a, b) => this.quad(f.at(a[0], y - T.slab, a[1]), f.at(b[0], y - T.slab, b[1]), f.at(b[0], y, b[1]), f.at(a[0], y, a[1]), T.ceiling, M(0));
                e([x0, z0], [x1, z0]); e([x1, z0], [x1, z1]); e([x1, z1], [x0, z1]); e([x0, z1], [x0, z0]);
                const { fc, up, d0, sw, a0, a1 } = fl, rail = b => this.box(f, b[0], b[1], b[2], b[3], y, y + 1.0, C.wood, M(0));
                rail(fbox(fc, (a0 + a1) / 2, d0 + sw + 0.03, (a1 - a0) / 2 + 0.25, 0.03));
                rail(fbox(fc, up ? a0 - 0.28 : a1 + 0.28, d0 + sw / 2, 0.03, sw / 2));
            }
        }
        flat([[lo[0], hi[0], lo[1], hi[1]]], top - 0.01, T.ceiling, M(0));
        // lamps under each ceiling, about every 4 m (lit or not per storey, storeyLit in WGSL)
        const nlx = Math.max(1, Math.round((hi[0] - lo[0]) / 4)), nlz = Math.max(1, Math.round((hi[1] - lo[1]) / 4));
        for (let s = 0; s < n; s++) {
            const yc = s + 1 < n ? floor + (s + 1) * H - T.slab : top - 0.01;
            for (let i = 0; i < nlx; i++) for (let j = 0; j < nlz; j++) {
                const x = lerp(lo[0], hi[0], (i + 0.5) / nlx), z = lerp(lo[1], hi[1], (j + 0.5) / nlz);
                if (flights.some(fl => fl.s === s && overlaps([x - 0.3, x + 0.3, z - 0.3, z + 0.3], fl.hole))) continue;
                this.prism(f, x, z, 0.28, 0.28, yc - 0.05, yc - 0.005, [1.0, 0.95, 0.86], M(7));
            }
        }
        // furniture along the walls and out in the room, clear of the stairs, the landings and the doors' swing
        const plan = FURNITURE[T.furnish] || [];
        const swing = doors.map(d => frect(FACES[d.face], d.at - d.w / 2 - 0.25, d.at + d.w / 2 + 0.25, 0, t + d.w + 0.4));
        const names = Object.keys(FACES);
        for (let s = 0; s < n && plan.length; s++) {
            const p = plan[Math.min(s, plan.length - 1)], y = floor + s * H, taken = [...reserved, ...(s === 0 ? swing : [])];
            const fits = rc => rc[0] >= lo[0] - 1e-3 && rc[1] <= hi[0] + 1e-3 && rc[2] >= lo[1] - 1e-3 && rc[3] <= hi[1] + 1e-3 && !taken.some(q => overlaps(rc, q));
            const place = (name, free) => {
                const it = FURNITURE_ITEMS[name];
                if (!it) return;
                const f0 = Math.floor(rnd() * 4);
                for (let k = 0; k < 4; k++) {
                    const fc = FACES[names[(f0 + k) % 4]], half = fc.len / 2 - t - it.w / 2 - 0.1;
                    if (half < 0) continue;
                    const deep = (fc.U[0] ? 2 * hz : 2 * hx) - 2 * t;
                    for (let tries = 0; tries < 10; tries++) {
                        const u = (rnd() * 2 - 1) * half, v = free ? t + 1.0 + rnd() * Math.max(0, deep - it.d - 2.0) : t + 0.02;
                        const pad = free ? 0.6 : 0.15;

                        taken.push(frect(fc, u - it.w / 2 - 0.1, u + it.w / 2 + 0.1, v - 0.1, v + it.d + 0.1));
                        for (const [u0, u1, v0, v1, y0, y1, col] of it.parts)

        // doors: a leaf hinged at one side of the opening on its inner side, swinging into the room (doorMesh); shut, it
        // is a solid across the opening, open, one along the inner wall

                this.quad(rf.at(-ex, yE, zE), rf.at(ex, yE, zE), rf.at(ex, yE - th, zE), rf.at(-ex, yE - th, zE), roofCol, 1);

        this.blocker(f, 0, 0, hx, hz, gLo, roofTop, 0, 0, gLo, T.shelter !== false);

        const stairs = flights.map(fl => { const [x, z] = fl.fc.o(fl.up ? fl.a0 - 0.6 : fl.a1 + 0.6, fl.d0 + fl.sw / 2); return { at: f.at(x, floor + fl.s * H, z), dir: wdir(fl.up ? fl.fc.U : [-fl.fc.U[0], -fl.fc.U[1]]) }; });

            record: [f.c[0], f.c[1], f.cs, f.sn, hx, hz, floor, H, n, W.sill, W.height, W.pitch, W.width, t, T.lamps ?? 0.5, faceMask] });

    }

    // a quad with its normal given (the glass: outward, which fsWindow needs)
    quadN(a, b, c, d, n, col, mat) {
        for (const p of [a, b, c, a, c, d]) this.cur.push(p[0], p[1], p[2], n[0], n[1], n[2], col[0], col[1], col[2], mat);
    }

    // the doors' leaves as they stand (rebuilt whenever one moves, App): each turned about its hinge into the room by up
    // to 95 degrees, with a handle on both sides
    doorMesh() {

        for (const d of this.doors) {
            const a = d.open * 95 * DEG, dir = [d.u[0] * Math.cos(a) + d.d[0] * Math.sin(a), d.u[1] * Math.cos(a) + d.d[1] * Math.sin(a)];
            const lf = new GroundFrame([d.hinge[0] + dir[0] * d.w / 2, d.hinge[1] + dir[1] * d.w / 2], Math.atan2(dir[1], dir[0]));
            this.prism(lf, 0, 0, d.w / 2, d.lt / 2, d.y, d.y + d.h, d.col, d.mat);

        }

    }

    // the doors swing toward where they were sent; true if one moved (its leaf's mesh, and its solids, change)
    updateDoors(dt) {
        let moved = false;
        for (const d of this.doors) {
            if (d.open === d.target) continue;
            d.open = d.target > d.open ? Math.min(d.target, d.open + dt * DOOR_SPEED) : Math.max(d.target, d.open - dt * DOOR_SPEED);
            d.shut.off = d.open > 0.05;
            d.openSolid.off = d.open < 0.95;
            moved = true;
        }
        return moved;
    }

    // the door the eye looks at, within DOOR_REACH (its opening, mid-height), or null
    doorAt(eye, fwd) {
        let best = null, score = 0;

            if (c > need && c - need > score) { score = c - need; best = d; }
        }
        return best;
    }

    // bus shelter: a roof on four posts, glass back and side panels, a bench, a timetable and the stop sign by the kerb.
    // Local -z faces the road. Returns the floor height
    busStop(f) {
        const C = STRUCT_COLORS;
        const g = [[-2.6, -1.5], [2.6, -1.5], [2.6, 1.5], [-2.6, 1.5]].map(([x, z]) => this.ground(...f.xz(x, z)));
        const floor = Math.max(...g) + 0.12, yr = floor + 2.55;
        this.box(f, 0, -0.2, 2.6, 1.5, Math.min(...g) - 0.4, floor, C.concrete);
        for (const sx of [-2.05, 2.05]) for (const sz of [-0.85, 0.85]) this.box(f, sx, sz, 0.05, 0.05, floor, yr, C.metal, 4);
        this.box(f, 0, 0, 2.35, 1.2, yr, yr + 0.14, C.metal, 4);
        this.box(f, 0, 0.85, 2.0, 0.015, floor + 0.12, yr - 0.08, C.glass, 2);
        for (const sx of [-2.05, 2.05]) this.box(f, sx, 0.3, 0.015, 0.55, floor + 0.12, yr - 0.08, C.glass, 2);
        this.box(f, 0, 0.55, 1.3, 0.18, floor + 0.42, floor + 0.47, C.wood);
        for (const sx of [-1.1, 1.1]) this.box(f, sx, 0.55, 0.04, 0.15, floor, floor + 0.42, C.metal, 4);

    // bridge from a to b ([x, z], ends on the ground): a deck `width` wide and `thick` deep that ramps up `rise` m over
    // the first and last `ramp` m and arches `arch` m more, parapets (`parapet`) or railings, on piers about
    // every `pierEvery` m. Returns the deck height at t (0 at a .. 1 at b)
    bridge(a, b, o) {

            this.sweep(pts, side, rail - 0.02, rail + 0.02, offs(0.5), offs(0.54), o.rail, 4);

            for (const sg of [-1, 1]) this.solid(pf, 0, sg * (hw - 0.1), len / 2, 0.1, mid - o.thick, mid + Math.max(...dev) + 1.0, slope);
        }

    }

    // the roof edges near `around` that rain runs off (returns how many), and the boxes nearest it into the frame uniform, their bounds, and the grid of which boxes can shade each cell,
    // for this sun (sunDir) and wind ([x, z]; snow, which blows further, when the freezing level is near the boxes)
    write(F, around, sunDir, wind, freezing, fall = 9.5) {
        const drips = this.writeDrips(F, around);
        // the boxes within BLOCK_RANGE (the village and the bus station lie kilometres apart: one grid over both would
        // be too coarse to help), nearest first when there are too many
        const d = b => Math.hypot(b.x - around[0], b.z - around[2]);
        let list = this.blockers.filter(b => d(b) < BLOCK_RANGE + Math.hypot(b.hx, b.hz));
        if (list.length > MAX_BLOCKERS) list = list.sort((p, q) => d(p) - d(q)).slice(0, MAX_BLOCKERS);
        if (!list.length) { F.set('blocks', [0, 0, 0, 0]); this.listed = null; return drips; }
        // moving boxes (the bus, `dyn`) are rewritten every frame
        if (!this.listed || list.length !== this.listed.length || list.some((b, i) => b !== this.listed[i] || b.dyn)) {
            this.listed = list;
            this.data ??= new Float32Array(MAX_BLOCKERS * 12);
            this.data.fill(0);
            list.forEach((b, i) => this.data.set([b.x, b.z, b.hx, b.hz, b.cs, b.sn, b.y0, b.y1, b.ao, b.slope, b.dyn ? 1 : 0, b.enclosed ? 1 : 0], i * 12));

            this.hi = Math.max(...list.map(b => b.y1 + Math.abs(b.slope) * b.hx));
        }

        // from the ground under it climbs to its top: a capsule each way from its centre, as wide as the box
        const snow = freezing < this.hi + 250, wl = Math.hypot(...wind);

        const sunSlant = sunUp ? Math.min(sunL / Math.max(sunDir[1], 0.05), 20) : 0, rainSlant = wl * 0.8 / fall;
        const caps = list.map(b => {
            const h = b.y1 + Math.abs(b.slope) * b.hx - b.base, r = Math.hypot(b.hx, b.hz) + 1;
            const ls = Math.min(h * sunSlant, 400), lr = Math.min(h * rainSlant, 400);
            const sunEnd = sunUp ? [b.x - sunDir[0] / sunL * ls, b.z - sunDir[2] / sunL * ls] : [b.x, b.z];
            const rainEnd = wl > 1e-4 ? [b.x + wind[0] / wl * lr, b.z + wind[1] / wl * lr] : [b.x, b.z];
            return { r, segs: [sunEnd, rainEnd], x0: Math.min(b.x, sunEnd[0], rainEnd[0]) - r, x1: Math.max(b.x, sunEnd[0], rainEnd[0]) + r,
                z0: Math.min(b.z, sunEnd[1], rainEnd[1]) - r, z1: Math.max(b.z, sunEnd[1], rainEnd[1]) + r };
        });
        const x0 = Math.min(...caps.map(c => c.x0)), x1 = Math.max(...caps.map(c => c.x1));
        const z0 = Math.min(...caps.map(c => c.z0)), z1 = Math.max(...caps.map(c => c.z1));

            const dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz, t = l2 > 0 ? clamp(((px - ax) * dx + (pz - az) * dz) / l2, 0, 1) : 0;
            return Math.hypot(ax + dx * t - px, az + dz * t - pz);

        list.forEach((b, k) => {
            const c = caps[k];
            const i0 = clamp(Math.floor((c.x0 - x0) / cw), 0, G - 1), i1 = clamp(Math.floor((c.x1 - x0) / cw), 0, G - 1);
            const j0 = clamp(Math.floor((c.z0 - z0) / ch), 0, G - 1), j1 = clamp(Math.floor((c.z1 - z0) / ch), 0, G - 1);
            for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {

            }
        });

        F.set('blocks', [list.length, this.lo, this.hi, 0]);
        F.set('blockBox', [x0, z0, x1, z1]);
        F.setBits('blockGrid', grid);
        return drips;
    }

    // the roof edges nearest `around` (within 150 m) that rain runs off, with each one's share of the drip particles
    writeDrips(F, around) {
        const d = e => Math.max(Math.abs((around[0] - e.x) * e.cs + (around[2] - e.z) * e.sn) - e.hx, 0)
            + Math.max(Math.abs(-(around[0] - e.x) * e.sn + (around[2] - e.z) * e.cs) - e.hz, 0) + Math.abs(around[1] - e.y) * 0.5;
        const list = this.drips.filter(e => d(e) < 150).sort((p, q) => d(p) - d(q)).slice(0, MAX_DRIPS);
        // nearer edges get more drops, but a long edge gets more than a short one
        const wts = list.map(e => e.per / (1 + d(e) / 25)), sum = wts.reduce((a, b) => a + b, 0);
        let acc = 0;

        data.fill(0);
        list.forEach((e, i) => {
            acc += wts[i] / sum;
            // the drops land within 30 m of the camera along each side: thin them to about DRIP_DENSITY per metre there
            const seen = Math.min(60, 2 * e.hx) * 2 + (e.alongX ? 0 : Math.min(60, 2 * e.hz) * 2);
            const keep = Math.min(1, DRIP_DENSITY * seen / (DRIP_PARTICLES * wts[i] / sum));
            data.set([e.x, e.z, e.hx, e.hz, e.cs, e.sn, e.y, Math.max(e.drop, 0.5), acc, e.alongX ? 1 : 0, keep, 0], i * 12);
        });
        F.set('drips', [list.length, 0, 0, 0]);
        F.set('dripEdges', data);
        return list.length;
    }

    // as blockerRain in WGSL: p is inside the enclosed box b
    static holds(b, p) {
        if (!b.enclosed) return false;
        const rx = p[0] - b.x, rz = p[2] - b.z, lx = rx * b.cs + rz * b.sn, lz = -rx * b.sn + rz * b.cs, y = p[1] - b.slope * lx;
        return Math.abs(lx) < b.hx && Math.abs(lz) < b.hz && y > b.y0 && y < b.y1;
    }

    // blockerHit in WGSL: the ray from o along d enters box b
    static hit(b, o, d) {
        const rx = o[0] - b.x, rz = o[2] - b.z, lx = rx * b.cs + rz * b.sn, dx = d[0] * b.cs + d[2] * b.sn;
        const slabs = [[lx, dx, -b.hx, b.hx], [o[1] - b.slope * lx, d[1] - b.slope * dx, b.y0, b.y1],
            [-rx * b.sn + rz * b.cs, -d[0] * b.sn + d[2] * b.cs, -b.hz, b.hz]];
        let tn = -Infinity, tf = Infinity;
        for (const [p, v, a, c] of slabs) {

            const ta = (a - p) / v, tc = (c - p) / v;
            tn = Math.max(tn, Math.min(ta, tc));
            tf = Math.min(tf, Math.max(ta, tc));
        }
        return tn > 0.02 && tn <= tf;
    }

    // a structure keeps off what falls on p along -d (d: back up against the fall)
    shelters(p, d) { return this.blockers.some(b => Structures.holds(b, p) || Structures.hit(b, p, d)); }

    // the building p is inside (its interior), or null
    inside(p) {
        return this.buildings.find(b => {
            const rx = p[0] - b.f.c[0], rz = p[2] - b.f.c[1], lx = rx * b.f.cs + rz * b.f.sn, lz = -rx * b.f.sn + rz * b.f.cs;
            return Math.abs(lx) < b.hx - b.t && Math.abs(lz) < b.hz - b.t && p[1] > b.floor - 0.2 && p[1] < b.top;
        }) || null;
    }
}

// A small village on a road, laid out from a seed on the terrain as drawn. The road runs across the river `river` (an
// entity id; or at `road` degrees from +x without one) on a stone bridge; a side street branches off on the longer
// bank. Houses (`houses` at most) line both, a bus shelter stands by the main road near the junction, and a wooden
// footbridge crosses the river `footbridge` m along it (in its path's direction; negative: the other way; 0: none).
// Viewpoints for scenario views (`spot`): "bus stop", "bridges", "under the bridge", "overview".
class Village extends Entity {
    // the river through the village gets a deeper channel (`channel` m), and the village draws its water itself at the
    // river's true width: the land-use map is far coarser than a river, so it is cleared here
    stamp(f) {
        const d = this.def, river = d.river && this.world.get(d.river);
        if (!river) return;
        const [cx, cz] = d.pos, R = d.radius ?? 380, halfW = (river.def.width || 60) / 2, depth = d.channel ?? 3, reach = R * 3;
        f.each(cx - reach, cz - reach, cx + reach, cz + reach, (idx, x, z) => {
            const r = Math.hypot(x - cx, z - cz), k = 1 - smoothstep(R * 1.1, R * 1.5, r);
            if (k > 0) f.h[idx] -= depth * k * (1 - smoothstep(halfW * 0.5, halfW + 160, river.distance(x, z)));
            f.land[idx * 3 + 2] *= smoothstep(R * 2.2, reach, r);     // where the village's water tapers off, the map's returns
        });
    }

    get anchor() { const p = this.def.pos; return [p[0], this.world.field.sample(p[0], p[1]) + (this.def.labelHeight ?? 110), p[1]]; }
    get focus() { const p = this.def.pos; return [p[0], this.world.field.sample(p[0], p[1]), p[1]]; }

    build(S) {
        const d = this.def, f = this.world.field, rnd = mulberry32(d.seed ?? 9), r = (a, b) => a + (b - a) * rnd();
        const [cx, cz] = d.pos, R = d.radius ?? 380, roadHalf = 3.5, C = STRUCT_COLORS;
        const river = d.river && this.world.get(d.river), halfW = river ? (river.def.width || 60) / 2 : 0;
        const water = (x, z) => Math.max(f.landAt(x, z, 2), river && river.distance(x, z) < halfW + 6 ? 1 : 0);
        // the road crosses the river where it is nearest to the village, square to it
        let along = [Math.cos((d.road ?? 0) * DEG), Math.sin((d.road ?? 0) * DEG)];
        let dir = [-along[1], along[0]];
        if (river) {
            const pts = river.def.path;
            let best = Infinity;
            for (let k = 0; k + 1 < pts.length; k++) {
                const [ax, az] = pts[k], [bx, bz] = pts[k + 1], l = Math.hypot(bx - ax, bz - az);
                const t = clamp(((cx - ax) * (bx - ax) + (cz - az) * (bz - az)) / (l * l), 0, 1);
                const dd = Math.hypot(ax + (bx - ax) * t - cx, az + (bz - az) * t - cz);
                if (dd < best) { best = dd; along = [(bx - ax) / l, (bz - az) / l]; }
            }
            dir = [-along[1], along[0]];
            if (d.footbridge && d.footbridge < 0) along = [-along[0], -along[1]];
        }
        const P = s => [cx + dir[0] * s, cz + dir[1] * s];
        // the stretch of a line that crosses water, nearest its middle: [s0, s1] or null
        const wetSpan = (at, a, b) => {
            let cur = null, best = null;
            for (let s = a; s <= b; s += 2) {
                if (water(...at(s)) > 0.15) { if (!cur) cur = [s, s]; cur[1] = s; }
                else if (cur) { if (!best || Math.abs(cur[0] + cur[1]) < Math.abs(best[0] + best[1])) best = cur; cur = null; }
            }
            if (cur && (!best || Math.abs(cur[0] + cur[1]) < Math.abs(best[0] + best[1]))) best = cur;
            return best;
        };
        const taken = [];            // [x, z, radius] of what stands already, and the roads as [a, b, half width]
        const roads = [];
        const segDist = ([a, b], x, z) => {
            const dx = b[0] - a[0], dz = b[1] - a[1], t = clamp(((x - a[0]) * dx + (z - a[1]) * dz) / (dx * dx + dz * dz), 0, 1);
            return Math.hypot(a[0] + dx * t - x, a[1] + dz * t - z);
        };
        const free = (x, z, rad) => taken.every(([ox, oz, or]) => Math.hypot(x - ox, z - oz) > rad + or + 1.5)
            && roads.every(rd => segDist(rd, x, z) > rad + rd[2] + 1)
            && [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].every(([a, b]) => water(x + a * rad, z + b * rad) < 0.03);
        const addRoad = (a, b, hw) => { S.road(a, b, hw); roads.push([a, b, hw]); };

        // main road, with the bridge where it meets the river
        const span = river ? wetSpan(P, -R, R) : null;
        let bA = R, bB = R, deck = null;
        this.spots = {};
        if (span) {
            bA = span[0] - 26; bB = span[1] + 26;
            const top = S.bridge(P(bA), P(bB), { width: 8, thick: 1.1, rise: 4, ramp: 22, arch: 1.5, parapet: true, surface: true, deck: C.stone, pier: C.stone, pierEvery: 24, pierHalf: 1.2 });
            deck = { a: bA, b: bB, top };
            roads.push([P(bA), P(bB), 5]);
            // under the deck on the bank, looking along the river past the dry ground below it
            for (let t = 0.02; t < 0.5; t += 0.005) {
                const c = P(lerp(bA, bB, t));
                if (water(...c)) break;
                const g = f.surface(...c);
                if (top(t) - 1.1 - g < 2.5) continue;
                const e = [c[0] - along[0] * 1.5, c[1] - along[1] * 1.5];
                this.spots['under the bridge'] = { pos: [e[0], g + 1.6, e[1]], look: [c[0] + along[0] * 60 + dir[0] * 25, g + 1.2, c[1] + along[1] * 60 + dir[1] * 25] };
                break;
            }
            if (bA > -R) addRoad(P(-R), P(bA), roadHalf);
            if (bB < R) addRoad(P(bB), P(R), roadHalf);
        } else addRoad(P(-R), P(R), roadHalf);

        // side street on the longer bank, along the river
        const sJ = span ? (R - bB > bA + R ? bB + (R - bB) * 0.42 : bA - (bA + R) * 0.42) : R * 0.2;
        const J = P(sJ), Q = u => [J[0] + along[0] * u, J[1] + along[1] * u];
        const ls = R * 0.6;
        const sideWet = wetSpan(u => Q(u), -ls, ls);
        let u0 = -ls, u1 = ls;
        if (sideWet) { if (sideWet[1] < 0) u0 = sideWet[1] + 20; else u1 = sideWet[0] - 20; }
        addRoad(Q(u0), Q(u1), 2.8);

        // bus stop by the main road just past the junction, its back to the west (where the rain comes from in most states)
        const sB = sJ + (Math.abs(sJ + 22) < R - 20 && (sJ + 22 < bA - 10 || sJ + 22 > bB + 10) ? 22 : -22);
        const sideB = (d.busStopSide ?? (along[0] < 0 ? 1 : -1));
        const out = [along[0] * sideB, along[1] * sideB];
        const stopC = [P(sB)[0] + out[0] * (roadHalf + 1.8), P(sB)[1] + out[1] * (roadHalf + 1.8)];
        const stop = GroundFrame.facing(stopC, out);
        const floor = S.busStop(stop);
        const across = [P(sB)[0] - out[0] * (roadHalf + 12), P(sB)[1] - out[1] * (roadHalf + 12)];
        taken.push([...stopC, 4], [...across, 10]);      // and an open lot across the road, so the shelter looks out on the street
        const toward = sB > sJ ? -1 : 1, aim = P(sB + toward * 35);       // out across the street, toward the junction
        this.spots['bus stop'] = { pos: stop.at(0.4, floor + 1.65, 0.15), look: [aim[0] - out[0] * 20, floor + 2.4, aim[1] - out[1] * 20] };
        // for a bus line (BusLine): the main road runs through c along dir (s from -R to R), the bridge's deck over [a, b]
        // (its height at t = (s - a) / (b - a)), the shelter `out` of the road at s
        this.road = { c: [cx, cz], dir, R, half: roadHalf, deck, stop: { s: sB, out } };

        // houses along both streets, facing them
        const C2 = STRUCT_COLORS;
        let built = 0;
        const maxHouses = d.houses ?? 28;
        const lineHouses = (at, from, to, side, setback, skip) => {
            for (let s = from; s < to && built < maxHouses; s += r(17, 27)) {
                if (skip(s)) continue;
                for (const sg of [-1, 1]) {
                    if (rnd() < 0.18 || built >= maxHouses) continue;
                    const w = r(7, 11), dp = r(6.5, 9), off = setback + r(4, 9) + dp / 2, c0 = at(s);
                    const c = [c0[0] + side[0] * sg * off, c0[1] + side[1] * sg * off], rad = Math.hypot(w, dp) / 2;
                    if (!free(...c, rad)) continue;
                    const hf = GroundFrame.facing(c, [side[0] * sg, side[1] * sg]);
                    S.house(hf, w, dp, { type: d.houseType,
                        wallH: rnd() < 0.3 ? r(5.4, 6) : r(2.9, 3.4), pitch: r(28, 42) * DEG, eave: r(0.4, 0.7), across: rnd() < 0.35,
                        wall: C2.walls[Math.floor(rnd() * C2.walls.length)], roof: C2.roofs[Math.floor(rnd() * C2.roofs.length)],
                        chimney: rnd() < 0.4, door: r(-w / 2 + 1.2, w / 2 - 1.2),
                    });
                    taken.push([...c, rad]);
                    built++;
                }
            }
        };
        const nearJunction = s => Math.abs(s - sJ) < 16;
        lineHouses(P, -R + 12, R - 12, along, roadHalf, s => nearJunction(s) || (s > bA - 18 && s < bB + 18));
        lineHouses(Q, u0 + 8, u1 - 8, dir, 2.8, u => Math.abs(u) < 14);

        // footbridge across the river, `footbridge` m along it from the road bridge
        if (span && d.footbridge !== 0) {
            const fb = Math.abs(d.footbridge ?? 160), m = P((span[0] + span[1]) / 2), M = [m[0] + along[0] * fb, m[1] + along[1] * fb];
            const at = s => [M[0] + dir[0] * s, M[1] + dir[1] * s], fs = wetSpan(at, -260, 260);
            if (fs) {
                const a = at(fs[0] - 8), b = at(fs[1] + 8);
                S.bridge(a, b, { width: 2.4, thick: 0.45, rise: 1.5, ramp: 7, arch: 2, deck: C.wood, rail: C.metal, pier: C.wood, pierEvery: 18, pierHalf: 0.2 });
                S.strip(at(fs[0] - 30), a, 1.1, C.gravel);
                S.strip(b, at(fs[1] + 30), 1.1, C.gravel);
            }
            const mid = (span[0] + span[1]) / 2, view = [m[0] - along[0] * 70 + dir[0] * (span[1] - mid) * 0.35, m[1] - along[1] * 70 + dir[1] * (span[1] - mid) * 0.35];
            const gy = f.sample(...view);
            this.spots.bridges = { pos: [view[0], gy + 9, view[1]], look: [M[0], gy + 3, M[1]] };
        }
        // the river's water, along its centre line through the village
        if (river) {
            const line = [];
            let prev = 0;
            for (let u = -R * 3, first = true; u <= R * 3; u += 8, first = false) {
                const o = [cx + along[0] * u, cz + along[1] * u];
                let best = Infinity, bs = prev;
                for (let s = first ? -R * 1.5 : prev - 60; s <= (first ? R * 1.5 : prev + 60); s += 2) {
                    const dd = river.distance(o[0] + dir[0] * s, o[1] + dir[1] * s);
                    if (dd < best) { best = dd; bs = s; }
                }
                prev = bs;
                line.push([o[0] + dir[0] * bs, o[1] + dir[1] * bs, halfW * (1 - smoothstep(R * 2.2, R * 3, Math.abs(u)))]);
            }
            S.water(line, dir);
        }
        const ov = [cx - dir[0] * R * 0.9 - along[0] * R * 0.6, cz - dir[1] * R * 0.9 - along[1] * R * 0.6];
        this.spots.overview = { pos: [ov[0], f.sample(...ov) + 90, ov[1]], look: [cx, f.sample(cx, cz), cz] };
    }
}

// A town's central bus station: a long cantilevered concrete canopy on one row of pillars, deep fascia, ribbed soffit and a
// glazed clerestory along its spine, over an island platform with benches, a kiosk and bay signs. Buses stand nose-in
// at the bays on one side, a drive-through lane runs along the other, and a terminal building closes one end. The ground
// is levelled under it (`level` m around `pos`). Parameters: pos, yaw (degrees; the canopy runs along it), length and
// width (m of canopy; 96 x 30), bays, buses, seed. Viewpoints (`spot`): "platform" (under the canopy), "forecourt", "overview".
class BusStation extends Entity {
    stamp(f) {
        const d = this.def, [cx, cz] = d.pos, r0 = d.level ?? 200, r1 = r0 + 300;
        let sum = 0, n = 0;
        f.each(cx - r0, cz - r0, cx + r0, cz + r0, (idx, x, z) => { if (Math.hypot(x - cx, z - cz) < r0) { sum += f.h[idx]; n++; } });
        const flat = n ? sum / n : f.sample(cx, cz);
        f.each(cx - r1, cz - r1, cx + r1, cz + r1, (idx, x, z) => {
            const k = 1 - smoothstep(r0, r1, Math.hypot(x - cx, z - cz));
            if (k > 0) f.h[idx] = lerp(f.h[idx], flat, k);
        });
    }

    get anchor() { const p = this.def.pos; return [p[0], this.world.field.sample(p[0], p[1]) + (this.def.labelHeight ?? 90), p[1]]; }
    get focus() { const p = this.def.pos; return [p[0], this.world.field.sample(p[0], p[1]), p[1]]; }

    build(S) {
        const d = this.def, C = STRUCT_COLORS, rnd = mulberry32(d.seed ?? 3), r = (a, b) => a + (b - a) * rnd();
        const f = new GroundFrame(d.pos, (d.yaw ?? 20) * DEG), L = (d.length ?? 96) / 2;
        const canopy = [0.80, 0.78, 0.72], pillar = [0.62, 0.60, 0.56], tiles = [0.56, 0.55, 0.52], red = [0.58, 0.12, 0.09];
        const at = (x, z) => S.ground(...f.xz(x, z));
        const foot = [];
        for (let x = -L - 34; x <= L + 16; x += 8) for (let z = -30; z <= 30; z += 6) foot.push(at(x, z));
        const gLo = Math.min(...foot) - 0.6, gHi = Math.max(...foot), plat = gHi + 0.18;

        // forecourt and lanes: concrete paving, asphalt lanes either side of the island platform, painted bays
        const strip = (x0, z0, x1, z1, col, mat, lift) => S.strip(f.xz(x0, (z0 + z1) / 2), f.xz(x1, (z0 + z1) / 2), (z1 - z0) / 2, col, mat, lift);
        strip(-L - 34, -30, L + 16, 30, tiles, 0, 0.12);
        strip(-L - 2, 7.5, L + 10, 25, C.asphalt, 3, 0.16);           // nose-in bays
        strip(-L - 2, -21, L + 10, -7.5, C.asphalt, 3, 0.16);         // drive-through lane
        const bays = d.bays ?? 20, bw = (2 * L - 4) / bays;
        for (let i = 0; i <= bays; i++) {
            const x = -L + 2 + i * bw;
            S.strip(f.xz(x, 8), f.xz(x, 21), 0.08, C.paint, 0, 0.18);
        }
        for (let x = -L; x < L + 8; x += 9) S.strip(f.xz(x, -14.2), f.xz(x + 4, -14.2), 0.08, C.paint, 0, 0.18);
        // island platform with kerbs
        S.box(f, 0, 0, L, 7.5, gLo, plat, tiles);
        for (const sz of [-1, 1]) S.box(f, 0, sz * 7.45, L, 0.12, gLo, plat + 0.02, C.concrete);

        // the canopy: slab, deep fascia with an upstand, ribs under the slab, a spine beam on the pillars, clerestory
        const hz = d.width ? d.width / 2 : 15, yt = plat + 6.2, yf = plat + 4.7, slab = yt - 0.4;
        S.box(f, 0, 0, L, hz, slab, yt, canopy);
        for (const sz of [-1, 1]) S.box(f, 0, sz * (hz - 0.15), L, 0.15, yf, yt + 0.2, canopy);
        for (const sx of [-1, 1]) S.box(f, sx * (L - 0.15), 0, 0.15, hz, yf, yt + 0.2, canopy);
        for (let x = -L + 4; x < L - 1; x += 4) S.box(f, x, 0, 0.18, hz - 0.3, slab - 0.75, slab, canopy);
        S.box(f, 0, 0, L - 0.3, 0.55, slab - 1.4, slab, pillar);
        S.box(f, 0, 0, L - 8, 3.5, yt, yt + 2.1, C.glass, 2);
        S.box(f, 0, 0, L - 7.4, 4.1, yt + 2.1, yt + 2.5, canopy);
        for (let x = -L + 8; x <= L - 8; x += 8) for (const sz of [-1, 1]) S.box(f, x, sz * 3.5, 0.08, 0.08, yt, yt + 2.1, C.metal, 4);
        const pillars = [];
        for (let x = -L + 6; x <= L - 5.9; x += 12) pillars.push(x);
        for (const x of pillars) S.box(f, x, 0, 0.45, 0.45, plat, slab - 1.4, pillar);
        // bay signs hanging under the fascia on the bays' side, and lights along the soffit
        for (let i = 0; i < bays; i++) {
            const x = -L + 2 + (i + 0.5) * bw;
            S.box(f, x, hz - 0.45, 0.32, 0.03, yf - 0.55, yf - 0.05, red, 4);
            S.box(f, x, hz - 0.49, 0.18, 0.012, yf - 0.47, yf - 0.13, [0.92, 0.92, 0.88]);
        }
        for (let x = -L + 2; x < L - 1; x += 4) for (const sz of [-hz * 0.75, -hz * 0.3, hz * 0.3, hz * 0.75]) S.box(f, x, sz, 0.6, 0.08, slab - 0.06, slab, [0.95, 0.93, 0.85], 2);

        // on the platform: kiosk, benches, timetables, bins
        const kx = -L * 0.3;
        S.building(new GroundFrame(f.xz(kx, 2.6), f.yaw), { type: d.kioskType || 'kiosk', w: 4.4, d: 3.2, storeys: 1, floor: plat, base: plat,

        for (let i = 0; i + 1 < pillars.length; i++) {

            if (Math.abs(x - kx) < 4) continue;
            for (const sz of [-1, 1]) {
                const z = sz * 4.6;
                S.box(f, x, z, 1.4, 0.22, plat + 0.42, plat + 0.48, C.wood);
                S.box(f, x, z + sz * 0.2, 1.4, 0.03, plat + 0.48, plat + 0.95, C.wood);
                for (const lx of [-1.2, 1.2]) S.box(f, x + lx, z, 0.04, 0.2, plat, plat + 0.42, C.metal, 4);
            }
            if (i % 2 === 0) {
                S.box(f, x + 3.5, 0, 0.6, 0.06, plat + 0.6, plat + 2.2, [0.85, 0.85, 0.82]);
                S.box(f, x + 3.5, 0, 0.66, 0.08, plat + 2.2, plat + 2.3, C.metal, 4);

        S.building(new GroundFrame(f.xz(tx, 0), f.yaw), { type: d.terminalType || 'terminal', w: 2 * thx, d: 2 * thz, storeys: 2,
            base: gLo, floor: gHi + 0.15, color: [0.74, 0.72, 0.66], doors: [{ face: '+x', at: -2.4 }, { face: '+x', at: 2.4 }], seed: 17,
            roof: { kind: 'flat', overhang: 1.6, thick: 0.45, color: canopy } });
        // a bus line from here (BusLine) comes in through a gap in the railing, stops in the drive-through lane by the
        // platform, and leaves past the east end; its road runs along the south side of the town blocks (local z = road)
        const served = (this.world.scenario.entities || []).some(e => e.type === 'bus' && e.from === this.id);
        this.frame = f;
        this.busWay = served ? { lane: -9.2, road: -80, east: L + 21, gap: -L + 20, west: -L - 80, stop: 0 } : null;
        // railing along the forecourt's open side
        const gap = x => served && Math.abs(x - this.busWay.gap) < 5;
        for (let x = -L - 33; x <= L + 15; x += 2.5) if (!gap(x)) S.box(f, x, -29.5, 0.03, 0.03, gHi + 0.12, gHi + 1.1, C.metal, 4);
        for (const [a, b] of served ? [[-L - 33, this.busWay.gap - 5], [this.busWay.gap + 5, L + 15]] : [[-L - 33, L + 15]]) {
            S.box(f, (a + b) / 2, -29.5, (b - a) / 2, 0.03, gHi + 1.05, gHi + 1.12, C.metal, 4);
            S.box(f, (a + b) / 2, -29.5, (b - a) / 2, 0.02, gHi + 0.55, gHi + 0.6, C.metal, 4);
        }

        // buses: nose-in at some bays, one in the drive-through lane; none when a bus line runs from here (they are all
        // out on it, BusLine), though the draws are the same either way, so the town looks the same
        const bus = (bf, len) => {
            const hl = len / 2, hw = 1.27;
            const col = BUS_LIVERIES[Math.floor(rnd() * BUS_LIVERIES.length)];
            if (served) return;
            const g = Math.max(...[[-hl, -hw], [hl, -hw], [hl, hw], [-hl, hw]].map(([x, z]) => S.ground(...bf.xz(x, z)))) + 0.16;
            S.box(bf, 0, 0, hl, hw, g + 0.35, g + 3.15, col, 4);
            S.box(bf, 0, 0, hl - 0.2, hw - 0.1, g + 3.15, g + 3.35, [0.82, 0.82, 0.80], 4);
            for (const sz of [-1, 1]) S.box(bf, 0.4, sz * (hw + 0.02), hl - 1.3, 0.02, g + 1.25, g + 2.75, C.window, 5);
            S.box(bf, hl + 0.02, 0, 0.02, hw - 0.12, g + 1.0, g + 2.85, C.window, 5);
            S.box(bf, -hl - 0.02, 0, 0.02, hw - 0.3, g + 1.9, g + 2.85, C.window, 5);
            for (const x of [-hl + 2.6, hl - 2.4]) for (const sz of [-1, 1]) S.box(bf, x, sz * (hw - 0.15), 0.5, 0.17, g, g + 1.0, [0.05, 0.05, 0.05]);
            S.blocker(bf, 0, 0, hl, hw, g, g + 3.35, 0.35);
        };
        const nBus = Math.min(d.buses ?? 5, bays);
        const used = new Set();
        for (let k = 0; k < nBus - 1; k++) {
            let i = Math.floor(rnd() * bays);
            while (used.has(i)) i = (i + 1) % bays;
            used.add(i);
            const x = -L + 2 + (i + 0.5) * bw, len = r(11.5, 12.6);
            bus(new GroundFrame(f.xz(x, 8.6 + len / 2), f.yaw + Math.PI / 2 + (rnd() < 0.5 ? Math.PI : 0)), len);
        }
        if (nBus > 0) {
            const lx = r(-L * 0.4, L * 0.4);
            bus(new GroundFrame(f.xz(lx, -11), f.yaw), 12.2);
        }

        // town-centre blocks around the forecourt: flat roofs, window bands per storey
        const blocks = [[-L - 10, 52, 22, 9], [-L + 40, 50, 16, 8], [-L + 82, 54, 24, 10], [L + 4, 48, 14, 9],
            [L + 38, 6, 10, 20], [-L - 10, -52, 24, 10], [-L + 44, -50, 18, 9], [L - 6, -54, 20, 11], [-L - 62, 6, 9, 18]];
        // each with its door on the side facing the forecourt
        blocks.forEach(([bx, bz, bhx, bhz], k) => {
            const storeys = 2 + Math.floor(rnd() * 4), col = C.walls[Math.floor(rnd() * C.walls.length)];
            const face = Math.abs(bx) - L > Math.abs(bz) ? (bx > 0 ? '-x' : '+x') : (bz > 0 ? '-z' : '+z');
            S.building(new GroundFrame(f.xz(bx, bz), f.yaw), { type: d.blockType || 'block', w: 2 * bhx, d: 2 * bhz, storeys, base: gLo,
                floor: gHi + 0.3, color: col, doors: [{ face, at: r(-3, 3) }], seed: 101 + k, roof: { kind: 'flat', overhang: 0.25, thick: 0.5, color: C.concrete, drip: false } });
        });

        // shader boxes: the canopy slab (dry under it: its box starts at the slab, since a point inside a box is not
        // sheltered by it), the fascia as thin boxes round its edges (they keep slanting rain off), the clerestory, the
        // pillars (sun shadows); rain runs off the fascia's edges
        S.blocker(f, 0, 0, L, hz, slab, yt + 0.2, 0.55, 0, gLo);
        for (const sz of [-1, 1]) S.blocker(f, 0, sz * (hz - 0.15), L, 0.15, yf, slab, 0);
        for (const sx of [-1, 1]) S.blocker(f, sx * (L - 0.15), 0, 0.15, hz - 0.3, yf, slab, 0);
        S.blocker(f, 0, 0, L - 7.4, 4.1, yt, yt + 2.5, 0.2, 0, gLo);
        for (const x of pillars) S.blocker(f, x, 0, 0.45, 0.45, plat, slab - 1.4, 0);
        S.drip(f, 0, 0, L, hz, yf, yf - plat + 0.18);

        this.spots = {
            platform: { pos: f.at(-L * 0.55, plat + 1.65, -2.2), look: f.at(-L * 0.05, plat + 2.4, 24) },
            forecourt: { pos: f.at(-L - 4, gHi + 1.7, -27), look: f.at(-L * 0.45, plat + 3.8, 2) },
            overview: { pos: f.at(-L - 70, gHi + 34, -80), look: f.at(-L * 0.2, gHi, 0) },
        };
    }
}

// --- vehicles

// a path through control points { p: [x, z], r (corner radius, m) }: straight between them, the corners rounded by arcs,
// resampled evenly about every `step` m. Closed: a loop starting at ctrl[0] (which should be on a straight), the last
// point one step short of it; open: from the first point to the last
function roundPath(ctrl, step = 1, closed = true) {
    const n = ctrl.length, pts = [];
    for (let i = 0; i < n; i++) {
        if (!closed && (i === 0 || i === n - 1)) { pts.push(ctrl[i].p); continue; }
        const A = ctrl[(i + n - 1) % n].p, B = ctrl[i].p, C = ctrl[(i + 1) % n].p;
        const l1 = Math.hypot(B[0] - A[0], B[1] - A[1]), l2 = Math.hypot(C[0] - B[0], C[1] - B[1]);
        const u1 = [(B[0] - A[0]) / l1, (B[1] - A[1]) / l1], u2 = [(C[0] - B[0]) / l2, (C[1] - B[1]) / l2];
        const th = Math.acos(clamp(u1[0] * u2[0] + u1[1] * u2[1], -1, 1)), sg = Math.sign(u1[0] * u2[1] - u1[1] * u2[0]);
        if (th < 1e-3) { pts.push(B); continue; }
        // the arc is tangent to both legs, its centre on the side the path turns to (right of travel: (-z, x))
        const dd = Math.min(ctrl[i].r * Math.tan(th / 2), 0.48 * Math.min(l1, l2)), r = dd / Math.tan(th / 2);
        const P1 = [B[0] - u1[0] * dd, B[1] - u1[1] * dd], O = [P1[0] - u1[1] * sg * r, P1[1] + u1[0] * sg * r];
        const a0 = Math.atan2(P1[1] - O[1], P1[0] - O[0]), k1 = Math.max(2, Math.ceil(th * r / 0.5));
        for (let k = 0; k <= k1; k++) { const a = a0 + sg * th * k / k1; pts.push([O[0] + Math.cos(a) * r, O[1] + Math.sin(a) * r]); }
    }
    if (closed) pts.push(pts[0]);
    const cum = [0];
    for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
    const total = cum[cum.length - 1], N = Math.max(1, Math.round(total / step)), out = [];
    for (let i = 0, k = 0; i < N + (closed ? 0 : 1); i++) {
        const s = i * total / N;
        while (k + 2 < cum.length && cum[k + 1] < s) k++;
        const t = (s - cum[k]) / (cum[k + 1] - cum[k] || 1);
        out.push([lerp(pts[k][0], pts[k + 1][0], t), lerp(pts[k][1], pts[k + 1][1], t)]);
    }
    return { pts: out, length: total, step: total / N };
}

// the polyline `o` m to the right of travel (right of a heading [x, z] is [-z, x]), mitred at the corners
function offsetLine(pts, o) {
    const nrm = (a, b) => { const dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz); return [-dz / l, dx / l]; };
    return pts.map((p, k) => {
        const n1 = k > 0 ? nrm(pts[k - 1], p) : nrm(p, pts[1]), n2 = k + 1 < pts.length ? nrm(p, pts[k + 1]) : n1;
        const m = [n1[0] + n2[0], n1[1] + n2[1]], d = m[0] * n1[0] + m[1] * n1[1];
        return [p[0] + m[0] / d * o, p[1] + m[1] / d * o];
    });
}

// A bus line between a bus station (`from`) and a village's bus stop (`to`): its buses (Bus) drive one loop from the
// station's platform, along a two-lane road (built here) to the village, through it to a turning loop past its far end,
// and back; each stops by the village's shelter on the pass that has it on the right, and dwells at each stop (`dwell`
// [station, village] s) with its doors open. Cruise at `speed` m/s, slower in the village (`village` m/s) and the station.
// `fleet` buses (default: the station's `buses`, which then all run the line) leave the station at even intervals round
// the trip, and none closes up to within a few metres of the one ahead. The first is `label` in `livery`, the others are
// numbered after it in the station's liveries. A bus can be walked into (Walker): its floor, walls, seats and doors are
// colliders in its frame. Viewpoint (`spot`): "seat" (seated aboard the first bus).
class BusLine extends Entity {
    constructor(def, world) {
        super(def, world);
        this.buses = [];
    }

    // the buses carry the labels; a view that follows the line follows its first bus
    get anchor() { return null; }
    get focus() { return this.buses[0]?.focus ?? null; }

    build(S) {
        const d = this.def, st = this.world.get(d.from), vil = this.world.get(d.to);
        const W = st?.busWay, V = vil?.road;
        if (!W || !V) throw new Error('bus: `from` must be a busStation and `to` a village');
        const sf = (x, z) => st.frame.xz(x, z), P = s => [V.c[0] + V.dir[0] * s, V.c[1] + V.dir[1] * s];
        const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
        const lane = 1.75, head = sf(W.west, W.road);
        // into the village from the road end nearer the station, out past the other end
        const sig = dist(P(V.R), head) < dist(P(-V.R), head) ? 1 : -1;
        const E1 = P(sig * V.R), F2 = P(-sig * (V.R + 15));
        const CL = [sf(W.east, W.road), sf(W.gap, W.road), head, E1, F2];        // the two-lane road's centre line
        const out = offsetLine(CL, lane), back = offsetLine([F2, E1, head, sf(W.gap, W.road)], lane);
        const u = [(F2[0] - E1[0]) / dist(F2, E1), (F2[1] - E1[1]) / dist(F2, E1)], rt = [-u[1], u[0]];
        const T = (a, b) => [F2[0] + u[0] * a + rt[0] * b, F2[1] + u[1] * a + rt[1] * b];
        // a balloon loop past the village's far end: out to the right, round to the left, back in the other lane
        const turn = [T(14, 12), T(36, 11), T(44, -5), T(28, -17), T(10, -lane)];
        const C = (p, r = 12) => ({ p, r });
        const ctrl = [C(sf(W.stop, W.lane)), C(sf(W.east, W.lane), 11), ...out.map((p, k) => C(p, k === 3 ? 40 : 11)),
            ...turn.map(p => C(p, 9)), ...back.map((p, k) => C(p, k === 1 ? 40 : 11)), C(sf(W.gap, W.lane), 10)];
        const loop = roundPath(ctrl);
        this.path = loop.pts;
        this.len = loop.length;
        this.step = loop.step;
        const n = this.path.length;
        // where each point is: 0 the station, 1 the open road, 2 the village, 3 the turning loop
        const sc = st.frame.c, zone = p => dist(p, sc) < 160 ? 0 : dist(p, V.c) < V.R + 20 ? 2 : dist(p, T(25, 0)) < 40 ? 3 : 1;
        this.zones = this.path.map(zone);
        // road height: the bridge's deck in the village, else the terrain as drawn (the roads' lift)
        const height = (x, z) => {
            const rx = x - V.c[0], rz = z - V.c[1], s = rx * V.dir[0] + rz * V.dir[1], side = Math.abs(-rx * V.dir[1] + rz * V.dir[0]);
            if (V.deck && side < 4.5 && s > V.deck.a && s < V.deck.b) return V.deck.top((s - V.deck.a) / (V.deck.b - V.deck.a)) + 0.03;
            return S.ground(x, z) + 0.14;
        };
        this.heights = this.path.map(p => height(...p));
        // the stops: the station's at s = 0; the village's where the front door is by the shelter
        const kerb = [P(V.stop.s)[0] + V.stop.out[0] * lane, P(V.stop.s)[1] + V.stop.out[1] * lane];
        let best = 0;
        this.path.forEach((p, i) => { if (dist(p, kerb) < dist(this.path[best], kerb)) best = i; });
        const doorX = BUS.bay0 + (BUS.doorBays[0] + 0.5) * BUS.bay;
        this.stops = [0, (best * this.step - doorX + this.len) % this.len];
        // speed limits: cruising on the open road, slower in the village, at the station and round the loop, and through
        // bends (1.3 m/s^2 sideways); then braking (1 m/s^2) ahead of every slower stretch, twice round the loop
        const cruise = d.speed ?? 22, slow = d.village ?? 10;
        const head8 = i => { const a = this.path[(i + n - 4) % n], b = this.path[i], c = this.path[(i + 4) % n];
            const h1 = Math.atan2(b[1] - a[1], b[0] - a[0]), h2 = Math.atan2(c[1] - b[1], c[0] - b[0]);
            return Math.abs(Math.atan2(Math.sin(h2 - h1), Math.cos(h2 - h1))) / (8 * this.step); };
        const vmax = this.path.map((p, i) => Math.min([6, cruise, slow, 6][this.zones[i]], Math.sqrt(1.3 / Math.max(head8(i), 1e-6))));
        for (let k = 2 * n - 1; k >= 0; k--) { const i = k % n; vmax[i] = Math.min(vmax[i], Math.sqrt(vmax[(i + 1) % n] ** 2 + 2 * this.step)); }
        this.vmax = vmax;
        // roads: the two-lane road to the village (dashed centre line), the station's one-way lanes and the turning loop
        const C2 = STRUCT_COLORS, road = roundPath([C(sf(W.east, W.road)), C(head, 11), C(E1, 40), C(P(sig * (V.R - 30)))], 4, false).pts;
        const roadPts = [];
        for (const p of road) { roadPts.push(p); if (dist(p, E1) < 3) break; }
        S.ribbon(roadPts, 3.6, C2.asphalt);
        for (let k = 0; k + 1 < roadPts.length; k++) {
            const a = roadPts[k], b = roadPts[k + 1];
            if (k % 3 === 0 && dist(a, sc) > 150) S.strip(a, [lerp(a[0], b[0], 0.75), lerp(a[1], b[1], 0.75)], 0.08, C2.paint, 0, 0.17);
        }
        S.ribbon([P(-sig * (V.R - 2)), F2], 3.5, C2.asphalt);
        const lanes = [];
        let cur = null;
        this.path.forEach((p, i) => {
            const z = this.zones[i];
            if ((z === 0 || z === 3) && i % 3 === 0) { if (!cur) lanes.push(cur = []); cur.push(p); } else if (z !== 0 && z !== 3) cur = null;
        });
        for (const l of lanes) if (l.length > 1) S.ribbon(l, 3.1, C2.asphalt, 3, 0.15);
        // the buses: the first stands at the station's stop, its doors open; each of the others leaves a headway (one
        // trip round over the fleet) after the one before, so it is that much further back in its trip (run on here)
        const fleet = Math.max(1, Math.round(d.fleet ?? st.def.buses ?? 1));
        const liveries = [d.livery || [0.12, 0.36, 0.62], ...BUS_LIVERIES];
        const trip = this.tripTime(), dt = 0.25;
        for (let k = 0; k < fleet; k++) {
            const b = new Bus(this, k ? `${this.label} #${k + 1}` : this.label, liveries[k % liveries.length]);
            for (let t = (trip - k * trip / fleet) % trip; t > 1e-6; t -= dt) b.step(Math.min(dt, t));
            S.blockers.push(b.box);
            this.buses.push(b);
        }
        this.world.buses.push(...this.buses);
    }

    // seconds round the trip for a lone bus: from arriving at the station's stop to arriving there again
    tripTime() {
        const b = new Bus(this, '', null), dt = 0.25;
        let t = 0, away = false;
        while (t < 4 * 3600) {
            b.step(dt);
            t += dt;
            if (b.stop === 1) away = true;
            else if (away && b.mode === 'dwell') return t;
        }
        return t;
    }

    // position, height on the path at arc length s
    at(s) {
        const n = this.path.length, x = ((s % this.len) + this.len) % this.len / this.step, i = Math.floor(x) % n, j = (i + 1) % n, t = x - Math.floor(x);
        const a = this.path[i], b = this.path[j];
        return [lerp(a[0], b[0], t), lerp(this.heights[i], this.heights[j], t), lerp(a[1], b[1], t)];
    }

    update(dt) {
        dt *= this.world.busBoost || 1;
        for (const b of this.buses) {
            // the clear road to the next bus round the loop (to its rear bumper)
            let gap = Infinity;
            for (const o of this.buses) if (o !== b) { const g = (o.s - b.s + this.len) % this.len; if (g > 0 && g < gap) gap = g; }
            b.step(dt, gap - 2 * BUS.hl);
        }
    }
}

// One bus on a BusLine: where it is round the loop (s, m), its speed, its doors (0..1), and what it does: dwell at a
// stop or drive to the next (`stop`: 0 the station, 1 the village). Its pose comes from its axles on the path.
class Bus {
    constructor(line, label, livery) {
        this.line = line;
        this.label = label;
        this.s = 0;
        this.v = 0;
        this.doors = 1;
        this.mode = 'dwell';
        this.stop = 0;                   // the stop it stands at or drives to: 0 the station, 1 the village
        this.clock = (line.def.dwell || [60, 30])[0];
        // mesh and glass in its own frame, colliders, seats; a moving shader box (rain shadow, sun shadow)
        this.mesh = livery ? buildBus(livery) : null;
        this.box = { x: 0, z: 0, hx: BUS.hl, hz: BUS.hw, cs: 1, sn: 0, y0: 0, y1: 1, ao: 0.35, slope: 0, base: 0, dyn: true };
        this.place();
    }

    get anchor() { const p = this.pose; return [p.x, p.y + 5, p.z]; }
    get focus() { const p = this.pose; return [p.x, p.y, p.z]; }

    // pose from the axles on the path: heading from the rear axle to the front one, pitched by their heights
    place() {
        const K = BUS, r = this.line.at(this.s + K.axleR), f = this.line.at(this.s + K.axleF);
        const dx = f[0] - r[0], dz = f[2] - r[2], l = Math.hypot(dx, dz) || 1, cs = dx / l, sn = dz / l, slope = (f[1] - r[1]) / l;
        const x = r[0] - cs * K.axleR, z = r[2] - sn * K.axleR, y = r[1] - slope * K.axleR;
        const cp = 1 / Math.hypot(1, slope), sp = slope * cp;
        // local -> world, column-major: x along the heading (pitched), y up, z to the right
        this.model = [cs * cp, sp, sn * cp, 0, -cs * sp, cp, -sn * sp, 0, -sn, 0, cs, 0, x, y, z, 1];
        this.pose = { x, y, z, cs, sn, slope };
        Object.assign(this.box, { x, z, cs, sn, slope, y0: y + K.skirt, y1: y + K.roof, base: y - 1 });
    }

    toWorld(q, w = 1) { const m = this.model; return [0, 1, 2].map(r => m[r] * q[0] + m[4 + r] * q[1] + m[8 + r] * q[2] + m[12 + r] * w); }
    toLocal(p, w = 1) {
        const m = this.model, d = w ? [p[0] - m[12], p[1] - m[13], p[2] - m[14]] : p;
        return [0, 1, 2].map(c => m[c * 4] * d[0] + m[c * 4 + 1] * d[1] + m[c * 4 + 2] * d[2]);
    }
    // world to its frame, column-major (model is a rotation and a translation)
    get inverse() {
        const m = this.model, inv = new Array(16).fill(0), t = [m[12], m[13], m[14]];
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) inv[c * 4 + r] = m[r * 4 + c];
            inv[12 + r] = -(m[r * 4] * t[0] + m[r * 4 + 1] * t[1] + m[r * 4 + 2] * t[2]);
        }
        inv[15] = 1;
        return inv;
    }
    // the FlyCamera yaw that looks along the bus
    get yaw() { return Math.atan2(-this.pose.cs, -this.pose.sn); }

    // dt s on, with `room` m of clear road ahead of its front bumper (to the next bus), of which it leaves 6 m
    step(dt, room = Infinity) {
        const L = this.line, dwell = L.def.dwell || [60, 30];
        if (this.mode === 'dwell') {
            this.clock -= dt;
            if (this.clock <= 0 && this.doors <= 0) { this.mode = 'drive'; this.stop = 1 - this.stop; }
        } else {
            // up to the speed limit here, braking to stop at the next stop or behind the bus ahead (1 m/s^2), pulling
            // away at 1.1 m/s^2
            const left = (L.stops[this.stop] - this.s + L.len) % L.len, clear = Math.max(room - 6, 0);
            const i = Math.floor(this.s / L.step) % L.path.length;
            const vt = Math.min(L.vmax[i], Math.sqrt(2 * Math.max(left - 0.02, 0)), Math.sqrt(2 * clear));
            this.v = vt < this.v ? vt : Math.min(vt, this.v + 1.1 * dt);
            const ds = Math.min(this.v * dt, left, clear);
            this.s = (this.s + ds) % L.len;
            if (left - ds < 0.03) { this.s = L.stops[this.stop]; this.v = 0; this.mode = 'dwell'; this.clock = dwell[this.stop]; }
        }
        // the doors open once the bus stands, and close 3 s before it leaves (1.5 s each way)
        const open = this.mode === 'dwell' && this.clock > 3;
        this.doors = clamp(this.doors + (open ? dt : -dt) / 1.5, 0, 1);
        this.place();
    }

    // where it is, for the HUD
    describe() {
        const L = this.line, names = [L.world.get(L.def.from)?.label || 'station', L.world.get(L.def.to)?.label || 'village'];
        if (this.mode === 'dwell') return `at ${names[this.stop]} · ${this.clock > 3 ? `doors open, leaves in ${Math.ceil(this.clock)} s` : 'doors closing'}`;
        const left = (L.stops[this.stop] - this.s + L.len) % L.len;
        return `to ${names[this.stop]} · ${fmtKm(left)} · ${(this.v * 3.6).toFixed(0)} km/h`;
    }

    // colliders in the bus's frame: the floor (walkable), walls, the driver's cab, wheel arches, seats, and the door leaves
    // while the doors are not open
    colliders() {
        const m = this.mesh;
        return this.doors > 0.85 ? m.solids : m.solids.concat(m.doorSolids);
    }
}

// the bus's mesh in its own frame (see BUS): opaque parts, glass (drawn see-through in the final pass), the solids a walker
// collides with, and the seats ({ x, z, y (cushion top), eye [x, y, z], name })
function buildBus(livery) {
    const K = BUS, f0 = new GroundFrame([0, 0], 0), B = new Structures(null), G = new Structures(null), C = STRUCT_COLORS;
    const { hl, hw, floor, ceil, roof, skirt, winLo, winHi, wall } = K;
    const box = (S, x0, x1, y0, y1, z0, z1, col, mat = 0) => S.box(f0, (x0 + x1) / 2, (z0 + z1) / 2, (x1 - x0) / 2, (z1 - z0) / 2, y0, y1, col, mat);
    const pane = (S, a, b, c, d, mat) => S.quad(a, b, c, d, [0.5, 0.56, 0.58], mat);
    const dark = [0.05, 0.05, 0.06], white = [0.84, 0.84, 0.82], lining = [0.66, 0.68, 0.70], vinyl = [0.22, 0.23, 0.24];
    const fabric = [0.13, 0.17, 0.34], yellow = [0.85, 0.62, 0.10], IN = BUS_IN;
    const bx = k => K.bay0 + k * K.bay, door = k => K.doorBays.includes(k), axles = [K.axleF, K.axleR];
    const solids = [], doorSolids = [], S0 = (x0, x1, z0, z1, y0, y1, list = solids) => list.push({ x: (x0 + x1) / 2, z: (z0 + z1) / 2, hx: (x1 - x0) / 2, hz: (z1 - z0) / 2, cs: 1, sn: 0, y0, y1, slope: 0 });
    // chassis and floor, roof and ceiling with its lamps
    box(B, -hl, hl, skirt, floor - 0.02, -hw, hw, dark);
    box(B, -hl + wall, hl - wall, floor - 0.02, floor, -hw + wall, hw - wall, vinyl, IN);
    box(B, -hl, hl, ceil + 0.03, roof, -hw, hw, white, 1);
    box(B, -hl + wall, hl - wall, ceil, ceil + 0.03, -hw + wall, hw - wall, [0.80, 0.80, 0.78], IN);
    for (const sz of [-1, 1]) box(B, -hl + 0.6, hl - 1.9, ceil - 0.015, ceil, sz * 0.36, sz * 0.5, [1.0, 0.95, 0.85], 7 + IN);
    box(B, -2.2, 1.2, roof, roof + 0.26, -0.8, 0.8, white, 1);                                       // air conditioning
    S0(-hl, hl, -hw, hw, -0.5, floor);
    // sides: skin outside, lining inside; below the windows (open over the wheels and at the doors), above them, pillars
    for (const sd of [-1, 1]) {
        const zo = [sd * (hw - 0.035), sd * hw].sort((a, b) => a - b), zi = [sd * (hw - wall), sd * (hw - 0.035)].sort((a, b) => a - b);
        const zw = [sd * (hw - wall), sd * hw].sort((a, b) => a - b);
        let cuts = axles.map(a => [a - 0.62, a + 0.62]);
        if (sd > 0) cuts = cuts.concat(K.doorBays.map(k => [bx(k) + K.pillar / 2, bx(k + 1) - K.pillar / 2]));
        cuts.sort((a, b) => a[0] - b[0]);
        let x = -hl;
        for (const [a, b] of [...cuts, [hl, hl]]) {
            if (a > x) { box(B, x, a, skirt, winLo, ...zo, livery); box(B, x, a, floor, winLo, ...zi, lining, IN); }
            x = Math.max(x, b);
        }
        for (const a of axles) box(B, a - 0.62, a + 0.62, skirt + 0.75, winLo, ...zo, livery);       // over the wheel arches
        box(B, -hl, hl, winHi, ceil + 0.03, ...zo, white);
        box(B, -hl + wall, hl - wall, winHi, ceil, ...zi, lining, IN);
        for (let k = 0; k <= K.bays; k++) {
            const x0 = k === 0 ? -hl : bx(k) - K.pillar / 2, x1 = k === K.bays ? hl : bx(k) + K.pillar / 2;
            box(B, x0, x1, winLo, winHi, ...zo, dark, 4);
            box(B, Math.max(x0, -hl + wall), Math.min(x1, hl - wall), winLo, winHi, ...zi, lining, IN);
        }
        for (let k = 0; k < K.bays; k++) {
            if (sd > 0 && door(k)) continue;
            const x0 = bx(k) + K.pillar / 2, x1 = bx(k + 1) - K.pillar / 2, z = sd * (hw - 0.035);
            pane(G, [x0, winLo, z], [x1, winLo, z], [x1, winHi, z], [x0, winHi, z], 0);
        }
        // the wall to walk into: all of it but the door openings
        let wx = -hl;
        for (const k of sd > 0 ? [...K.doorBays].sort((a, b) => a - b) : []) { S0(wx, bx(k) + K.pillar / 2, ...zw, 0, roof); wx = bx(k + 1) - K.pillar / 2; }
        S0(wx, hl, ...zw, 0, roof);
    }
    // doors: two glazed leaves per door bay that slide apart outside the body (BUS_LEAF)
    for (const k of K.doorBays) {
        const x0 = bx(k) + K.pillar / 2, x1 = bx(k + 1) - K.pillar / 2, xm = (x0 + x1) / 2, z = hw - 0.02;
        for (const [a, b, tag] of [[x0, xm, BUS_LEAF[0]], [xm, x1, BUS_LEAF[1]]]) {
            box(B, a, b, floor - 0.05, floor + 0.35, z - 0.015, z + 0.015, dark, 4 + tag);
            box(B, a, b, winHi - 0.06, winHi, z - 0.015, z + 0.015, dark, 4 + tag);
            for (const e of [a, b - 0.05]) box(B, e, e + 0.05, floor + 0.35, winHi - 0.06, z - 0.015, z + 0.015, dark, 4 + tag);
            pane(G, [a + 0.05, floor + 0.35, z], [b - 0.05, floor + 0.35, z], [b - 0.05, winHi - 0.06, z], [a + 0.05, winHi - 0.06, z], tag);
        }
        S0(x0 - 0.06, x1 + 0.06, hw - wall, hw, 0, roof, doorSolids);
        box(B, x0, x1, skirt, floor - 0.05, z - 0.03, z, dark);
    }
    // front: lower panel and bumper, windscreen between corner pillars, the destination display, headlights
    const fw = [0.95, 2.45];
    box(B, hl - 0.05, hl, skirt, fw[0], -hw, hw, livery);
    box(B, hl - wall, hl - 0.05, floor, fw[0], -hw + wall, hw - wall, dark, IN);
    box(B, hl, hl + 0.07, skirt, skirt + 0.25, -hw + 0.05, hw - 0.05, dark, 4);
    for (const sz of [-1, 1]) box(B, hl - 0.1, hl, fw[0], fw[1], ...[sz * (hw - 0.1), sz * hw].sort((a, b) => a - b), dark, 4);
    box(B, hl - 0.06, hl, fw[1], roof, -hw, hw, white);
    box(B, hl, hl + 0.01, fw[1] + 0.06, fw[1] + 0.36, -0.95, 0.95, [1.0, 0.55, 0.08], 7);
    for (const sz of [-1, 1]) box(B, hl, hl + 0.02, 0.55, 0.72, ...[sz * 0.72, sz * 1.1].sort((a, b) => a - b), [1.0, 0.97, 0.9], 7);
    pane(G, [hl - 0.03, fw[0], -hw + 0.1], [hl - 0.03, fw[0], hw - 0.1], [hl - 0.03, fw[1], hw - 0.1], [hl - 0.03, fw[1], -hw + 0.1], 1);
    S0(hl - wall, hl, -hw, hw, 0, roof);
    // mirrors on arms
    for (const sz of [-1, 1]) { box(B, hl - 0.05, hl + 0.32, 2.3, 2.34, ...[sz * hw, sz * (hw + 0.12)].sort((a, b) => a - b), dark, 4); box(B, hl + 0.26, hl + 0.32, 1.9, 2.32, ...[sz * (hw + 0.05), sz * (hw + 0.24)].sort((a, b) => a - b), dark, 4); }
    // rear: panel round the rear window, tail lights
    const rw = [1.4, 2.3, 0.9];
    box(B, -hl, -hl + 0.05, skirt, rw[0], -hw, hw, livery);
    box(B, -hl, -hl + 0.05, rw[1], roof, -hw, hw, white);
    for (const sz of [-1, 1]) {
        const zz = [sz * rw[2], sz * hw].sort((a, b) => a - b);
        box(B, -hl, -hl + 0.05, rw[0], rw[1], ...zz, livery);
        box(B, -hl + 0.05, -hl + wall, rw[0], rw[1], ...[sz * rw[2], sz * (hw - wall)].sort((a, b) => a - b), lining, IN);
        box(B, -hl - 0.02, -hl, 0.6, 1.0, ...[sz * 0.95, sz * 1.18].sort((a, b) => a - b), [0.9, 0.06, 0.04], 7);
    }
    box(B, -hl + 0.05, -hl + wall, floor, rw[0], -hw + wall, hw - wall, lining, IN);
    box(B, -hl + 0.05, -hl + wall, rw[1], ceil, -hw + wall, hw - wall, lining, IN);
    pane(G, [-hl + 0.03, rw[0], -rw[2]], [-hl + 0.03, rw[0], rw[2]], [-hl + 0.03, rw[1], rw[2]], [-hl + 0.03, rw[1], -rw[2]], 1);
    S0(-hl, -hl + wall, -hw, hw, 0, roof);
    // wheels (twelve-sided), and their arches inside
    for (const a of axles) for (const sz of [-1, 1]) {
        const zz = [sz * (hw - 0.32), sz * (hw - 0.03)], ring = k => { const t = k / 12 * 2 * Math.PI; return [a + Math.cos(t) * K.wheel, K.wheel + Math.sin(t) * K.wheel]; };
        for (let k = 0; k < 12; k++) {
            const p = ring(k), q = ring(k + 1);
            B.quad([p[0], p[1], zz[0]], [q[0], q[1], zz[0]], [q[0], q[1], zz[1]], [p[0], p[1], zz[1]], [0.04, 0.04, 0.04]);
            for (const z of zz) B.tri([a, K.wheel, z], [p[0], p[1], z], [q[0], q[1], z], z === zz[1] ? [0.45, 0.46, 0.47] : [0.04, 0.04, 0.04], 4);
        }
        const zi = [sz * (hw - 0.55), sz * (hw - wall)].sort((p, q) => p - q);
        box(B, a - 0.65, a + 0.65, floor, 1.05, ...zi, [0.30, 0.31, 0.32], IN);
        S0(a - 0.65, a + 0.65, ...zi, 0, 1.05);
    }
    // driver's cab: partition, dashboard, seat, steering wheel, the driver
    const dz = [-hw + wall, -0.2];
    box(B, hl - 1.75, hl - 1.7, floor, 1.45, ...dz, lining, IN);
    box(B, hl - 0.65, hl - wall, floor, 1.0, -hw + wall, -0.1, [0.10, 0.10, 0.11], IN);
    box(B, hl - 1.45, hl - 1.0, floor, floor + 0.5, -0.95, -0.5, dark, IN);
    box(B, hl - 1.5, hl - 1.42, floor + 0.5, floor + 1.25, -0.95, -0.5, dark, IN);
    box(B, hl - 0.85, hl - 0.75, 1.05, 1.1, -0.95, -0.5, dark, 4 + IN);
    box(B, hl - 1.4, hl - 1.1, floor + 0.55, floor + 1.15, -0.9, -0.55, [0.16, 0.22, 0.36], IN);
    box(B, hl - 1.33, hl - 1.13, floor + 1.18, floor + 1.42, -0.82, -0.63, [0.72, 0.55, 0.45], IN);
    box(B, hl - 1.1, hl - 0.75, floor + 0.85, floor + 0.95, -0.9, -0.82, [0.16, 0.22, 0.36], IN);
    box(B, hl - 1.1, hl - 0.75, floor + 0.85, floor + 0.95, -0.63, -0.55, [0.16, 0.22, 0.36], IN);
    box(B, hl - 1.95, hl - 1.85, floor, floor + 1.25, 0.55, 0.68, yellow, 4 + IN);                    // ticket validator
    S0(hl - 1.75, hl, -hw, -0.15, 0, 1.45);
    // seats facing forward in pairs either side of the aisle (none by the middle door: room to stand), raised over the
    // wheel arches, and a bench across the back; poles and rails to hold on to
    const seats = [], seat = (x, z, raise, name) => {
        const y = floor + 0.45 + raise;
        if (raise) box(B, x - 0.25, x + 0.22, floor, y - 0.1, z - 0.22, z + 0.22, lining, IN);
        box(B, x - 0.21, x + 0.21, y - 0.1, y, z - 0.21, z + 0.21, fabric, IN);
        box(B, x - 0.26, x - 0.19, y, y + 0.62, z - 0.21, z + 0.21, fabric, IN);
        if (!raise) box(B, x - 0.05, x + 0.05, floor, y - 0.1, z - 0.15, z + 0.15, [0.35, 0.36, 0.37], 4 + IN);
        S0(x - 0.26, x + 0.22, z - 0.22, z + 0.22, 0, y + 0.62);
        seats.push({ x, z, y, eye: [x + 0.02, y + 0.78, z * 0.8], name });            // the head a little in from the window
    };
    let row = 0;
    for (let x = 3.6; x > -4.9; x -= 0.8) {
        row++;
        const raise = axles.some(a => Math.abs(x - a) < 0.7) ? 0.35 : 0;
        for (const sd of [-1, 1]) {
            if (sd > 0 && x > -2.1 && x < 0.5) continue;
            const side = sd < 0 ? 'left' : 'right';
            seat(x, sd * (hw - wall - 0.24), raise, `window seat, row ${row} ${side}`);
            seat(x, sd * (hw - wall - 0.69), raise, `aisle seat, row ${row} ${side}`);
            if (row % 2) box(B, x - 0.32, x - 0.29, floor, ceil, sd * 0.3 - 0.015, sd * 0.3 + 0.015, yellow, 4 + IN);
        }
    }
    for (let k = -2; k <= 2; k++) seat(-hl + wall + 0.47, k * 0.47, 0.18, `back bench, seat ${k + 3}`);
    for (const sd of [-1, 1]) box(B, -hl + 1.2, hl - 2.0, floor + 1.86, floor + 1.89, sd * 0.32 - 0.015, sd * 0.32 + 0.015, yellow, 4 + IN);
    for (const x of [-1.9, 0.3]) box(B, x - 0.015, x + 0.015, floor, ceil, 0.6, 0.63, yellow, 4 + IN);
    return { v: B.v, glass: G.v, solids, doorSolids, seats };
}

// --- weather

// A storm cell (cumulus congestus -> cumulonimbus): grows, matures (rain or snow, lightning), decays (anvil lingers,
// precipitation turns to virga). It drifts with the layer wind; `pinned` cells hold their place and stay mature, `hold`
// cells only stay mature. Optional: `shelf` (shelf cloud on the gust front), `laminar` (mothership plates), `green`
// (green storm light), `wallCloud` (m the base lowers under the updraft).
class StormCell extends Entity {
    constructor(def, world) {
        super(def, world);
        this.pos = [...def.pos];
        this.life = def.life || [600, 1800, 900];
        this.age = def.age ?? (def.pinned ? this.life[0] : 0);
        this.seed = def.seed ?? Math.random();
        this.flashClock = 0;
        this.state = {};
        this.evolve();
    }

    get anchor() { return [this.pos[0], this.world.weather.cur.base - 250, this.pos[1]]; }
    get mature() { return this.age >= this.life[0] && this.age < this.life[0] + this.life[1]; }

    evolve() {
        const d = this.def, [g, m, k] = this.life, wx = this.world.weather.cur;
        const grow = smoothstep(0, 1, clamp(this.age / g, 0, 1));
        const decay = clamp((this.age - g - m) / k, 0, 1);
        const base = wx.base;
        const s = this.state;
        s.coverage = grow * (1 - smoothstep(0.35, 1, decay));
        s.top = Math.max(base + 600, lerp(base + 500, d.top || 9000, grow));
        s.precip = Math.min(2, (d.precip ?? 0.7) * wx.power) * smoothstep(0.55, 1, clamp(this.age / g, 0, 1)) * (1 - smoothstep(0.45, 1, decay));
        s.virga = lerp(d.virga ?? 0.1, 0.92, smoothstep(0.2, 0.85, decay));
        s.radius = (d.radius || 4000) * (0.55 + 0.45 * grow) * (1 + 0.3 * decay);
        s.decay = decay;
    }

    update(dt, wdt) {
        const d = this.def, w = this.world.weather.cur;
        if (d.pinned || d.hold) this.age = Math.min(this.age + wdt, this.life[0] + this.life[1] * 0.5);
        else this.age += wdt;
        if (!d.pinned) {
            const drift = d.drift ?? 1, vel = d.velocity || [0, 0];
            this.pos[0] += (w.wind[0] * drift + vel[0]) * wdt;
            this.pos[1] += (w.wind[1] * drift + vel[1]) * wdt;
        }
        this.evolve();
        if (this.age > this.life[0] + this.life[1] + this.life[2]) this.dead = true;
        // lightning, in real time while mature
        const rate = (d.lightning || 0) * w.lightning / 60;
        if (rate > 0 && this.mature && this.state.precip > 0.15) {
            this.flashClock -= dt;
            if (this.flashClock <= 0) {
                this.world.lightning.strike(this);
                this.flashClock = -Math.log(1 - Math.random() * 0.999) / rate;
            }
        }
    }

    cell() {
        const s = this.state;
        if (s.coverage <= 0.005 && s.precip <= 0.005) return null;
        // the precipitation core sits on the downwind flank unless the definition places it
        const w = this.world.weather.cur.wind, wl = Math.hypot(w[0], w[1]) || 1;
        const off = this.def.coreOffset || [w[0] / wl * s.radius * 0.2, w[1] / wl * s.radius * 0.2];
        const d = this.def, rain = sat01(s.precip * 3);
        return { x: this.pos[0], z: this.pos[1], radius: s.radius, top: s.top, coverage: s.coverage, precip: s.precip,
            seed: this.seed, virga: s.virga, core: d.core ?? 0.45, offset: off,
            shelf: (d.shelf || 0) * rain, laminar: (d.laminar || 0) * s.coverage, green: d.green || 0, wall: (d.wallCloud || 0) * rain };
    }

    // cloud genus for labels
    get kind() {
        if (this.def.shelf) return 'cumulonimbus + shelf cloud';
        return this.state.top - this.world.weather.cur.base > 4500 ? 'cumulonimbus' : 'cumulus congestus';
    }

    describe() {
        const s = this.state, wx = this.world.weather;
        const kind = s.precip < 0.03 ? 'building' : s.virga > 0.7 ? 'virga' : wx.typeAt(this.world.field.base);
        const level = s.precip < 0.03 ? '' : s.precip < 0.25 ? 'light ' : s.precip < 0.55 ? 'moderate ' : s.precip < 0.85 ? 'heavy ' : 'torrential ';
        return `${this.kind} · ${kind === 'building' || kind === 'virga' ? '' : level}${kind}${this.mature && this.def.lightning && wx.cur.lightning > 0 ? ' ⚡' : ''}`;
    }
}

// "mothership": a rotating supercell. Wide, with smooth stacked plates, a wall cloud under the updraft and a shelf
// cloud on its gust front; `green` tints the light under it.
// The plate stack is analytic (mothershipDensity): `stackRadius` (x radius), `stackDrop` / `stackHeight` (m around the
// cloud base), `plates`, `twist`, `spin` (rad/s), `wallCloud` (m), `wallRadius` (x stack radius).
class Supercell extends StormCell {
    constructor(def, world) {
        super({ radius: 7000, top: 12000, precip: 1, core: 0.4, lightning: 6, ...def }, world);
        this.spin = 0;
    }
    get kind() { return 'supercell (mothership)'; }
    get focus() { const o = this.updraft; return [o[0], this.world.field.base, o[1]]; }

    // the updraft sits opposite the rain core
    get updraft() {
        const off = this.def.coreOffset || [0, 0];
        return [this.pos[0] - off[0] * 0.25, this.pos[1] - off[1] * 0.25];
    }

    update(dt, wdt) {
        super.update(dt, wdt);
        this.spin += dt * (this.def.spin ?? 0.03);
    }

    features(out) {
