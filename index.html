        const d = this.def, s = this.state, base = this.world.weather.cur.base, [x, z] = this.updraft;
        if (s.coverage < 0.05) return;
        out.ms.push([x, z, s.radius * (d.stackRadius ?? 0.8), this.spin,
            base - (d.stackDrop ?? 300), base + (d.stackHeight ?? 4500), d.plates ?? 6, d.twist ?? 0.5,
            d.wallCloud ?? 800, d.wallRadius ?? 0.3, smoothstep(0.1, 0.6, s.coverage), this.seed * 10]);
    }
}

// a line of storms carried by the wind, each with a shelf cloud along its gust front; starts over after `travel` m
class SquallLine extends Entity {
    spawn() {
        const d = this.def, n = d.count || 5, rng = mulberry32(d.seed || 3);
        this.cells = [];
        for (let k = 0; k < n; k++) {
            const t = n > 1 ? k / (n - 1) : 0.5;
            this.cells.push(this.world.add({
                type: 'storm', label: k === Math.floor(n / 2) ? this.label : '', seed: rng(),
                pos: [lerp(d.from[0], d.to[0], t) + (rng() - 0.5) * 2500, lerp(d.from[1], d.to[1], t) + (rng() - 0.5) * 2500],
                radius: (d.radius || 4500) * (0.8 + 0.4 * rng()), top: (d.top || 10000) * (0.85 + 0.15 * rng()),
                precip: d.precip ?? 0.9, core: 0.55, coreOffset: [0, 0], life: [400, 1e9, 900], age: 400, hold: true, drift: 0,
                lightning: d.lightning ?? 3, virga: 0.05, green: d.green || 0,
            }));
        }
        this.starts = this.cells.map(c => [...c.pos]);
        this.offset = [0, 0];
        this.label = '';            // the middle cell carries it
    }

    get motion() {
        const w = this.world.weather.cur.wind, v = this.def.velocity || [0, 0], k = this.def.drift ?? 1;
        return [w[0] * k + v[0], w[1] * k + v[1]];
    }

    update(dt, wdt) {
        const [vx, vz] = this.motion;
        this.offset[0] += vx * wdt;
        this.offset[1] += vz * wdt;
        if (Math.hypot(...this.offset) > (this.def.travel || 60000)) this.offset = [0, 0];
        this.cells.forEach((c, i) => { c.pos = [this.starts[i][0] + this.offset[0], this.starts[i][1] + this.offset[1]]; });
    }

    // the gust front: the line moved ahead of the cells, bowed out in the middle
    get front() {
        const d = this.def, [vx, vz] = this.motion, ml = Math.hypot(vx, vz) || 1, m = [vx / ml, vz / ml];
        const gap = (d.radius || 4500) * (d.gap ?? 0.9);
        const a = [d.from[0] + this.offset[0] + m[0] * gap, d.from[1] + this.offset[1] + m[1] * gap];
        const b = [d.to[0] + this.offset[0] + m[0] * gap, d.to[1] + this.offset[1] + m[1] * gap];
        const bow = d.bow ?? 4000;
        const c = [(a[0] + b[0]) / 2 + m[0] * bow * 2, (a[1] + b[1]) / 2 + m[1] * bow * 2];   // control point: the curve reaches half of it
        return { a, b, c, m };
    }

    get focus() { const { a, b, c } = this.front; return [(a[0] + b[0]) / 4 + c[0] / 2, this.world.field.base, (a[1] + b[1]) / 4 + c[1] / 2]; }

    features(out) {
        const d = this.def, { a, b, c, m } = this.front, depth = d.shelfDepth ?? 7000, pad = depth + 2000;
        const strength = (d.shelf ?? 1) * this.cells.reduce((sum, e) => sum + e.state.coverage, 0) / this.cells.length;
        if (strength < 0.02) return;
        out.shelves.push([...a, ...b, ...c, ...m, d.lip ?? 650, depth, d.tiers ?? 3, strength,
            Math.min(a[0], b[0], c[0]) - pad, Math.min(a[1], b[1], c[1]) - pad, Math.max(a[0], b[0], c[0]) + pad, Math.max(a[1], b[1], c[1]) + pad]);
    }
}

// keeps the sky populated: spawns storm cells inside `area` at `rate` cells per weather-hour (times the state's `storms`)
class Spawner extends Entity {
    spawn() {
        this.rng = mulberry32(this.def.seed || 1);
        this.clock = 0;
        this.made = 0;
        for (let k = 0; k < (this.def.initial || 0); k++) {
            const def = this.make(this.rand(this.def.area[0], this.def.area[2]), this.rand(this.def.area[1], this.def.area[3]));
            def.age = this.rng() * (def.life[0] + def.life[1] + def.life[2]) * 0.8;
            this.world.add(def);
        }
    }

    rand(a, b) { return lerp(a, b, this.rng()); }
    pick(key, fallback) { const r = (this.def.template || {})[key]; return r ? this.rand(r[0], r[1]) : fallback; }

    make(x, z) {
        this.made++;
        return {
            type: 'storm', label: `Cell ${this.made}`, pos: [x, z], spawned: true, seed: this.rng(),
            radius: this.pick('radius', 3500), top: this.pick('top', 8000), precip: this.pick('precip', 0.6), core: this.pick('core', 0.45),
            life: [this.pick('grow', 700), this.pick('mature', 1500), this.pick('decay', 900)],
            lightning: this.pick('lightning', 1), virga: this.pick('virga', 0.2), drift: this.pick('drift', 1),
        };
    }

    count() { return this.world.entities.filter(e => e instanceof StormCell && e.def.spawned && !e.dead).length; }

    update(dt, wdt) {
        const w = this.world.weather.cur, rate = (this.def.rate || 6) * w.storms / 3600;
        if (rate <= 0) return;
        this.clock -= wdt;
        if (this.clock > 0) return;
        this.clock = -Math.log(1 - this.rng() * 0.999) / rate;
        if (this.count() >= (this.def.max || 16)) return;
        // new cells form upwind, so they drift across the area while they live
        const [x0, z0, x1, z1] = this.def.area, wl = Math.hypot(w.wind[0], w.wind[1]) || 1;
        let x = this.rand(x0, x1), z = this.rand(z0, z1);
        x -= w.wind[0] / wl * (x1 - x0) * 0.25;
        z -= w.wind[1] / wl * (z1 - z0) * 0.25;
        this.world.add(this.make(x, z));
    }

    // a cell where the user asked for one
    spawnAt(x, z) { const def = this.make(x, z); def.label = `Cell ${this.made} (yours)`; return this.world.add(def); }
}

const ENTITY_TYPES = {
    tilt: Tilt,
    hills: Hills,
    mountain: Mountain,
    range: Range,
    river: River,
    lake: Lake,
    town: Town,
    forest: Forest,
    village: Village,
    busStation: BusStation,
    bus: BusLine,
    storm: StormCell,
    supercell: Supercell,
    squall: SquallLine,
    spawner: Spawner,
};

// =====================================================================================================
// Weather, sky, lightning
// =====================================================================================================
// Named weather states; the current state blends towards the target over `transition` seconds. A state's `zones` (rain
// that differs along the bus route, RainZones) is not blended: the zones fade in and out on their own.
class WeatherSystem {
    constructor(def) {
        this.def = def || {};
        this.states = Object.fromEntries(Object.entries(this.def.states || { default: {} }).map(([k, v]) => [k, { zones: null, ...WEATHER_DEFAULTS, ...v }]));
        this.names = Object.keys(this.states);
        const start = this.states[this.def.start] ? this.def.start : this.names[0];
        this.cur = structuredClone(this.states[start]);
        this.from = structuredClone(this.cur);
        this.target = start;
        this.blend = 1;
        this.transition = this.def.transition ?? 10;
        this.cycle = { enabled: false, hold: 40, ...(this.def.cycle || {}) };
        this.cycleClock = this.cycle.hold;
        this.offset = [0, 0];
    }

    set(name) {
        if (!this.states[name]) return;
        this.from = structuredClone(this.cur);
        this.target = name;
        this.cur.zones = this.states[name].zones;
        this.blend = 0;
        this.cycleClock = this.cycle.hold;
    }

    next() { this.set(this.names[(this.names.indexOf(this.target) + 1) % this.names.length]); }

    get freezingLevel() { return this.cur.temperature / 6.5 * 1000; }

    // precipitation type reaching height y
    typeAt(y) {
        const fl = this.freezingLevel;
        return y > fl + 150 ? 'snow' : y > fl - 250 ? 'sleet' : 'rain';
    }

    update(dt, wdt) {
        if (this.blend < 1) {
            this.blend = Math.min(1, this.blend + dt / Math.max(this.transition, 1e-3));
            const k = smoothstep(0, 1, this.blend), to = this.states[this.target];
            for (const key of Object.keys(to)) {
                if (key === 'zones') continue;
                const a = this.from[key], b = to[key];
                if (Array.isArray(b)) this.cur[key] = b.map((v, i) => lerp(a[i], v, k));
                else if (typeof b === 'object') {
                    const names = new Set([...Object.keys(a || {}), ...Object.keys(b)]);
                    this.cur[key] = Object.fromEntries([...names].map(n => [n, lerp(a?.[n] ?? 0, b[n] ?? 0, k)]));
                } else this.cur[key] = lerp(a, b, k);
            }
        }
        if (this.cycle.enabled && (this.cycleClock -= dt) <= 0) this.next();
        this.offset[0] += this.cur.wind[0] * wdt;
        this.offset[1] += this.cur.wind[1] * wdt;
    }
}

// Mixed rain: a state's `zones` puts its `variants` (other weather states: drizzle, light rain, ...) along a bus route
// at once, in stretches of `length` m from the station out to the turn, each variant at least once, and reshuffles them
// after a random `hold` [min, max] s (blending over the weather transition). `dry` { state, count } adds `count`
// stretches of a state without a deck (clear), twice as long: no rain, and the genus layers open up over them to its
// sky. The route is sampled every ZONE_STEP m; each sample carries a rain scale for the genus layers (F.rain.z there,
// see zoneAt in WGSL), a cover scale for them (0 a clear stretch), the route's direction there and a drop size (the
// near-field rain at the camera). A variant's rain scale is the one that gives this state's deck the precipitation the
// variant's own deck has (deckRain), so a drizzle stretch rains like drizzle under the mixed state's nimbostratus.
// A clear stretch's opening reaches CLEAR_RADIUS m past its ends along the route (short of the next stretch's rain:
// rain needs cloud above it) and CLEAR_WIDE times that to the sides, so the sky over it is open, not a gap overhead.
class RainZones {
    constructor(world) {
        this.world = world;
        this.pts = [];          // { x, z, s (m from the station), dir [x, z], scale, cover, drops, from, to }
        this.ends = [];         // where each stretch of `order` ends (m from the station)
        this.fade = 0;          // 0 no zones .. 1 the zones rule along the route
        this.spec = null;
        this.order = [];
        this.clock = 0;
        this.blend = 1;
    }

    // precipitation of a state's genus decks at a rain scale, as the weather map has it where the decks are typical
    static deckRain(state, defs, scale) {
        let pr = 0, pour = 0;
        for (const d of defs) {
            const c = state.layers?.[d.name] ?? 0, lc = sat01(c * 0.45 + c * c * 0.6);
            const lp = d.precip * smoothstep(0.35, 0.85, lc) * scale;
            pr = 1 - (1 - pr) * (1 - sat01(lp));
            pour = Math.max(pour, lp - 1);
        }
        return pr + pour;
    }

    // the route of `along` (a bus line): its path from the station out to the turn
    build(spec) {
        const line = this.world.get(spec.along);
        this.pts = [];
        if (!line?.path) return;
        const half = line.len / 2;
        for (let s = 0; s <= half && this.pts.length < MAX_RAIN_ZONES; s += ZONE_STEP) {
            const p = line.at(s), a = line.at(s - 20), b = line.at(s + 20), l = Math.hypot(b[0] - a[0], b[2] - a[2]) || 1;
            this.pts.push({ x: p[0], z: p[2], s, dir: [(b[0] - a[0]) / l, (b[2] - a[2]) / l], scale: 1, cover: 1, drops: 0.5, from: [1, 1, 0.5], to: [1, 1, 0.5] });
        }
        this.half = half;
    }

    // a new random order of the variants along the route: every one at least once, the dry stretches (two units of
    // `length` each) added, no two stretches alike side by side
    shuffle(spec) {
        const W = this.world.weather, defs = this.world.clouds.defs, deck = W.states[W.target];
        const vars = (spec.variants || []).filter(n => W.states[n]);
        const dry = W.states[spec.dry?.state] ? spec.dry.state : null, dryCount = dry ? Math.max(0, spec.dry.count ?? 2) : 0;
        if (!vars.length || !this.pts.length) return;
        const wet = Math.max(vars.length, Math.round(this.half / (spec.length || 1200)) - 2 * dryCount);
        const bag = [...vars, ...new Array(dryCount).fill(dry)];
        while (bag.length < wet + dryCount) bag.push(vars[Math.floor(Math.random() * vars.length)]);
        let order = bag;
        for (let t = 0; t < 200; t++) {
            order = [...bag].sort(() => Math.random() - 0.5);
            if (order.every((v, i) => i === 0 || v !== order[i - 1])) break;
        }
        this.order = order;
        // a variant's rain scale: what gives this state's deck the variant's own precipitation; its cover: 0 for a
        // state without a deck (clear)
        const want = name => {
            const v = W.states[name], target = RainZones.deckRain(v, defs, v.rain);
            let lo = 0, hi = 8;
            for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; if (RainZones.deckRain(deck, defs, m) < target) lo = m; else hi = m; }
            const cover = smoothstep(0, 0.5, Math.max(0, ...Object.values(v.layers || {})));
            return [(lo + hi) / 2, cover, v.drops];
        };
        const params = Object.fromEntries([...new Set(order)].map(n => [n, want(n)]));
        const unit = this.half / order.reduce((a, v) => a + (v === dry ? 2 : 1), 0);
        let end = 0;
        this.ends = order.map(v => (end += (v === dry ? 2 : 1) * unit));
        for (const p of this.pts) {
            p.from = [p.scale, p.cover, p.drops];
            p.to = params[this.order[this.stretch(p.s)]];
        }
        this.blend = 0;
        const h = spec.hold || [40, 100];
        this.clock = lerp(h[0], h[1] ?? h[0], Math.random());
    }

    update(dt) {
        const W = this.world.weather, spec = W.cur.zones;
        if (spec && spec !== this.spec) {
            if (spec.along !== this.spec?.along) this.build(spec);
            this.spec = spec;
            this.shuffle(spec);
            if (this.fade === 0) { this.blend = 1; for (const p of this.pts) [p.scale, p.cover, p.drops] = p.to; }
        }
        this.fade = sat01(this.fade + (spec ? 1 : -1) * dt / Math.max(W.transition, 1e-3));
        if (!this.spec) return;
        if (spec && (this.clock -= dt) <= 0) this.shuffle(spec);
        if (this.blend < 1) {
            this.blend = Math.min(1, this.blend + dt / Math.max(W.transition, 1e-3));
            const k = smoothstep(0, 1, this.blend);
            for (const p of this.pts) [p.scale, p.cover, p.drops] = p.from.map((a, i) => lerp(a, p.to[i], k));
        }
        if (!spec && this.fade === 0) this.spec = null;
    }

    // weight of the route at x, z (0 off it, 1 on it) and the zones' drop size there; mirrors zoneAt in WGSL
    at(x, z) {
        let w = 0, v = 0;
        for (const p of this.pts) { const d = Math.hypot(x - p.x, z - p.z) / ZONE_RADIUS; if (d < 3) { const g = Math.exp(-d * d); w += g; v += g * p.drops; } }
        return { k: sat01(w) * this.fade, drops: w > 1e-4 ? v / w : 0 };
    }

    // drop size at the camera: the state's, or the zone's along the route
    drops(x, z, base) { if (!this.fade) return base; const a = this.at(x, z); return lerp(base, a.drops, a.k); }

    // index in `order` of the stretch at s m from the station
    stretch(s) { const i = this.ends.findIndex(e => s < e); return i < 0 ? this.ends.length - 1 : i; }

    // the variant of the stretch nearest x, z (for the HUD), or null off the route
    variantAt(x, z) {
        if (!this.fade || !this.order.length) return null;
        let best = null, bd = ZONE_RADIUS * 1.5;
        for (const p of this.pts) { const d = Math.hypot(x - p.x, z - p.z); if (d < bd) { bd = d; best = p; } }
        return best ? this.order[this.stretch(best.s)] : null;
    }

    write(F) {
        const n = this.fade > 0 ? this.pts.length : 0;
        for (let i = 0; i < n; i++) {
            const p = this.pts[i];
            F.set('rainZones', [p.x, p.z, p.cover, p.scale], i * 4);
            F.set('zoneDirs', p.dir, i * 2);
        }
        F.set('zoneInfo', [n, this.fade, ZONE_RADIUS, CLEAR_RADIUS]);
    }
}

// Cloud genus layers besides the convective one (stratus, nimbostratus, altostratus, altocumulus, ...): shape data from
// the scenario's `clouds`, coverage per weather state (`layers: { genus: coverage }`). Up to MAX_LAYERS.
class CloudLayers {
    constructor(defs) {
        this.defs = (defs || []).slice(0, MAX_LAYERS).map((d, i) => ({ ...LAYER_DEFAULTS, seed: i * 0.37 + 0.11, ...d }));
    }

    coverage(weather, d) { return d ? (weather.layers?.[d.name] ?? 0) : 0; }

    write(frame, weather, convectiveBase) {
        let lo = Infinity, hi = -Infinity;
        for (let k = 0; k < MAX_LAYERS; k++) {
            const d = this.defs[k], cov = this.coverage(weather, d);
            frame.set('layers', d ? [d.base, d.top, cov, d.density, d.mapScale, d.shapeScale, d.stretch, d.erosion,
                LAYER_KINDS[d.kind] ?? 1, d.ambient, d.precip, d.seed] : new Array(12).fill(0), k * 12);
            if (cov > 0.005) { lo = Math.min(lo, d.base); hi = Math.max(hi, d.top); }
        }
        frame.set('layerInfo', [isFinite(lo) ? lo : 1e6, isFinite(hi) ? hi : -1e6, Math.min(convectiveBase - 1300, lo), 0]);
    }

    // [name, coverage] of every genus present, for the HUD
    active(weather) {
        const list = [['cumulus', weather.coverage]];
        for (const d of this.defs) list.push([d.name, this.coverage(weather, d)]);
        list.push(['cirrus', weather.cirrus]);
        return list.filter(([, c]) => c > 0.02);
    }
}

// sun and sky colours from the sun elevation (Kasten-Young air mass through Rayleigh + Mie) and the weather
class Sky {
    static compute(az, el, intensity, weather) {
        const dir = [Math.cos(el) * Math.sin(az), Math.sin(el), -Math.cos(el) * Math.cos(az)];
        const elDeg = el / DEG;
        const am = 1 / (Math.sin(Math.max(el, 0)) + 0.50572 * Math.pow(Math.max(elDeg, 0) + 6.07995, -1.6364));
        const tauR = [0.04, 0.095, 0.22], tauM = 0.02 + 0.035 * weather.haze;
        const trans = tauR.map(t => Math.exp(-(t + tauM) * am));
        const day = smoothstep(-3, 10, elDeg);
        const sun = trans.map(t => t * intensity * (0.2 + 0.8 * day));
        const blue = [0.16, 0.32, 0.72].map((c, i) => c * (0.25 + 0.75 * day) * (0.6 + 0.4 * trans[i]));
        const low = (1 - smoothstep(2, 18, elDeg)) * 0.6;
        const warm = trans.map(t => t / Math.max(...trans));
        const horizon = [0.6, 0.68, 0.78].map((c, i) => lerp(c, c * (0.55 + 0.6 * warm[i]), low) * (0.3 + 0.7 * day));
        // overcast: greyer, darker sky
        const g = Math.pow(clamp(weather.coverage, 0, 1), 1.5) * 0.85;
        const grey = 0.45 * (0.3 + 0.7 * day);
        const zenith = blue.map(c => lerp(c, grey, g)).map(c => c * (1 - 0.35 * g));
        const hor = horizon.map(c => lerp(c, grey * 1.1, g * 0.8));
        const ambient = zenith.map((c, i) => (c * 0.6 + hor[i] * 0.4) * 1.1);
        return { dir, sun, zenith, horizon: hor, ambient };
    }
}

// lightning flashes (light inside the cloud) and, for some, cloud-to-ground bolts
class Lightning {
    constructor() {
        this.flashes = [];
        this.segs = new Float32Array(MAX_BOLT_SEGS * 8);
        this.count = 0;
    }

    strike(cell, forceBolt = false) {
        if (this.flashes.length >= MAX_FLASHES) this.flashes.shift();
        const s = cell.state, w = cell.world.weather.cur, ang = Math.random() * Math.PI * 2, r = s.radius * 0.35 * Math.sqrt(Math.random());
        const x = cell.pos[0] + Math.cos(ang) * r, z = cell.pos[1] + Math.sin(ang) * r;
        const y = lerp(w.base + 800, s.top * 0.75, Math.random());
        const f = { pos: [x, y, z], age: 0, dur: 0.35 + Math.random() * 0.5, peak: 25 + Math.random() * 35, seed: Math.random() * 100, bolt: null };
        if (forceBolt || Math.random() < 0.35) f.bolt = this.makeBolt([x, w.base + 150, z], cell.world.field);
        this.flashes.push(f);
        cell.world.flashCount++;
    }

    // jagged path from the cloud base to the ground, with a few branches
    makeBolt(start, field) {
        const end = [start[0] + (Math.random() - 0.5) * 2500, 0, start[2] + (Math.random() - 0.5) * 2500];
        end[1] = field.sample(end[0], end[2]);
        const segs = [];
        const walk = (a, b, depth, width, out) => {
            let pts = [a, b];
            for (let level = 0; level < depth; level++) {
                const next = [pts[0]];
                for (let k = 0; k < pts.length - 1; k++) {
                    const p = pts[k], q = pts[k + 1], len = v3.len(v3.sub(q, p));
                    const m = v3.add(v3.mul(v3.add(p, q), 0.5), [(Math.random() - 0.5) * len * 0.45, (Math.random() - 0.5) * len * 0.15, (Math.random() - 0.5) * len * 0.45]);
                    next.push(m, q);
                }
                pts = next;
            }
            for (let k = 0; k < pts.length - 1; k++) out.push([pts[k], pts[k + 1], width]);
            return pts;
        };
        const main = walk(start, end, 6, 6, segs);
        for (let b = 0; b < 3; b++) {
            const from = main[Math.floor(Math.random() * main.length * 0.6)];
            const to = v3.add(from, [(Math.random() - 0.5) * 1800, -300 - Math.random() * 900, (Math.random() - 0.5) * 1800]);
            walk(from, to, 4, 2.5, segs);
        }
        return segs;
    }

    update(dt) {
        for (const f of this.flashes) f.age += dt;
        this.flashes = this.flashes.filter(f => f.age < f.dur);
    }

    // intensity with a few return strokes
    level(f) {
        const t = f.age / f.dur, strokes = Math.max(0, Math.sin(f.age * 38 + f.seed)) * 0.6 + 0.4;
        return f.peak * Math.exp(-t * 4) * strokes;
    }

    write(frame) {
        for (let k = 0; k < MAX_FLASHES; k++) {
            const f = this.flashes[k];
            frame.set('flash', f ? [...f.pos, this.level(f)] : [0, 0, 0, 0], k * 4);
        }
        this.segs.fill(0);
        let n = 0;
        for (const f of this.flashes) {
            if (!f.bolt) continue;
            const b = this.level(f) * 40;
            for (const [a, c, w] of f.bolt) {
                if (n >= MAX_BOLT_SEGS) break;
                this.segs.set([...a, b, ...c, w], n * 8);
                n++;
            }
        }
        this.count = n;
    }

    get brightness() { return this.flashes.reduce((s, f) => s + this.level(f), 0); }
}

// ------------------------------------------------------------------------------------------------- world
class World {
    constructor(scenario) {
        this.scenario = scenario;
        const t = { size: 64000, resolution: 512, base: 1500, fieldSize: 800, pivots: 0.2, ...(scenario.terrain || {}) };
        this.terrain = t;
        this.field = new Heightfield(t.size, t.resolution, t.base);
        this.weather = new WeatherSystem(scenario.weather);
        this.clouds = new CloudLayers(scenario.clouds);
        this.lightning = new Lightning();
        this.entities = [];
        this.byId = new Map();
        this.flashCount = 0;
        this.buses = [];                 // every bus of every BusLine (each drawn, and can be ridden)
        this.busBoost = 1;               // their time runs this many times as fast (hold Z)
        for (const def of scenario.entities || []) this.add(def, false);
        for (const e of this.entities) { e.stamp(this.field); this.field.updateRange(); }
        this.field.freeze();
        this.structures = new Structures(this.field, scenario.buildings);
        for (const e of this.entities) e.build(this.structures);
        for (const e of [...this.entities]) e.spawn();
        this.rainZones = new RainZones(this);
    }

    add(def, spawn = true) {
        const Type = ENTITY_TYPES[def.type];
        if (!Type) throw new Error(`unknown entity type "${def.type}"`);
        const e = new Type(def, this);
        this.entities.push(e);
        if (e.id) this.byId.set(e.id, e);
        if (spawn) e.spawn();
        return e;
    }

    get(id) { return this.byId.get(id); }
    get storms() { return this.entities.filter(e => e instanceof StormCell); }
    get spawner() { return this.entities.find(e => e instanceof Spawner); }

    // analytic storm structures for the GPU: motherships (12 floats each) and shelf lines (16 floats each)
    features() {
        const out = { ms: [], shelves: [] };
        for (const e of this.entities) e.features(out);
        return { ms: out.ms.slice(0, MAX_MOTHERSHIPS), shelves: out.shelves.slice(0, MAX_SHELVES) };
    }

    update(dt, wdt, t) {
        this.weather.update(dt, wdt);
        this.rainZones.update(dt);
        for (const e of [...this.entities]) e.update(dt, wdt, t);
        if (this.entities.some(e => e.dead)) {
            this.entities = this.entities.filter(e => !e.dead);
            for (const [k, e] of this.byId) if (e.dead) this.byId.delete(k);
        }
        this.lightning.update(dt);
    }

    // storm cells for the GPU, nearest to `around` first when there are too many
    gpuCells(around) {
        const list = this.entities.map(e => e.cell()).filter(Boolean);
        if (list.length > MAX_CELLS) list.sort((a, b) => Math.hypot(a.x - around[0], a.z - around[2]) - Math.hypot(b.x - around[0], b.z - around[2]));
        return list.slice(0, MAX_CELLS);
    }
}

// =====================================================================================================
// GPU passes
// =====================================================================================================
// 3D noise volumes, baked once
class NoiseVolumes {
    constructor(device) {
        const U = GPUTextureUsage;
        const make = n => device.createTexture({ size: [n, n, n], dimension: '3d', format: 'rgba8unorm', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING });
        this.shape = make(NOISE_SHAPE);
        this.detail = make(NOISE_DETAIL);
        const layout = makeLayout(device, GPUShaderStage.COMPUTE, ['write3d:rgba8unorm', 'write3d:rgba8unorm']);
        const module = device.createShaderModule({ label: 'noise', code: WGSL_NOISE });
        const pl = device.createPipelineLayout({ bindGroupLayouts: [layout] });
        const group = makeGroup(device, layout, [this.shape.createView({ dimension: '3d' }), this.detail.createView({ dimension: '3d' })], 'noise');
        const enc = device.createCommandEncoder();
        const pass = enc.beginComputePass();
        pass.setBindGroup(0, group);
        pass.setPipeline(device.createComputePipeline({ layout: pl, compute: { module, entryPoint: 'genShape' } }));
        pass.dispatchWorkgroups(NOISE_SHAPE / 4, NOISE_SHAPE / 4, NOISE_SHAPE / 4);
        pass.setPipeline(device.createComputePipeline({ layout: pl, compute: { module, entryPoint: 'genDetail' } }));
        pass.dispatchWorkgroups(NOISE_DETAIL / 4, NOISE_DETAIL / 4, NOISE_DETAIL / 4);
        pass.end();
        device.queue.submit([enc.finish()]);
        this.shapeView = this.shape.createView({ dimension: '3d' });
        this.detailView = this.detail.createView({ dimension: '3d' });
    }
}

// shader source for a pass: frame struct, helpers, bindings
const shaderSource = (set, ...parts) => FrameBlock.wgsl() + WGSL_MATH + set.wgsl + parts.join('\n');

function computePipeline(device, label, layouts, code, entryPoint) {
    return device.createComputePipeline({
        label, layout: device.createPipelineLayout({ bindGroupLayouts: layouts }),
        compute: { module: device.createShaderModule({ label, code }), entryPoint },
    });
}

// weather map, cloud shadow map and the camera probe read back for the HUD and near-field precipitation
class WeatherPass {
    constructor(r) {
        const d = r.device, U = GPUTextureUsage, C = GPUShaderStage.COMPUTE;
        this.device = d;
        this.weather = d.createTexture({ size: [WEATHER_RES, WEATHER_RES], format: 'rgba16float', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING | U.COPY_SRC });
        this.shadow = d.createTexture({ size: [SHADOW_RES, SHADOW_RES], format: 'rgba16float', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING | U.COPY_SRC });
        this.anvil = d.createTexture({ size: [WEATHER_RES, WEATHER_RES], format: 'rgba16float', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING });
        this.weatherView = this.weather.createView();
        this.anvilView = this.anvil.createView();
        this.layerMap = d.createTexture({ size: [WEATHER_RES, WEATHER_RES], format: 'rgba16float', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING });
        this.styleMap = d.createTexture({ size: [WEATHER_RES, WEATHER_RES], format: 'rgba16float', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING });
        this.layerView = this.layerMap.createView();
        this.styleView = this.styleMap.createView();
        this.shadowView = this.shadow.createView();

        const wSet = new BindingSet(d, ['F', 'cells']);
        const wOut = makeLayout(d, C, ['write:rgba16float', 'write:rgba16float', 'write:rgba16float', 'write:rgba16float']);
        this.pWeather = computePipeline(d, 'weather', [wSet.layout, wOut], shaderSource(wSet, WGSL_WEATHER), 'weather');
        this.wGroup = wSet.group({ F: r.frameBuf, cells: r.cellBuf }, 'weather-in');
        this.wOutGroup = makeGroup(d, wOut, [this.weatherView, this.anvilView, this.layerView, this.styleView], 'weather-out');

        const sSet = new BindingSet(d, ['F', 'shapeTex', 'detailTex', 'weatherTex', 'anvilTex', 'layerTex', 'styleTex', 'repSamp', 'clampSamp']);
        const sOut = makeLayout(d, C, ['write:rgba16float']);
        this.pShadow = computePipeline(d, 'shadow', [sSet.layout, sOut], shaderSource(sSet, WGSL_SKY, WGSL_WEATHER_SAMPLE, WGSL_DENSITY, WGSL_SHADOW), 'shadow');
        this.sGroup = sSet.group({ F: r.frameBuf, shapeTex: r.noise.shapeView, detailTex: r.noise.detailView, weatherTex: this.weatherView, anvilTex: this.anvilView, layerTex: this.layerView, styleTex: this.styleView, repSamp: r.repSamp, clampSamp: r.clampSamp }, 'shadow-in');
        this.sOutGroup = makeGroup(d, sOut, [this.shadowView], 'shadow-out');

        // occupancy grid for the march's empty-space skipping
        this.occ = makeBuffer(d, OCC_RES * OCC_RES * 4, GPUBufferUsage.STORAGE);
        const oSet = new BindingSet(d, ['F', 'weatherTex', 'anvilTex', 'layerTex', 'styleTex']);
        const oOut = makeLayout(d, C, ['storage']);
        this.pOcc = computePipeline(d, 'occupancy', [oSet.layout, oOut], shaderSource(oSet, WGSL_OCCUPANCY), 'occupancy');
        this.oGroup = oSet.group({ F: r.frameBuf, weatherTex: this.weatherView, anvilTex: this.anvilView, layerTex: this.layerView, styleTex: this.styleView }, 'occupancy-in');
        this.oOutGroup = makeGroup(d, oOut, [this.occ], 'occupancy-out');

        this.probes = [0, 1, 2].map(() => ({ buf: d.createBuffer({ size: 512, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }), busy: false }));
        this.probe = { coverage: 0, top: 0, precip: 0, virga: 0, cover: 0 };
    }

    encode(enc, probeTexel, prof, shadowSlices = 1) {
        const pass = enc.beginComputePass({ label: 'weather', timestampWrites: prof.writes('weather') });
        pass.setPipeline(this.pWeather);
        pass.setBindGroup(0, this.wGroup);
        pass.setBindGroup(1, this.wOutGroup);
        pass.dispatchWorkgroups(WEATHER_RES / 8, WEATHER_RES / 8);
        pass.setPipeline(this.pOcc);
        pass.setBindGroup(0, this.oGroup);
        pass.setBindGroup(1, this.oOutGroup);
        pass.dispatchWorkgroups(OCC_RES / 8, OCC_RES / 8);
        pass.setPipeline(this.pShadow);
        pass.setBindGroup(0, this.sGroup);
        pass.setBindGroup(1, this.sOutGroup);
        pass.dispatchWorkgroups(Math.ceil(SHADOW_RES / 8), Math.ceil(SHADOW_RES / shadowSlices / 8));
        pass.end();
        this.pending = null;
        const slot = this.probes.find(p => !p.busy);
        if (slot && probeTexel) {
            enc.copyTextureToBuffer({ texture: this.weather, origin: [probeTexel[0], probeTexel[1], 0] }, { buffer: slot.buf, bytesPerRow: 256 }, [1, 1, 1]);
            // the same place in the shadow map (same domain, coarser): the cloud above, for rainCover
            const st = probeTexel.map(t => Math.min(SHADOW_RES - 1, Math.floor((t + 0.5) * SHADOW_RES / WEATHER_RES)));
            enc.copyTextureToBuffer({ texture: this.shadow, origin: [st[0], st[1], 0] }, { buffer: slot.buf, offset: 256, bytesPerRow: 256 }, [1, 1, 1]);
            this.pending = slot;
        }
    }

    afterSubmit() {
        const slot = this.pending;
        if (!slot) return;
        slot.busy = true;
        slot.buf.mapAsync(GPUMapMode.READ).then(() => {
            const h = new Uint16Array(slot.buf.getMappedRange(0, 264));
            // cover: as rainCover in WGSL, from the shadow map's low cloud term
            const cover = smoothstep(0.03, 0.3, 1 - fromHalf(h[130]));
            this.probe = { coverage: fromHalf(h[0]), top: fromHalf(h[1]), precip: fromHalf(h[2]) * cover, virga: fromHalf(h[3]), cover };
            slot.buf.unmap();
            slot.busy = false;
        }).catch(() => { slot.busy = false; });
    }
}

// snow cover and wetness on the terrain
class GroundPass {
    constructor(r, world) {
        const d = r.device;
        this.n = GROUND_RES;
        const init = new Float32Array(this.n * this.n * 2), f = world.field, w = world.weather.cur;
        // start with snow wherever it is below freezing (mountain caps)
        for (let j = 0; j < this.n; j++) for (let i = 0; i < this.n; i++) {
            const x = f.origin + (i + 0.5) / this.n * f.size, z = f.origin + (j + 0.5) / this.n * f.size;
            const temp = w.temperature - 0.0065 * f.sample(x, z);
            init[(j * this.n + i) * 2] = smoothstep(2, -3, temp);
        }
        this.buffer = makeBuffer(d, init.byteLength, GPUBufferUsage.STORAGE, init);
        const set = new BindingSet(d, ['F', 'weatherTex', 'shadowTex', 'heightTex', 'clampSamp']);
        const out = makeLayout(d, GPUShaderStage.COMPUTE, ['storage']);
        this.pipeline = computePipeline(d, 'ground', [set.layout, out], shaderSource(set, WGSL_WEATHER_SAMPLE, WGSL_SHADOW_SAMPLE, WGSL_GROUND), 'groundUpdate');
        this.group = set.group({ F: r.frameBuf, weatherTex: r.weatherPass.weatherView, shadowTex: r.weatherPass.shadowView, heightTex: r.heightView, clampSamp: r.clampSamp }, 'ground-in');
        this.outGroup = makeGroup(d, out, [this.buffer], 'ground-out');
    }

    encode(enc, prof) {
        const pass = enc.beginComputePass({ label: 'ground', timestampWrites: prof.writes('ground') });
        pass.setPipeline(this.pipeline);
        pass.setBindGroup(0, this.group);
        pass.setBindGroup(1, this.outGroup);
        pass.dispatchWorkgroups(this.n / 8, this.n / 8);
        pass.end();
    }

    destroy() { this.buffer.destroy(); }
}

// froxel lighting volume for the precipitation and haze, filled each frame before the march
class FroxelPass {
    constructor(r) {
        const d = r.device, U = GPUTextureUsage;
        this.r = r;
        this.tex = d.createTexture({ size: FROXEL, dimension: '3d', format: 'rgba16float', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING });
        this.view = this.tex.createView({ dimension: '3d' });
        const out = makeLayout(d, GPUShaderStage.COMPUTE, ['write3d:rgba16float']);
        this.pipeline = computePipeline(d, 'froxel', [r.worldSet.layout, out],
            shaderSource(r.worldSet, WGSL_SKY, WGSL_WEATHER_SAMPLE, WGSL_DENSITY, WGSL_SHADOW_SAMPLE, WGSL_FROXEL), 'inject');
        this.group = makeGroup(d, out, [this.view], 'froxel-out');
    }

    encode(enc, prof) {
        const a = enc.beginComputePass({ label: 'froxel', timestampWrites: prof.writes('froxel') });
        a.setPipeline(this.pipeline);
        a.setBindGroup(0, this.r.worldGroup);
        a.setBindGroup(1, this.group);
        a.dispatchWorkgroups(...FROXEL.map(n => Math.ceil(n / 4)));
        a.end();
    }
}

// volumetric march at reduced resolution + temporal resolve into a ping-pong history
class CloudPass {
    constructor(r) {
        const d = r.device, C = GPUShaderStage.COMPUTE;
        this.r = r;
        this.marchOut = makeLayout(d, C, ['depth', 'write:rgba16float', 'write:r32float', 'tex3d', 'tex:uint']);
        this.resolveIO = makeLayout(d, C, ['tex', 'tex:unfilterable-float', 'tex', 'write:rgba16float']);
        const rSet = new BindingSet(d, ['F', 'clampSamp']);
        this.pMarch = computePipeline(d, 'march', [r.worldSet.layout, this.marchOut],
            shaderSource(r.worldSet, WGSL_SKY, WGSL_WEATHER_SAMPLE, WGSL_DENSITY, WGSL_SHADOW_SAMPLE, WGSL_SKIP_SAMPLE, WGSL_SHELTER, WGSL_MARCH), 'march');
        this.tileOut = makeLayout(d, C, ['write:rg32uint']);
        this.pTiles = computePipeline(d, 'tiles', [r.worldSet.layout, this.tileOut],
            shaderSource(r.worldSet, WGSL_SKY, WGSL_WEATHER_SAMPLE, WGSL_DENSITY, WGSL_SKIP_SAMPLE, WGSL_TILES), 'tiles');
        this.pResolve = computePipeline(d, 'resolve', [rSet.layout, this.resolveIO], shaderSource(rSet, WGSL_SKY, WGSL_RESOLVE), 'resolve');
        this.rGroup = rSet.group({ F: r.frameBuf, clampSamp: r.clampSamp }, 'resolve-in');
        this.cur = 0;
    }

    resize(w, h, depthView) {
        const d = this.r.device, U = GPUTextureUsage;
        for (const t of [this.color, this.depth, this.tiles, ...(this.hist || [])]) t?.destroy();
        this.w = w;
        this.h = h;
        this.color = d.createTexture({ size: [w, h], format: 'rgba16float', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING });
        this.depth = d.createTexture({ size: [w, h], format: 'r32float', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING });
        this.hist = [0, 1].map(() => d.createTexture({ size: [w, h], format: 'rgba16float', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING }));
        const hv = this.hist.map(t => t.createView());
        this.tw = Math.ceil(w / CLOUD_TILE);
        this.th = Math.ceil(h / CLOUD_TILE);
        this.tiles = d.createTexture({ size: [this.tw, this.th], format: 'rg32uint', usage: U.TEXTURE_BINDING | U.STORAGE_BINDING });
        this.tileGroup = makeGroup(d, this.tileOut, [this.tiles.createView()], 'tiles-out');
        this.marchGroup = makeGroup(d, this.marchOut, [depthView, this.color.createView(), this.depth.createView(), this.r.froxelPass.view, this.tiles.createView()], 'march-out');
        // resolveGroups[k] reads history k and writes history 1 - k
        this.resolveGroups = [0, 1].map(k => makeGroup(d, this.resolveIO, [this.color.createView(), this.depth.createView(), hv[k], hv[1 - k]], `resolve-${k}`));
        this.histViews = hv;
    }

    // interleave: march 1 of every 1, 2 or 4 pixels (in turn, each frame); the resolve fills the rest from history
    // tiles: run the cloud tile pre-pass, so the march evaluates clouds only in the distance bins it found
    encode(enc, prof, interleave, tiles) {
        if (tiles) {
            const t = enc.beginComputePass({ label: 'tiles', timestampWrites: prof.writes('tiles') });
            t.setPipeline(this.pTiles);
            t.setBindGroup(0, this.r.worldGroup);
            t.setBindGroup(1, this.tileGroup);
            t.dispatchWorkgroups(Math.ceil(this.tw / 8), Math.ceil(this.th / 8));
            t.end();
        }
        const a = enc.beginComputePass({ label: 'march', timestampWrites: prof.writes('march') });
        a.setPipeline(this.pMarch);
        a.setBindGroup(0, this.r.worldGroup);
        a.setBindGroup(1, this.marchGroup);
        const mw = interleave >= 2 ? Math.ceil(this.w / 2) : this.w, mh = interleave >= 4 ? Math.ceil(this.h / 2) : this.h;
        a.dispatchWorkgroups(Math.ceil(mw / 8), Math.ceil(mh / 8));
        a.end();
        const b = enc.beginComputePass({ label: 'resolve', timestampWrites: prof.writes('resolve') });
        b.setPipeline(this.pResolve);
        b.setBindGroup(0, this.rGroup);
        b.setBindGroup(1, this.resolveGroups[this.cur]);
        b.dispatchWorkgroups(Math.ceil(this.w / 8), Math.ceil(this.h / 8));
        b.end();
        this.cur = 1 - this.cur;
        return this.cur;          // history index that now holds this frame
    }
}

// GPU time per pass from timestamp queries (when the adapter offers them), smoothed for the HUD
class GpuProfiler {
    constructor(device, names) {
        this.names = names;
        this.ms = Object.fromEntries(names.map(n => [n, 0]));
        this.ran = new Set();       // passes encoded this frame: a skipped pass reads 0, not its last timestamps
        this.enabled = device.features.has('timestamp-query');
        if (!this.enabled) return;
        const n = names.length * 2, B = GPUBufferUsage;
        this.set = device.createQuerySet({ type: 'timestamp', count: n });
        this.resolveBuf = device.createBuffer({ size: n * 8, usage: B.QUERY_RESOLVE | B.COPY_SRC });
        this.reads = [0, 1, 2].map(() => ({ buf: device.createBuffer({ size: n * 8, usage: B.COPY_DST | B.MAP_READ }), busy: false }));
    }

    // timestampWrites for a pass descriptor
    writes(name) {
        if (!this.enabled) return undefined;
        this.ran.add(name);
        const i = this.names.indexOf(name);
        return { querySet: this.set, beginningOfPassWriteIndex: i * 2, endOfPassWriteIndex: i * 2 + 1 };
    }

    resolve(enc) {
        this.slot = this.enabled ? this.reads.find(r => !r.busy) : null;
        if (!this.slot) return;
        enc.resolveQuerySet(this.set, 0, this.names.length * 2, this.resolveBuf, 0);
        enc.copyBufferToBuffer(this.resolveBuf, 0, this.slot.buf, 0, this.names.length * 16);
    }

    afterSubmit() {
        const slot = this.slot, ran = this.ran;
        this.slot = null;
        this.ran = new Set();
        if (!slot) return;
        slot.busy = true;
        slot.buf.mapAsync(GPUMapMode.READ).then(() => {
            const t = new BigInt64Array(slot.buf.getMappedRange());
            this.names.forEach((n, i) => {
                const v = ran.has(n) ? Number(t[i * 2 + 1] - t[i * 2]) / 1e6 : 0;
                if (v >= 0 && v < 500) this.ms[n] = this.ms[n] * 0.9 + v * 0.1;
            });
            slot.buf.unmap();
            slot.busy = false;
        }).catch(() => { slot.busy = false; });
    }

    get total() { return Object.values(this.ms).reduce((a, b) => a + b, 0); }
}

// =====================================================================================================
// Renderer
// =====================================================================================================
class Renderer {
    async init(canvas) {
        if (!navigator.gpu) throw new Error('navigator.gpu is undefined');
        const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
        if (!adapter) throw new Error('No WebGPU adapter available');
        this.device = await adapter.requestDevice({ requiredFeatures: adapter.features.has('timestamp-query') ? ['timestamp-query'] : [] });
        this.profiler = new GpuProfiler(this.device, ['weather', 'ground', 'scene', 'froxel', 'tiles', 'march', 'resolve', 'final']);
        this.device.lost.then(info => { if (info.reason !== 'destroyed') this.onError?.(new Error(`GPU device lost: ${info.message}`)); });
        this.device.addEventListener('uncapturederror', e => { console.error(e.error.message); this.lastError = e.error.message; });
        this.canvas = canvas;
        this.context = canvas.getContext('webgpu');
        this.format = navigator.gpu.getPreferredCanvasFormat();
        this.context.configure({ device: this.device, format: this.format, alphaMode: 'opaque' });
        const d = this.device, B = GPUBufferUsage;
        this.frame = new FrameBlock();
        this.frameBuf = makeBuffer(d, this.frame.data.byteLength, B.UNIFORM | B.COPY_DST);
        this.cellData = new Float32Array(MAX_CELLS * CELL_FLOATS);
        this.cellBuf = makeBuffer(d, this.cellData.byteLength, B.STORAGE | B.COPY_DST);
        this.boltBuf = makeBuffer(d, MAX_BOLT_SEGS * 32, B.STORAGE | B.COPY_DST);
        this.repSamp = d.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'repeat', addressModeV: 'repeat', addressModeW: 'repeat' });
        this.clampSamp = d.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });
        this.noise = new NoiseVolumes(d);
        this.weatherPass = new WeatherPass(this);
        this.worldSet = new BindingSet(d, WORLD_BINDINGS.map(b => b[0]));
        this.froxelPass = new FroxelPass(this);
        this.cloudPass = new CloudPass(this);
        this.createPipelines();
        const gi = gridIndices(GRID_N);
        this.terrainIndex = makeBuffer(d, gi.byteLength, B.INDEX, gi);
        this.terrainCount = gi.length;
        this.width = this.height = 0;
        this.scale = 0.5;
    }

    createPipelines() {
        const d = this.device;
        this.screenLayout = makeLayout(d, GPUShaderStage.FRAGMENT, ['tex', 'tex']);
        const scene = d.createShaderModule({ label: 'scene', code: shaderSource(this.worldSet, WGSL_SKY, WGSL_WEATHER_SAMPLE, WGSL_SHADOW_SAMPLE, WGSL_SHELTER, WGSL_BUILDING, wgslBus(1), WGSL_SCENE) });
        const final = d.createShaderModule({ label: 'final', code: shaderSource(this.worldSet, WGSL_SKY, WGSL_WEATHER_SAMPLE, WGSL_SHADOW_SAMPLE, WGSL_SHELTER, WGSL_BUILDING, wgslBus(2), WGSL_FINAL) });
        const layoutA = d.createPipelineLayout({ bindGroupLayouts: [this.worldSet.layout] });
        const layoutB = d.createPipelineLayout({ bindGroupLayouts: [this.worldSet.layout, this.screenLayout] });
        // one bus's uniforms (wgslBus), at a dynamic offset per bus: group 1 in the scene pass, group 2 in the final one
        this.busLayout = d.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT,
            buffer: { type: 'uniform', hasDynamicOffset: true, minBindingSize: 208 } }] });
        const layoutBus = d.createPipelineLayout({ bindGroupLayouts: [this.worldSet.layout, this.busLayout] });
        const layoutGlass = d.createPipelineLayout({ bindGroupLayouts: [this.worldSet.layout, this.screenLayout, this.busLayout] });
        const blendAlpha = { color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' }, alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' } };
        const blendAdd = { color: { srcFactor: 'src-alpha', dstFactor: 'one' }, alpha: { srcFactor: 'one', dstFactor: 'one' } };
        const pipe = (layout, module, vs, fs, format, depth, blend, buffers) => d.createRenderPipeline({
            label: vs, layout,
            vertex: { module, entryPoint: vs, buffers },
            fragment: { module, entryPoint: fs, targets: [{ format, blend }] },
            primitive: { topology: 'triangle-list', cullMode: 'none' },
            depthStencil: { format: 'depth32float', depthWriteEnabled: depth.write, depthCompare: depth.compare },
        });
        this.pSky = pipe(layoutA, scene, 'vsSky', 'fsSky', 'rgba16float', { write: false, compare: 'always' });
        this.pTerrain = pipe(layoutA, scene, 'vsTerrain', 'fsTerrain', 'rgba16float', { write: true, compare: 'greater' });
        const structVerts = [{
            arrayStride: STRUCT_FLOATS * 4, attributes: [
                { shaderLocation: 0, offset: 0, format: 'float32x3' }, { shaderLocation: 1, offset: 12, format: 'float32x3' },
                { shaderLocation: 2, offset: 24, format: 'float32x4' }],
        }];
        this.pStruct = pipe(layoutA, scene, 'vsStruct', 'fsStruct', 'rgba16float', { write: true, compare: 'greater' }, undefined, structVerts);
        this.pBus = pipe(layoutBus, scene, 'vsBus', 'fsBus', 'rgba16float', { write: true, compare: 'greater' }, undefined, structVerts);
        // buildings (Structures.building): interiors near them, door leaves, the opaque panes far off, the glass near
        this.pInterior = pipe(layoutA, scene, 'vsStruct', 'fsInterior', 'rgba16float', { write: true, compare: 'greater' }, undefined, structVerts);
        this.pDoor = pipe(layoutA, scene, 'vsStruct', 'fsDoor', 'rgba16float', { write: true, compare: 'greater' }, undefined, structVerts);
        this.pPane = pipe(layoutA, scene, 'vsStruct', 'fsPane', 'rgba16float', { write: true, compare: 'greater' }, undefined, structVerts);
        this.pWindow = pipe(layoutB, final, 'vsWindow', 'fsWindow', this.format, { write: false, compare: 'greater' }, blendAlpha, structVerts);
        this.pComposite = pipe(layoutB, final, 'vsFull', 'fsComposite', this.format, { write: false, compare: 'always' });
        this.pGlass = pipe(layoutGlass, final, 'vsGlass', 'fsGlass', this.format, { write: false, compare: 'greater' }, blendAlpha, structVerts);
        this.pPrecip = pipe(layoutB, final, 'vsPrecip', 'fsPrecip', this.format, { write: false, compare: 'greater' }, blendAlpha);
        this.pBolt = pipe(layoutB, final, 'vsBolt', 'fsBolt', this.format, { write: false, compare: 'greater' }, blendAdd);
    }

    setWorld(world) {
        const d = this.device, f = world.field, U = GPUTextureUsage;
        this.heightMap?.destroy();
        this.landMap?.destroy();
        this.groundPass?.destroy();
        this.heightMap = d.createTexture({ size: [f.n, f.n], format: 'rgba16float', usage: U.TEXTURE_BINDING | U.COPY_DST });
        d.queue.writeTexture({ texture: this.heightMap }, f.packHeight(), { bytesPerRow: f.n * 8 }, [f.n, f.n]);
        this.landMap = d.createTexture({ size: [f.n, f.n], format: 'rgba8unorm', usage: U.TEXTURE_BINDING | U.COPY_DST });
        d.queue.writeTexture({ texture: this.landMap }, f.packLand(), { bytesPerRow: f.n * 4 }, [f.n, f.n]);
        this.heightView = this.heightMap.createView();
        this.groundPass = new GroundPass(this, world);
        this.structBuf?.destroy();
        const sv = new Float32Array(world.structures.v);
        this.structCount = sv.length / STRUCT_FLOATS;
        this.structBuf = this.structCount ? makeBuffer(d, sv.byteLength, GPUBufferUsage.VERTEX, sv) : null;
        // the buildings: their records (WGSL_BUILDING), interiors (one vertex range each, drawn near them: interiorDraws),
        // window glass and far panes, and the door leaves (rewritten when one moves: writeDoors)
        const S = world.structures, vb = arr => { const a = new Float32Array(arr); return { n: a.length / STRUCT_FLOATS, buf: a.length ? makeBuffer(d, a.byteLength, GPUBufferUsage.VERTEX, a) : null }; };
        for (const k of ['interior', 'glassV', 'paneV', 'doorV']) this[k]?.buf?.destroy();
        this.buildingBuf?.destroy();
        this.interior = vb(S.iv);
        this.glassV = vb(S.glass);
        this.paneV = vb(S.panes);
        const dm = S.doorMesh();
        this.doorV = { n: dm.length / STRUCT_FLOATS, buf: dm.length ? makeBuffer(d, dm.length * 4, GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST, new Float32Array(dm)) : null };
        const rec = new Float32Array(Math.max(1, S.buildings.length) * BUILDING_FLOATS);
        S.buildings.forEach((b, i) => rec.set(b.record, i * BUILDING_FLOATS));
        this.buildingBuf = makeBuffer(d, rec.byteLength, GPUBufferUsage.STORAGE, rec);
        this.interiorDraws = [];
        // the buses, each in its own frame: opaque mesh and glass, and its uniforms (busData, BUS_UNIFORM bytes each); the
        // app lists the ones to draw this frame in busDraws, nearest first
        for (const m of this.busMeshes || []) { m.buf?.destroy(); m.glass?.destroy(); }
        this.busMeshes = world.buses.map(b => {
            const bv = new Float32Array(b.mesh.v), gv = new Float32Array(b.mesh.glass);
            return { count: bv.length / STRUCT_FLOATS, glassCount: gv.length / STRUCT_FLOATS,
                buf: bv.length ? makeBuffer(d, bv.byteLength, GPUBufferUsage.VERTEX, bv) : null,
                glass: gv.length ? makeBuffer(d, gv.byteLength, GPUBufferUsage.VERTEX, gv) : null };
        });
        this.busUBuf?.destroy();
        this.busData = new Float32Array(Math.max(1, world.buses.length) * BUS_UNIFORM / 4);
        this.busUBuf = d.createBuffer({ size: this.busData.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
        this.busGroup = d.createBindGroup({ label: 'bus', layout: this.busLayout, entries: [{ binding: 0, resource: { buffer: this.busUBuf, size: 208 } }] });
        this.busDraws = [];
        this.worldGroup = this.worldSet.group({
            F: this.frameBuf, shapeTex: this.noise.shapeView, detailTex: this.noise.detailView, weatherTex: this.weatherPass.weatherView,
            shadowTex: this.weatherPass.shadowView, heightTex: this.heightView, landTex: this.landMap.createView(), repSamp: this.repSamp,
            clampSamp: this.clampSamp, cells: this.cellBuf, ground: this.groundPass.buffer, bolts: this.boltBuf, anvilTex: this.weatherPass.anvilView,
            layerTex: this.weatherPass.layerView, styleTex: this.weatherPass.styleView, occ: this.weatherPass.occ, buildings: this.buildingBuf,
        }, 'world');
    }

    // the door leaves as they stand now (Structures.doorMesh, same size every time)
    writeDoors(mesh) { if (this.doorV.buf) this.device.queue.writeBuffer(this.doorV.buf, 0, new Float32Array(mesh)); }

    resize(scale) {
        const c = this.canvas, dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(1, Math.floor(c.clientWidth * dpr)), h = Math.max(1, Math.floor(c.clientHeight * dpr));
        if (w === this.width && h === this.height && scale === this.scale) return false;
        this.width = c.width = w;
        this.height = c.height = h;
        this.scale = scale;
        const U = GPUTextureUsage;
        this.hdr?.destroy();
        this.depth?.destroy();
        this.hdr = this.device.createTexture({ size: [w, h], format: 'rgba16float', usage: U.RENDER_ATTACHMENT | U.TEXTURE_BINDING });
        this.depth = this.device.createTexture({ size: [w, h], format: 'depth32float', usage: U.RENDER_ATTACHMENT | U.TEXTURE_BINDING });
        this.hdrView = this.hdr.createView();
        this.depthView = this.depth.createView();
        this.cloudPass.resize(Math.max(1, Math.ceil(w * scale)), Math.max(1, Math.ceil(h * scale)), this.depthView);
        this.screenGroups = this.cloudPass.histViews.map((hv, k) => makeGroup(this.device, this.screenLayout, [hv, this.hdrView], `screen-${k}`));
        return true;
    }

    // volumetrics false (render mode 'no volumetrics'): no froxel, march or resolve; the composite shows the scene only
    render(enc, probeTexel, particles, bolts, interleave, shadowSlices, froxels, volumetrics = true, tiles = true) {
        const q = this.device.queue, prof = this.profiler;
        q.writeBuffer(this.frameBuf, 0, this.frame.data);
        q.writeBuffer(this.cellBuf, 0, this.cellData);
        if (this.busDraws.length) q.writeBuffer(this.busUBuf, 0, this.busData);
        this.weatherPass.encode(enc, probeTexel, prof, shadowSlices);
        this.groundPass.encode(enc, prof);

        const a = enc.beginRenderPass({
            label: 'scene', timestampWrites: prof.writes('scene'),
            colorAttachments: [{ view: this.hdrView, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }],
            depthStencilAttachment: { view: this.depthView, depthLoadOp: 'clear', depthStoreOp: 'store', depthClearValue: 0 },
        });
        a.setBindGroup(0, this.worldGroup);
        a.setPipeline(this.pSky);
        a.draw(3);
        a.setPipeline(this.pTerrain);
        a.setIndexBuffer(this.terrainIndex, 'uint32');
        a.drawIndexed(this.terrainCount);
        if (this.structCount) {
            a.setPipeline(this.pStruct);
            a.setVertexBuffer(0, this.structBuf);
            a.draw(this.structCount);
        }
        if (this.busDraws.length) {
            a.setPipeline(this.pBus);
            for (const k of this.busDraws) {
                const m = this.busMeshes[k];
                if (!m.count) continue;
                a.setBindGroup(1, this.busGroup, [k * BUS_UNIFORM]);
                a.setVertexBuffer(0, m.buf);
                a.draw(m.count);
            }
        }
        // buildings: interiors within INTERIOR_DRAW (vertex ranges, nearest first), door leaves, and the panes of the
        // windows further off (fsPane drops those of the near ones)
        if (this.interiorDraws.length) {
            a.setPipeline(this.pInterior);
            a.setVertexBuffer(0, this.interior.buf);
            for (const [first, count] of this.interiorDraws) a.draw(count, 1, first);
        }
        if (this.doorV.n) { a.setPipeline(this.pDoor); a.setVertexBuffer(0, this.doorV.buf); a.draw(this.doorV.n); }
        if (this.paneV.n) { a.setPipeline(this.pPane); a.setVertexBuffer(0, this.paneV.buf); a.draw(this.paneV.n); }
        a.end();

        if (froxels && volumetrics) this.froxelPass.encode(enc, prof);
        const hist = volumetrics ? this.cloudPass.encode(enc, prof, interleave, tiles) : this.cloudPass.cur;

        const b = enc.beginRenderPass({
            label: 'final', timestampWrites: prof.writes('final'),
            colorAttachments: [{ view: this.context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }],
            depthStencilAttachment: { view: this.depthView, depthReadOnly: true },
        });
        b.setBindGroup(0, this.worldGroup);
        b.setBindGroup(1, this.screenGroups[hist]);
        b.setPipeline(this.pComposite);
        b.draw(3);
        if (particles) { b.setPipeline(this.pPrecip); b.draw(6, particles); }
        // the buildings' window glass after the rain (fsWindow drops the panes of buildings beyond INTERIOR_DRAW); then
        // the buses' windows after the rain outside them (seen from inside, the drops on the glass are in front of it),
        // furthest first
        if (this.glassV.n && this.interiorDraws.length) { b.setPipeline(this.pWindow); b.setVertexBuffer(0, this.glassV.buf); b.draw(this.glassV.n); }
        if (this.busDraws.length) {
            b.setPipeline(this.pGlass);
            for (let i = this.busDraws.length - 1; i >= 0; i--) {
                const k = this.busDraws[i], m = this.busMeshes[k];
                if (!m.glassCount) continue;
                b.setBindGroup(2, this.busGroup, [k * BUS_UNIFORM]);
                b.setVertexBuffer(0, m.glass);
                b.draw(m.glassCount);
            }
        }
        if (bolts) { b.setPipeline(this.pBolt); b.draw(6, bolts); }
        b.end();
        prof.resolve(enc);
    }
}

// App
